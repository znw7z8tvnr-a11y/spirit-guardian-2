(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d');let w=0,h=0,dpr=1,t=0,last=0,flash=0,score=0,kills=0,tower=300,protect=0,lock=0,warning=null,particles=[],minions=[],boss=null,engine=null,notice='',noticeUntil=0,attackCd=0,weakCd=0,burstCd=0;const $=id=>document.getElementById(id);function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function say(s,d=1.7){notice=s;noticeUntil=t+d}function sparks(x,y,color,n=18){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=40+Math.random()*125;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.45+Math.random()*.45,color})}if(particles.length>230)particles.splice(0,particles.length-230)}function spawn(){tower=300;protect=0;lock=0;warning=null;minions=[];particles=[];const wave=+$('choose').value;boss={id:'boss-1',type:'boss',wave,x:w*.5,y:h*.31,r:42,hp:1100,maxHp:1100};engine=SG_BOSS.create({onSpawn:(e,r)=>say('⚠️ '+r.name+' 降臨',2),onPhase:(e,r)=>{say('⚡ 第二形態以上：階段 '+r.phase);sparks(boss.x,boss.y,r.color,35)},onTelegraph:(e,r,p)=>{warning={...p,remaining:p.duration,total:p.duration};say('危險預警：'+p.move,.9)},onStrike:(e,r,p)=>{warning=null;let damage=p.baseDamage;if(p.shape==='summon'){return}if(p.shape==='status'){lock=Math.max(lock,p.duration);say('法術遭到封印！');}else{if(protect>0)damage=Math.ceil(damage*.25);tower=Math.max(0,tower-damage);flash=.23;sparks(w*.5,h*.73,'#ff9a79',20);say('守護塔受到 '+damage+' 傷害',.8)}},onSummon:(e,r,p)=>{for(let i=0;i<p.count&&minions.length<8;i++)minions.push({x:boss.x+(Math.random()-.5)*160,y:boss.y+65+Math.random()*55,hp:70,angle:Math.random()*6.28});engine.setSummonCount(boss.id,minions.length);say('召喚護衛 ×'+p.count)},onBreak:()=>say('✨ 破防成功！'),onDefeat:()=>{kills++;score+=500;sparks(boss.x,boss.y,'#ffcf74',80);say('🏆 Boss 擊敗！可選擇下一位',5)},onError:(event,err)=>console.warn(event,err)});engine.attach(boss,wave);updateHud()}function updateHud(){const st=engine&&engine.get(boss.id);$('towerHp').textContent=Math.ceil(tower);$('towerFill').style.width=100*tower/300+'%';$('bossFill').style.width=100*boss.hp/boss.maxHp+'%';$('bossName').textContent=st?st.name:'已擊敗';$('phase').textContent=st?'階段 '+st.phase:'✓';$('bossStat').textContent=st?'護盾 '+Math.ceil(st.shield)+' · 失衡 '+Math.ceil(st.stagger)+' · '+(st.stunned>0?'破防':st.warning>0?'蓄力中':'戰鬥中'):'';$('kills').textContent=kills;$('score').textContent='得分 '+score}function hit(damage,element,stagger){if(!engine.get(boss.id)||tower<=0)return;const actual=engine.hit(boss.id,damage,element);engine.stagger(boss.id,stagger);score+=Math.round(actual);sparks(boss.x,boss.y,element==='ice'?'#8cecff':element==='light'?'#ffeab1':'#ef8cfd',12);for(const m of minions)m.hp-=damage*.12;minions=minions.filter(m=>m.hp>0);engine.setSummonCount(boss.id,minions.length);updateHud()}$('attack').onclick=()=>{if(t<attackCd||lock>0)return;attackCd=t+.24;hit(30,'neutral',10)};$('weak').onclick=()=>{if(t<weakCd||lock>0)return;weakCd=t+1.1;const k=+$('choose').value,element=k===4?'ice':k===8?'light':'lightning';hit(75,element,28)};$('burst').onclick=()=>{if(t<burstCd||lock>0)return;burstCd=t+5;hit(170,'neutral',52);say('💥 共振爆發！')};$('shield').onclick=()=>{protect=2.5;say('守護屏障啟動')};$('restart').onclick=spawn;$('choose').onchange=spawn;function frame(ms){requestAnimationFrame(frame);const now=ms/1000,dt=Math.min(.05,last?now-last:0);last=now;t+=dt;if(boss&&tower>0&&boss.hp>0){engine.update(dt,[boss]);if(warning)warning.remaining=Math.max(0,warning.remaining-dt);protect=Math.max(0,protect-dt);lock=Math.max(0,lock-dt);for(const m of minions){m.angle+=dt;m.x+=Math.cos(m.angle)*dt*14;if(Math.random()<dt*.14)tower=Math.max(0,tower-(protect>0?1:4))}}particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vy+=90*dt}flash=Math.max(0,flash-dt);ctx.clearRect(0,0,w,h);const bg=ctx.createRadialGradient(w*.5,h*.45,10,w*.5,h*.5,Math.max(w,h)*.65);bg.addColorStop(0,'#1c2b4e');bg.addColorStop(1,'#080b1b');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.strokeStyle='#56648a22';ctx.lineWidth=1;for(let x=0;x<w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}const tx=w*.5,ty=h*.73;ctx.save();ctx.translate(tx,ty);ctx.fillStyle='#132a43';ctx.strokeStyle=protect>0?'#8fffe6':'#8cccf1';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,-54);ctx.lineTo(42,18);ctx.lineTo(0,46);ctx.lineTo(-42,18);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#8af6ff';ctx.beginPath();ctx.arc(0,-10,14,0,Math.PI*2);ctx.fill();ctx.restore();if(warning){const p=1-warning.remaining/warning.total;ctx.save();ctx.strokeStyle='#ff5968';ctx.fillStyle='#ff415022';ctx.lineWidth=3+p*4;ctx.setLineDash([12,7]);ctx.beginPath();ctx.arc(tx,ty,60+p*35,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.setLineDash([]);ctx.restore()}for(const m of minions){ctx.fillStyle='#e597ff';ctx.beginPath();ctx.arc(m.x,m.y,10,0,Math.PI*2);ctx.fill()}if(boss&&boss.hp>0){const st=engine.get(boss.id),color=st?st.color:'#fff';ctx.save();ctx.translate(boss.x,boss.y);ctx.rotate(Math.sin(t*.6)*.08);ctx.shadowBlur=28;ctx.shadowColor=color;ctx.fillStyle='#14172e';ctx.strokeStyle=color;ctx.lineWidth=5;ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?38:53;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,0,20+Math.sin(t*3)*3,0,Math.PI*2);ctx.fill();ctx.restore();engine.draw(ctx,(x,y)=>[x,y],t)}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;if(flash){ctx.fillStyle='rgba(255,75,85,'+(flash*.45)+')';ctx.fillRect(0,0,w,h)}if(tower<=0){say('守護塔淪陷，點擊重新挑戰',999)}$('msg').textContent=t<noticeUntil?notice:'';if(Math.floor(t*10)%2===0)updateHud()}requestAnimationFrame(frame);spawn()})();
</script></body></html>
