</style></head><body><header><div><h1>✦ 靈境守衛 · 法術實體化 V20</h1><small>單次命中 · 粒子上限 · 完整暫停 · 元素連鎖 · 行動裝置優化</small></div><a href="index.html">返回遊戲</a></header><div class="layout"><main><div class="stage"><canvas id="stage" width="960" height="540" aria-label="22 種法術展示畫面"></canvas></div><div class="bar"><button id="replay">↻ 重新施放</button><button id="auto">▶ 自動輪播</button><button id="quality">畫質：高</button><button id="pause">Ⅱ 暫停</button><button id="sound">♫ 音效：開</button></div><div class="meter"><span>晶核</span><div class="track"><div class="fill" id="hpCore"></div></div><b id="coreNum">100%</b></div><div class="meter"><span>裝甲獸</span><div class="track"><div class="fill" id="hpEnemy"></div></div><b id="enemyNum">100%</b></div><h2 id="skillTitle"></h2><p id="caption"></p><div class="meta" id="status">準備中</div></main><aside><div class="tag">⚔ 22 種獨立法術演出<br>命中只觸發一次；火＋冰產生蒸氣、雷＋毒觸發毒電，預留雷水導電擴充。點擊畫面可重播。</div><h2>法術圖鑑</h2><div id="catalog"></div></aside></div><script>

function stroke(pts,c,w=3,glow=0){if(pts.length<2)return;g.save();g.lineCap='round';g.lineJoin='round';g.strokeStyle=c;g.lineWidth=w;g.shadowColor=c;g.shadowBlur=glow;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();g.restore()}

let ac;function sound(freq=160){if(!audioOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),a=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(75,ac.currentTime+.18);a.gain.setValueAtTime(.035,ac.currentTime);a.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.2);o.connect(a).connect(ac.destination);o.start();o.stop(ac.currentTime+.22)}catch(e){}}
function impact(){if(impactDone)return;impactDone=true;hitCount++;let s=dict[key],c=s[3],element=s[5],x=690,y=292;let dmg=10+Math.floor(Math.random()*13),crit=Math.random()<.2;if(crit)dmg=Math.floor(dmg*1.7);enemyHp=Math.max(0,enemyHp-dmg);damage(x,y,dmg*48,c,crit);emit(x,y,38,'#ffffff',170,.4,4);emit(x,y,55,c,300,1.1,5);ringFx(x,y,'#ffffff',65);ringFx(x,y,c,155);mark(x,395,c,element);shake=.85;white=.24;sound(element==='thunder'?120:element==='ice'?300:175);activeElements=activeElements.filter(a=>a.life>0);for(const a of activeElements){let pair=[a.type,element].sort().join('+');if(pair==='fire+ice'){comboText='♨ 蒸氣爆發';emit(x,y,45,'#d8f7ff',110,1.4,8,-35);ringFx(x,y,'#d8f7ff',180);enemyHp=Math.max(0,enemyHp-7);break}else if(pair==='poison+thunder'){comboText='⚡ 劇毒電弧';emit(x,y,40,'#a4ff7b',250,.8,4);ringFx(x,y,'#a4ff7b',180);enemyHp=Math.max(0,enemyHp-8);break}else if(pair==='thunder+water'){comboText='⚡ 導電擴散';emit(x,y,38,'#b4faff',240,.9,4);enemyHp=Math.max(0,enemyHp-6);break}}if(comboText)comboLife=1.3;activeElements.push({type:element,life:8});if(activeElements.length>8)activeElements.shift();document.querySelector('#hpEnemy').style.width=enemyHp+'%';document.querySelector('#enemyNum').textContent=enemyHp+'%';if(enemyHp===0){enemyHp=100;document.querySelector('#hpEnemy').style.width='100%';document.querySelector('#enemyNum').textContent='100%';emit(x,y,90,c,360,1.4,7);comboText='✦ 目標擊破 · 重置裝甲';comboLife=1.6}}
function choose(k,keepElements=true){key=k;t=0;prev=0;impactDone=false;cycle++;castCount++;shake=0;white=0;particles=[];rings=[];trails=[];numbers=[];emitAccumulator=0;comboText='';comboLife=0;if(!keepElements)activeElements=[];document.querySelector('#skillTitle').textContent=dict[k][1]+' '+dict[k][2];document.querySelector('#skillTitle').style.color=dict[k][3];document.querySelector('#caption').textContent=dict[k][4];for(const b of document.querySelector('#catalog').children)b.classList.toggle('active',b.dataset.key===k)}
function update(dt){prev=t;t+=dt;frameTimer+=dt;frameCount++;if(frameTimer>=1){shownFPS=Math.round(frameCount/frameTimer);frameCount=0;frameTimer=0}if(!impactDone&&prev<.48&&t>=.48)impact();if(auto&&t>2.55){let i=skills.findIndex(s=>s[0]===key);choose(skills[(i+1)%skills.length][0])}for(const e of activeElements)e.life-=dt;activeElements=activeElements.filter(e=>e.life>0);for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;p.vx*=Math.pow(.985,dt*60);p.life-=dt;if(p.life<=0)particles.splice(i,1)}for(let i=trails.length-1;i>=0;i--){trails[i].life-=dt;if(trails[i].life<=0)trails.splice(i,1)}for(let i=rings.length-1;i>=0;i--){let r=rings[i];r.r+=(r.max-r.r)*Math.min(1,dt*6);r.life-=dt;if(r.life<=0)rings.splice(i,1)}for(let i=marks.length-1;i>=0;i--){marks[i].life-=dt;if(marks[i].life<=0)marks.splice(i,1)}for(let i=numbers.length-1;i>=0;i--){let n=numbers[i];n.y+=n.vy*dt;n.vy+=65*dt;n.life-=dt;if(n.life<=0)numbers.splice(i,1)}shake=Math.max(0,shake-dt*2.6);white=Math.max(0,white-dt*1.6);comboLife=Math.max(0,comboLife-dt);if(t>.25&&t<.52){emitAccumulator+=dt*40;let amount=Math.min(3,Math.floor(emitAccumulator));emitAccumulator-=amount;let u=sm(.22,.48,t),x=mix(330,690,u),y=mix(285,292,u)-Math.sin(u*PI)*40;for(let i=0;i<amount;i++)trail(x+(Math.random()-.5)*10,y+(Math.random()-.5)*10,dict[key][3],3)}document.querySelector('#status').textContent=`V20 · ${shownFPS} FPS · 粒子 ${particles.length}/${limits[quality]} · 命中 ${hitCount} 次 · ${paused?'已暫停':auto?'自動輪播':'手動施放'}`}
function backdrop(){let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a1531');bg.addColorStop(.7,'#172544');bg.addColorStop(1,'#070d20');g.fillStyle=bg;g.fillRect(0,0,W,H);for(let i=0;i<65;i++){let x=rand(i)*W,y=rand(i*9)*340;g.globalAlpha=.25+.55*(.5+.5*Math.sin(t*1.4+i));dot(x,y,1.2+rand(i*2), '#c4e4ff',2)}g.globalAlpha=1;polygon([[0,405],[100,340],[180,380],[280,315],[410,390],[560,320],[670,390],[790,330],[960,395],[960,540],[0,540]],'#17213a');g.fillStyle='#0d1529';g.fillRect(0,405,W,135);for(let i=0;i<13;i++)stroke([[i*90,405],[i*90-25,H]],'#253754',1);for(let i=0;i<7;i++){let x=i*160-30;polygon([[x,375],[x+26,320],[x+54,375],[x+47,450],[x+5,450]],'#14223d','#294467')}circle(330,375,112,'#4bdfff',2,.32,.4);circle(690,380,100,'#d276ff',2,.3,.4);for(let i=0;i<5;i++)circle(330,310,40+i*15,'#4ceaff',1,.08+.05*Math.sin(t*2+i),1)}
function core(){g.save();g.translate(330,290);g.shadowColor='#4ceaff';g.shadowBlur=35;polygon([[0,-110],[32,-40],[0,40],[-32,-40]],'#72dfff','#d5faff');polygon([[0,-110],[32,-40],[0,40]],'#286caa');dot(0,-33,14,'#eaffff',25);g.restore();g.font='bold 14px system-ui';g.fillStyle='#a6e5ff';g.fillText('守護晶核',290,450)}
function enemy(){g.save();g.translate(690+Math.sin(t*60)*shake*11,292);g.fillStyle='#0009';g.beginPath();g.ellipse(0,88,63,18,0,0,TAU);g.fill();polygon([[-44,-10],[-32,-64],[0,-80],[35,-57],[45,-4],[27,59],[-28,59]],'#29374f','#6a83a4');polygon([[-31,-60],[0,-80],[0,43],[-23,30]],'#43516b');polygon([[0,-80],[35,-57],[45,-4],[27,59],[0,43]],'#1a2a43');polygon([[-42,-7],[-63,14],[-45,40],[-25,23]],'#62728f','#a1bad0');polygon([[42,-7],[63,14],[45,40],[25,23]],'#62728f','#a1bad0');polygon([[-28,-63],[-17,-86],[17,-86],[28,-63],[18,-37],[-18,-37]],'#6a7994','#d0dbed');dot(-13,-56,6,'#ff538e',18);dot(13,-56,6,'#ff538e',18);stroke([[-20,-17],[19,-17]],'#b795bf',4);if(shake>.1){g.globalAlpha=shake*.3;dot(0,0,85,'#ff3655',25)}g.restore();g.font='bold 14px system-ui';g.fillStyle='#dab4f4';g.fillText('深淵裝甲獸',640,450)}
function charge(){if(t>.44)return;let s=dict[key],c=s[3],el=s[5],u=sm(0,.38,t);g.save();g.globalAlpha=.3+u*.6;circle(330,285,45+u*55,c,2,1,1);for(let i=0;i<10;i++){let a=i*TAU/10+t*(el==='thunder'?7:3),r=75*(1-u)+19;let x=330+Math.cos(a)*r,y=285+Math.sin(a)*r;if(el==='ice')shard(x,y,9+u*12,a,c);else if(el==='thunder')stroke([[x-9,y+8],[x,y-7],[x+8,y+3]],c,2,9);else if(el==='fire')dot(x,y,5+u*7,'#ffb338',12);else if(el==='poison')circle(x,y,5+u*6,c,2,1,1);else dot(x,y,3+u*5,c,12)}dot(330,285,12+u*20,c,25);g.restore()}
function effect(){let s=dict[key],c=s[3],x=690,y=292,cx=330,cy=285,u=sm(.22,.48,t),fade=1-sm(.85,1.7,t),hit=sm(.43,.55,t);if(t<.44)charge();switch(key){
case 'fire':case 'spark':{let count=key==='spark'?9:1;for(let i=0;i<count;i++){let v=sm(.19+i*.027,.48+i*.027,t);if(v>=1)continue;let xx=mix(cx,x,v),yy=mix(cy,y,v)-65*Math.sin(v*PI);dot(xx,yy,key==='fire'?27:10,'#ff511d',25);dot(xx,yy,key==='fire'?14:5,'#ffdc67',18);for(let j=1;j<=5;j++)dot(xx-j*12,yy+Math.sin(j+t*8)*5,Math.max(1,9-j),c,9)}if(hit>0){circle(x,y,hit*115,c,7,fade,.7);for(let j=0;j<10;j++){let a=j*TAU/10+t*2;dot(x+Math.cos(a)*hit*90,y+Math.sin(a)*hit*50,8*fade,c,15)}}break}
case 'ice':case 'nova':case 'blizzard':{if(key==='ice'&&u<1){let xx=mix(cx,x,u),yy=mix(cy,y,u);shard(xx,yy,68,PI/2,c);for(let j=1;j<5;j++)shard(xx-j*22,yy,15+j*3,PI/2,c)}if(key==='blizzard'){for(let j=0;j<qCount(100);j++){let xx=(rand(j*3)*W+t*(j%3+1)*90)%W,yy=(rand(j*7)*H+t*160)%H;stroke([[xx,yy],[xx-22,yy+12]],'#bcefff',1.5)}}if(hit>0||key==='nova'){let r=(key==='nova'?hit*180:hit*115);for(let j=0;j<18;j++){let a=j*TAU/18;shard(x+Math.cos(a)*r,y+Math.sin(a)*r*.5,Math.max(3,30*fade),a,c)}circle(x,y,r,c,5,fade,.55)}break}
case 'lightning':case 'storm':{if(key==='storm'){for(let j=0;j<6;j++)dot(590+j*30,100+Math.sin(t*3+j)*6,60,'#35425b',13)}for(let j=0;j<(key==='storm'?6:4);j++){let st=.24+j*.13;if(t>st&&t<st+.2)bolt(key==='storm'?600+j*25:cx,key==='storm'?100:cy,x+(j-2)*22,y+Math.sin(j)*20,cycle*100+j*31+Math.floor(t*25),7)}break}
case 'poison':case 'swamp':{let r=hit*135;for(let j=0;j<18;j++){let a=j*TAU/18+t*.6,d=r*(.3+rand(j)*.7);dot(x+Math.cos(a)*d,y+Math.sin(a)*d*.4,12+Math.sin(t*6+j)*5,'#427e4b',16)}for(let j=0;j<15;j++){let phase=(t*.75+rand(j*7))%1;dot(x+(rand(j*17)-.5)*165,y+40-phase*125,(1-phase)*7+2,c,7)}break}
case 'meteor':{for(let i=0;i<6;i++){let v=sm(.1+i*.08,.46+i*.08,t),xx=495+i*49,yy=-90+470*v;if(v<1){dot(xx,yy,23,'#ff5522',25);dot(xx,yy,12,'#ffe2a1',14);for(let j=1;j<=5;j++)dot(xx+j*8,yy-j*17,Math.max(2,13-j*2),c,9)}else if(t<.9+i*.08)circle(xx,375,65*sm(.45+i*.08,.75+i*.08,t),c,5,fade,.4)}break}
case 'arcane':case 'orbit':{let count=key==='orbit'?5:8;for(let j=0;j<count;j++){let a=j*TAU/count+t*7,v=sm((key==='orbit'?.5:.2)+j*.035,(key==='orbit'?.85:.55)+j*.035,t),xx=mix(cx,x,v)+Math.cos(a)*65*(1-v),yy=mix(cy,y,v)+Math.sin(a)*50*(1-v);dot(xx,yy,12,c,22);dot(xx,yy,4,'#fff',8);circle(xx,yy,17,c,1,.6,1)}break}
case 'sword':case 'pierce':{let xx=mix(cx,x,u),yy=mix(cy,y,u);if(key==='sword'){for(let j=0;j<3;j++){g.save();g.translate(xx,yy+Math.sin(t*14+j*2)*18);g.rotate(t*14+j*2);shard(0,0,75,0,c);g.restore()}}else{shard(xx,yy,85,PI/2,c);for(let j=0;j<5;j++)stroke([[xx-j*25,yy-8],[xx-j*25-40,yy-8]],c,Math.max(1,5-j),12)}break}
case 'earth':case 'thorn':case 'lava':{for(let i=0;i<10;i++){let xx=510+i*31,v=sm(.27+i*.04,.53+i*.04,t),h=110*v*fade;if(key==='earth')polygon([[xx-15,390],[xx,390-h],[xx+17,390]],'#9a8978','#dec4a4');else if(key==='lava'){stroke([[xx,390],[xx+Math.sin(i)*9,390-h]],'#ff5922',14,20);dot(xx,390-h,12,'#ffc057',17)}else{stroke([[xx,390],[xx+Math.sin(i+t*5)*18,390-h*.6],[xx+Math.cos(i)*15,390-h]],'#6abb68',9,8);for(let j=0;j<3;j++)polygon([[xx+j*5,390-h*.3-j*15],[xx+12+j*5,380-h*.3-j*15],[xx+j*5,377-h*.3-j*15]],'#b5e783')}}break}
case 'wind':case 'gravity':{for(let j=0;j<9;j++){g.save();g.translate(x,y);g.rotate(t*4+j*.7);g.strokeStyle=c;g.lineWidth=4;g.globalAlpha=fade*.8;g.beginPath();g.ellipse(0,0,20+j*15,(20+j*15)*.5,0,.2,PI*1.55);g.stroke();g.restore()}if(key==='gravity'){dot(x,y,35+hit*18,'#02030a',30);circle(x,y,55+hit*24,'#d6baff',6,fade,1)}else for(let j=0;j<20;j++){let a=j*.75+t*5,r=35+j%6*18;dot(x+Math.cos(a)*r,y+Math.sin(a)*r*.5,3,c,5)}break}
case 'beam':{if(t>.23){let v=sm(.23,.48,t),endX=mix(cx,x,v),endY=mix(cy,y,v),width=(7+v*23)*fade;stroke([[cx,cy],[endX,endY]],'#ffe77b',width+23,28);stroke([[cx,cy],[endX,endY]],'#fff',width,18);dot(x,y,hit*45*fade,'#fff5b2',30)}break}
case 'summon':case 'skeleton':{let v=sm(.23,.49,t);circle(x,y+68,90,c,3,fade,.4);for(let j=0;j<8;j++){let a=j*TAU/8+t;dot(x+Math.cos(a)*70,y+68+Math.sin(a)*24,4,c,9)}g.save();g.translate(x,y+75-v*115);g.globalAlpha=v*fade;if(key==='summon'){polygon([[-36,-45],[0,-92],[35,-45],[48,65],[0,40],[-48,65]],'#a5efff77');dot(-13,-49,5,'#fff',15);dot(13,-49,5,'#fff',15);stroke([[28,-12],[62,-65],[90,-35]],'#e6ffff',8,18)}else{dot(0,-55,26,'#e9e3d6',10);dot(-10,-57,7,'#161923');dot(10,-57,7,'#161923');stroke([[0,-28],[0,42]],'#e9e3d6',11);stroke([[-15,10],[-35,38]],'#e9e3d6',8);stroke([[15,10],[40,-35],[65,-75]],'#e9e3d6',8);stroke([[-12,42],[-24,70]],'#e9e3d6',8);stroke([[12,42],[24,70]],'#e9e3d6',8)}g.restore();break}
}if(t>.47&&t<.72){g.save();g.globalAlpha=(1-sm(.47,.72,t))*.8;dot(x,y,35+hit*40,'#fff',32);g.restore()}}
function overlay(){for(const m of marks){let a=m.life/m.max;g.save();g.globalAlpha=a*.65;g.fillStyle=m.kind==='ice'?'#4d9da8':m.kind==='fire'?'#6e2a12':m.kind==='poison'?'#356f3a':m.c;g.beginPath();g.ellipse(m.x,m.y,65,18,0,0,TAU);g.fill();if(m.kind==='ice')for(let j=0;j<7;j++){let ang=j*TAU/7+m.seed;stroke([[m.x,m.y],[m.x+Math.cos(ang)*55,m.y+Math.sin(ang)*14]],'#c6faff',2)}if(m.kind==='fire')for(let j=0;j<7;j++){let xx=m.x+(rand(j+m.seed)-.5)*100;dot(xx,m.y-5-Math.sin(t*8+j)*5,3+rand(j)*4,'#ff7a2b',12)}g.restore()}for(const r of rings)circle(r.x,r.y,r.r,r.c,5*r.life/r.maxLife,r.life/r.maxLife,.65);for(const p of trails){g.save();g.globalAlpha=p.life/.45*.6;dot(p.x,p.y,p.r*p.life/.45,p.c,9);g.restore()}for(const p of particles){g.save();g.globalAlpha=clamp(p.life/p.max);dot(p.x,p.y,p.size*clamp(p.life/p.max),p.c,8);g.restore()}for(const n of numbers){g.save();g.globalAlpha=clamp(n.life);g.font=`900 ${n.crit?34:25}px system-ui`;g.textAlign='center';g.strokeStyle='#070b17';g.lineWidth=6;g.strokeText(n.n,n.x,n.y);g.fillStyle=n.crit?'#ffe16d':n.c;g.shadowColor=n.c;g.shadowBlur=18;g.fillText(n.n,n.x,n.y);if(n.crit){g.font='bold 14px system-ui';g.fillText('暴擊',n.x,n.y-27)}g.restore()}if(comboLife>0){g.save();g.globalAlpha=clamp(comboLife);g.font='900 31px system-ui';g.textAlign='center';g.strokeStyle='#050719';g.lineWidth=8;g.strokeText(comboText,W/2,110);g.fillStyle='#fff3ad';g.shadowColor='#ffc96a';g.shadowBlur=18;g.fillText(comboText,W/2,110);g.restore()}if(white>0){g.fillStyle=`rgba(235,248,255,${white*.32})`;g.fillRect(0,0,W,H)}}
function render(now){let dt=Math.min(.05,(now-clock)/1000);clock=now;if(!paused)update(dt);g.save();if(shake>0){g.translate((Math.random()-.5)*shake*20,(Math.random()-.5)*shake*15)}backdrop();core();enemy();effect();overlay();g.restore();requestAnimationFrame(render)}
const catalog=document.querySelector('#catalog');for(const s of skills){let b=document.createElement('button');b.textContent=s[1]+' '+s[2];b.dataset.key=s[0];b.onclick=()=>choose(s[0]);catalog.appendChild(b)}document.querySelector('#replay').onclick=()=>choose(key);document.querySelector('#auto').onclick=e=>{auto=!auto;e.currentTarget.textContent=auto?'■ 停止輪播':'▶ 自動輪播';if(auto)choose(key)};document.querySelector('#quality').onclick=e=>{quality=quality==='high'?'medium':quality==='medium'?'low':'high';e.currentTarget.textContent='畫質：'+({high:'高',medium:'中',low:'低'}[quality]);if(particles.length>limits[quality])particles.splice(0,particles.length-limits[quality])};document.querySelector('#pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶ 繼續':'Ⅱ 暫停'};document.querySelector('#sound').onclick=e=>{audioOn=!audioOn;e.currentTarget.textContent=audioOn?'♫ 音效：開':'♫ 音效：關'};C.onclick=()=>choose(key);choose('fire');requestAnimationFrame(render);
</script></body></html>
