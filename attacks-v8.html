<script>

];
const byKey=Object.fromEntries(skills.map(s=>[s[0],s]));
const reactions={'fire+ice':['融化',1.3,'#ffaa55'],'thunder+wind':['導電',1.4,'#b7a6ff'],'earth+fire':['熔岩爆發',1.5,'#ff5d1d'],'poison+fire':['毒爆',1.35,'#a0ee85'],'ice+thunder':['超導',1.4,'#86ecff']};
const $=id=>document.getElementById(id),clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,smooth=(a,b,x)=>{let t=clamp((x-a)/(b-a));return t*t*(3-2*t)},rnd=n=>{let v=Math.sin(n*127.1+13.7)*43758.5453;return v-Math.floor(v)};
function disc(x,y,r,c,glow=0){if(r<=0)return;g.save();g.fillStyle=c;g.shadowColor=c;g.shadowBlur=glow;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.restore()}
function line(pts,c,w=3,glow=0){g.save();g.lineCap='round';g.lineJoin='round';g.strokeStyle=c;g.lineWidth=w;g.shadowColor=c;g.shadowBlur=glow;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke();g.restore()}
function poly(pts,fill,stroke=null,w=2){g.save();g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}g.restore()}
function ring(x,y,r,c,w=3,alpha=1,ellipse=.55){if(r<=0)return;g.save();g.globalAlpha=clamp(alpha);g.translate(x,y);g.scale(1,ellipse);g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.arc(0,0,r,0,TAU);g.stroke();g.restore()}
function crystal(x,y,s,angle=0){g.save();g.translate(x,y);g.rotate(angle);g.scale(s,s);poly([[0,-72],[23,-12],[14,48],[0,76],[-14,48],[-23,-12]],'#baf6ff','#fff',2);poly([[0,-72],[23,-12],[0,55]],'#63c3ef');poly([[0,-72],[-23,-12],[0,55]],'#417fba');line([[0,-60],[0,60]],'#fff',2);g.restore()}
function flame(x,y,r,seed){g.save();g.translate(x,y);g.rotate(seed);g.shadowColor='#ff4b13';g.shadowBlur=24;for(let j=0;j<3;j++){let pts=[];for(let i=0;i<22;i++){let a=i*TAU/22,rr=r*(1-j*.27)*(.72+.24*Math.sin(i*3.2+seed*7+j));pts.push([Math.cos(a)*rr,Math.sin(a)*rr])}poly(pts,['#ff4219','#ffb22b','#fff4bd'][j])}g.restore()}
function bolt(x1,y1,x2,y2,seed,w=6){let pts=[];for(let i=0;i<=12;i++){let u=i/12;pts.push([lerp(x1,x2,u)+(i===0||i===12?0:(rnd(seed+i*3)-.5)*44),lerp(y1,y2,u)+(i===0||i===12?0:(rnd(seed+i*7)-.5)*38)])}line(pts,'#7476ff',w+11,24);line(pts,'#9aeaff',w,16);line(pts,'#fff',Math.max(1,w*.3),10)}
function sigil(x,y,t,c,r){g.save();g.translate(x,y);g.rotate(t*.6);ring(0,0,r,c,3,1,1);ring(0,0,r*.66,c,2,1,1);for(let i=0;i<8;i++){let a=i*TAU/8;disc(Math.cos(a)*r*.85,Math.sin(a)*r*.85,3,c,8)}g.restore()}
const baseEnemies=[{x:690,y:292,maxHp:8000,type:'armor',name:'深淵裝甲獸'},{x:820,y:330,maxHp:5000,type:'demon',name:'暗影魔兵'},{x:560,y:350,maxHp:3500,type:'imp',name:'小惡魔'}];
let enemies=[],projectiles=[],particles=[],rings=[],numbers=[],events=[],cooldowns={},stats={},heroLevel=1,heroExp=0,coreHp=1000,coreMax=1000;
let current='fire',elapsed=0,castId=0,hitTriggered=false,auto=false,paused=false,quality='high',last=performance.now(),attackTimer=2.5,shake=0,flash=0,comboCount=0,comboTimer=0,lastCastElement=null,lastCastAt=-999,clock=0,ended=false,castReaction=null;
function initEnemies(){enemies=baseEnemies.map(e=>({...e,hp:e.maxHp,displayHp:e.maxHp,alive:true,respawn:0,hitFlash:0}))}
function addParticles(x,y,n,color,speed=180,life=.8){let mul=quality==='low'?.25:quality==='medium'?.55:1;n=Math.ceil(n*mul);for(let i=0;i<n;i++){let a=Math.random()*TAU,sp=speed*(.3+Math.random()*.7);particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life,max:life,color,r:2+Math.random()*4})}if(particles.length>550)particles.splice(0,particles.length-550)}
function addRing(x,y,c,max=120){rings.push({x,y,c,r:5,max,life:.6})}
function addNumber(x,y,n,c,crit,reaction){numbers.push({x:x+(Math.random()-.5)*28,y:y-34,n,c,crit,reaction,life:1.05,vy:-70});if(numbers.length>60)numbers.shift()}
function schedule(delay,fn){events.push({at:clock+delay,fn,id:castId})}
function refreshStats(){let fields={statDmg:stats.totalDmg,statMax:stats.maxHit,statHits:stats.hits,statCombo:stats.maxCombo,statCrit:stats.crits,statCast:stats.casts,statKills:stats.kills,statExp:heroExp};for(let [id,v] of Object.entries(fields))$(id).textContent=Number(v).toLocaleString();$('heroLevel').textContent='⚔ 戰鬥統計 · Lv.'+heroLevel;$('coreHpFill').style.width=(coreHp/coreMax*100)+'%';$('coreHpText').textContent=Math.ceil(coreHp)+'/'+coreMax}
function targetList(k){let alive=enemies.filter(e=>e.alive);if(['lightning','storm','blizzard','nova','meteor','wind','gravity','poison','swamp','pierce'].includes(k))return alive;return alive.length?[alive[0]]:[]}
function reactionFor(prev,next){return reactions[prev+'+'+next]||reactions[next+'+'+prev]||null}
function damageEnemy(e,base,c,reaction=null){if(!e.alive||ended)return;let crit=Math.random()<.28,dmg=Math.floor(base*(.85+Math.random()*.3)*(crit?1.8:1)*(reaction?reaction[1]:1));e.hp=Math.max(0,e.hp-dmg);e.hitFlash=.3;stats.totalDmg+=dmg;stats.maxHit=Math.max(stats.maxHit,dmg);stats.hits++;if(crit)stats.crits++;comboCount++;comboTimer=1.5;stats.maxCombo=Math.max(stats.maxCombo,comboCount);addNumber(e.x,e.y,dmg,c,crit,reaction);addParticles(e.x,e.y,crit?24:14,c,250,.8);addRing(e.x,e.y,c,crit?125:85);shake=Math.max(shake,crit?10:6);flash=.09;if(e.hp<=0){e.alive=false;e.respawn=3.5;stats.kills++;heroExp+=50;addParticles(e.x,e.y,40,c,330,1.4);addRing(e.x,e.y,'#fff',180);if(heroExp>=heroLevel*100){heroExp-=heroLevel*100;heroLevel++;addParticles(330,285,45,'#ffe066',250,1.4)}}refreshStats()}
function resolveHit(k){const c=byKey[k][3],targets=targetList(k);if(!targets.length)return;let base=800+Math.random()*1000+heroLevel*140;for(let i=0;i<targets.length;i++)damageEnemy(targets[i],base*(i? .65:1),c,castReaction);let multi=['meteor','storm','spark','beam','arcane','orbit','poison','swamp'].includes(k)?3:0;for(let i=1;i<=multi;i++){schedule(i*.17,()=>{let e=targets[i%targets.length];if(e?.alive)damageEnemy(e,base*.28,c,null)})}}
function cast(k,{force=false}={}){if(!byKey[k]||ended)return false;if(!force&&cooldowns[k]>0)return false;castId++;events=[];elapsed=0;hitTriggered=false;current=k;cooldowns[k]=byKey[k][5]/1000;stats.casts++;const element=byKey[k][6];castReaction=(lastCastElement&&clock-lastCastAt<=2)?reactionFor(lastCastElement,element):null;lastCastElement=element;lastCastAt=clock;stats.maxCombo=Math.max(stats.maxCombo,comboCount);$('skillTitle').textContent=byKey[k][1]+' '+byKey[k][2];$('skillTitle').style.color=byKey[k][3];$('caption').textContent=byKey[k][4];$('status').textContent=castReaction?'元素反應：'+castReaction[0]+'！':'V8 · 可操作戰鬥 · 命中一次判定 · 真正晶核防禦';for(let b of $('catalog').children)b.classList.toggle('active',b.dataset.key===k);refreshStats();updateCooldownUI();return true}
function updateCooldownUI(){for(let b of $('catalog').children){let k=b.dataset.key,cd=cooldowns[k];b.querySelector('.cd').style.width=(cd/(byKey[k][5]/1000)*100)+'%';b.style.opacity=cd>0?.6:1}for(let b of $('heroBar').children){let k=b.dataset.key,cd=cooldowns[k];b.classList.toggle('active',k===current);b.classList.toggle('cooling',cd>0);b.querySelector('i').textContent=cd>0?cd.toFixed(1):''}}
function endBattle(){ended=true;auto=false;$('auto').textContent='▶ 自動輪播';$('overlay').classList.add('show');$('endTitle').textContent='晶核已被攻破';$('endDetail').textContent='總傷害 '+stats.totalDmg.toLocaleString()+' · 擊殺 '+stats.kills+' · 最高連擊 '+stats.maxCombo}
function update(dt){clock+=dt;elapsed+=dt;for(let k in cooldowns)cooldowns[k]=Math.max(0,cooldowns[k]-dt);if(!hitTriggered&&elapsed>=.47){hitTriggered=true;resolveHit(current)}for(let i=events.length-1;i>=0;i--){let ev=events[i];if(clock>=ev.at){events.splice(i,1);if(ev.id===castId)ev.fn()}}for(let e of enemies){e.displayHp=lerp(e.displayHp,e.hp,clamp(dt*8));e.hitFlash=Math.max(0,e.hitFlash-dt*3);if(!e.alive){e.respawn-=dt;if(e.respawn<=0){e.hp=e.maxHp;e.displayHp=e.hp;e.alive=true;addParticles(e.x,e.y,20,'#a7f8ed')}}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}for(let i=rings.length-1;i>=0;i--){let r=rings[i];r.r+=(r.max-r.r)*clamp(dt*7);r.life-=dt;if(r.life<=0)rings.splice(i,1)}for(let i=numbers.length-1;i>=0;i--){let n=numbers[i];n.y+=n.vy*dt;n.vy+=80*dt;n.life-=dt;if(n.life<=0)numbers.splice(i,1)}attackTimer-=dt;if(attackTimer<=0){attackTimer=2.3+Math.random()*1.4;let alive=enemies.filter(e=>e.alive);if(alive.length){let e=alive[Math.floor(Math.random()*alive.length)],dx=330-e.x,dy=285-e.y,dist=Math.hypot(dx,dy);projectiles.push({x:e.x,y:e.y,vx:dx/dist*160,vy:dy/dist*160,life:4})}}for(let i=projectiles.length-1;i>=0;i--){let p=projectiles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(Math.hypot(p.x-330,p.y-285)<35){projectiles.splice(i,1);coreHp=Math.max(0,coreHp-65);addRing(330,285,'#ff4b87',90);addParticles(330,285,15,'#ff4b87');shake=8;refreshStats();if(coreHp<=0)endBattle();continue}if(p.life<=0)projectiles.splice(i,1)}shake=Math.max(0,shake-dt*24);flash=Math.max(0,flash-dt*.5);comboTimer-=dt;if(comboTimer<=0)comboCount=0;if(auto&&elapsed>=2.5){let idx=skills.findIndex(s=>s[0]===current);let next=skills.slice(idx+1).concat(skills.slice(0,idx+1)).find(s=>cooldowns[s[0]]<=0);if(next)cast(next[0])}updateCooldownUI()}
function background(t){let grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#0b1633');grad.addColorStop(.7,'#152043');grad.addColorStop(1,'#070e21');g.fillStyle=grad;g.fillRect(0,0,W,H);for(let i=0;i<65;i++){g.globalAlpha=.3+.4*Math.sin(t*2+i)**2;disc(rnd(i)*W,rnd(i*4)*H*.8,1+rnd(i*2)*1.5,'#a9d7ff',3)}g.globalAlpha=1;g.fillStyle='#17243c';g.beginPath();g.moveTo(0,400);for(let i=0;i<=12;i++)g.lineTo(i*90,360+35*Math.sin(i*2.3));g.lineTo(W,H);g.lineTo(0,H);g.fill();for(let i=0;i<8;i++){let x=i*145-20;poly([[x,360],[x+27,330],[x+54,360],[x+48,490],[x+4,490]],'#14213b','#253d5e')}g.fillStyle='#11182b';g.fillRect(0,405,W,135);for(let i=0;i<14;i++)line([[i*80,408],[i*80-20,H]],'#2a3451',1);ring(330,365,108,'#3886b7',2,.55);ring(330,365,68,'#6ac9e3',2,.45);g.save();g.translate(328,285);g.shadowColor='#55d5ff';g.shadowBlur=30;poly([[0,-90],[29,-35],[0,20],[-29,-35]],'#71e4ff','#d9ffff',3);poly([[0,-90],[29,-35],[0,20]],'#3178bd');g.restore();g.fillStyle='#aecfff';g.font='bold 14px system-ui';g.fillText('守護晶核',285,448)}
function enemy(e){if(!e.alive)return;g.save();g.translate(e.x,e.y);g.fillStyle='#000a';g.beginPath();g.ellipse(0,60,45,14,0,0,TAU);g.fill();if(e.type==='armor'){poly([[-43,-12],[-33,-62],[0,-78],[37,-55],[44,-5],[25,56],[-25,56]],'#27354f','#5c7798',5);poly([[-33,-59],[0,-78],[0,43],[-22,32]],'#364765');poly([[0,-78],[36,-55],[44,-5],[25,56],[0,43]],'#1b2a41');poly([[-42,-6],[-63,11],[-48,37],[-25,22]],'#4c5877','#9aa6c6');poly([[42,-6],[63,11],[48,37],[25,22]],'#4c5877','#9aa6c6');poly([[-27,-62],[-15,-85],[15,-85],[27,-62],[17,-36],[-17,-36]],'#63728e','#b5bed8');disc(-12,-57,6,'#ff4b87',14);disc(12,-57,6,'#ff4b87',14)}else if(e.type==='demon'){poly([[-30,-40],[0,-70],[30,-40],[25,40],[-25,40]],'#4a1a5c','#9e4ab5',4);poly([[-30,-40],[-60,-60],[-50,-20]],'#3a1048','#9e4ab5');poly([[30,-40],[60,-60],[50,-20]],'#3a1048','#9e4ab5');disc(-10,-50,6,'#ff4b87',12);disc(10,-50,6,'#ff4b87',12)}else{disc(0,0,28,'#5c2a1a',8);poly([[-15,-25],[-8,-40],[0,-25]],'#ff6b3d');poly([[15,-25],[8,-40],[0,-25]],'#ff6b3d');disc(-9,-6,4,'#ff4b87',10);disc(9,-6,4,'#ff4b87',10)}if(e.hitFlash>0){g.globalAlpha=e.hitFlash;disc(0,-15,55,'#fff',25)}g.restore();let bx=e.x-55,by=e.y-110;g.fillStyle='#0b1025';g.fillRect(bx-2,by-2,114,13);g.fillStyle=e.type==='armor'?'#ff5577':e.type==='demon'?'#b867e9':'#ff9a4a';g.fillRect(bx,by,110*clamp(e.displayHp/e.maxHp),9);g.fillStyle='#fff';g.font='bold 10px system-ui';g.textAlign='center';g.fillText(e.name,e.x,by-7);g.textAlign='left'}
function drawSpell(k,t){const col=byKey[k][3],cx=330,cy=285,tx=690,ty=292,travel=smooth(.15,.47,t),impact=smooth(.43,.56,t),fade=1-smooth(.8,1.65,t);if(t<.4){g.save();g.globalAlpha=smooth(0,.15,t)*(1-smooth(.32,.42,t));sigil(cx,cy,t,col,55+60*smooth(0,.35,t));g.restore()}if(t>.15&&t<.8){for(let e of enemies){if(!e.alive)continue;ring(e.x,e.y,25+60*smooth(.1,.45,t),col,2,.2+.4*fade,1)}}switch(k){case 'fire':case 'spark':case 'meteor':{let n=k==='meteor'?5:k==='spark'?9:1;for(let i=0;i<n;i++){let d=k==='meteor'?i*.11:k==='spark'?i*.035:0,u=smooth(.14+d,.48+d,t),x=k==='meteor'?460+i*56:lerp(cx,tx,u),y=k==='meteor'?-100+420*u+(i%2)*30:cy-75*Math.sin(u*PI);if(u<1)flame(x,y,k==='meteor'?33:k==='spark'?12:45,t*4+i);else if(t<.95+d)flame(k==='meteor'?460+i*56:tx,k==='meteor'?310+(i%2)*30:ty,(k==='spark'?20:55)*fade,t*7+i)}break}
case 'ice':case 'nova':case 'blizzard':{if(k==='ice'){if(travel<1){crystal(lerp(cx,tx,travel),cy-20,1.1,PI/2);for(let j=0;j<4;j++)crystal(lerp(cx,tx,travel)-25-j*18,cy-20,.15+j*.07,PI/2)}else for(let j=0;j<12;j++){let a=j*TAU/12;crystal(tx+Math.cos(a)*impact*95,ty+Math.sin(a)*impact*60,.35+.35*fade,a)}}else if(k==='nova'){for(let j=0;j<18;j++){let a=j*TAU/18;crystal(tx+Math.cos(a)*impact*180,ty+Math.sin(a)*impact*85,.4+.5*fade,a)}ring(tx,ty,impact*190,col,7,fade)}else{let n=quality==='low'?35:quality==='medium'?65:110;for(let j=0;j<n;j++){let x=((rnd(j*3)+t*.22*(j%3+1))%1)*W,y=((rnd(j*7)+t*.4)%1)*H;line([[x,y],[x-22,y+14]],'#b9efff',1.5)}}break}
case 'lightning':case 'storm':{let n=k==='storm'?6:3;for(let j=0;j<n;j++){let start=.25+j*.14;if(t>start&&t<start+.2){if(k==='storm'){for(let q=0;q<5;q++)disc(520+q*50,95+Math.sin(q)*12,55,'#37435d',6);bolt(600+j*24,100,tx+(j-2)*30,ty,Math.floor(t*28)*20+j,8)}else bolt(cx,cy,tx+(j-1)*40,ty+(j%2)*40,Math.floor(t*28)*20+j,8)}}break}
case 'sword':case 'pierce':{for(let j=0;j<(k==='sword'?3:1);j++){let x=lerp(cx,tx,travel),y=cy+Math.sin(t*17+j*2)*25;g.save();g.translate(x,y);g.rotate(k==='sword'?t*15+j*2:PI/2);poly([[0,-75],[24,-22],[12,25],[0,70],[-12,25],[-24,-22]],'#f5faff','#f9d28a',4);poly([[0,-75],[24,-22],[0,55]],'#ffcf78');g.restore();line([[x-85,y],[x-12,y]],col,5,20)}break}
case 'earth':case 'lava':case 'thorn':{let n=k==='earth'?9:k==='thorn'?8:7;for(let i=0;i<n;i++){let x=510+i*33,u=smooth(.27+i*.045,.53+i*.045,t),height=(k==='lava'?55:105)*u*fade;if(k==='earth')poly([[x-16,380],[x,380-height],[x+19,380]],'#887c73','#e4c7a5',3);else if(k==='thorn'){line([[x,390],[x+Math.sin(i+t*5)*24,390-height*.65],[x+Math.cos(i)*15,390-height]],'#63b45d',9,8);for(let j=0;j<3;j++)poly([[x-5+j*8,360-j*13],[x+15+j*8,348-j*13],[x+3+j*8,365-j*13]],'#b9e985')}else{line([[x,387],[x+Math.sin(i)*8,360-height]],'#ff5d1d',15,28);flame(x,365-height,18,t+i)}}break}
case 'wind':case 'gravity':{for(let j=0;j<9;j++){let r=20+j*15*(k==='gravity'?fade:1);g.save();g.translate(tx,ty);g.rotate(t*4+j*.8);g.strokeStyle=col;g.lineWidth=5-j*.25;g.globalAlpha=fade*.85;g.beginPath();g.ellipse(0,0,r,r*.48,0,.2,PI*1.55);g.stroke();g.restore()}if(k==='gravity'){disc(tx,ty,36+impact*22,'#02030b',40);ring(tx,ty,50+impact*25,'#e5baff',8,fade,1)}else for(let j=0;j<22;j++){let a=j*.75+t*5,r=30+(j%6)*20;disc(tx+Math.cos(a)*r,ty+Math.sin(a)*r*.6,4,'#c4e5e8',6)}break}
case 'beam':{if(t>.24){let u=smooth(.24,.48,t),w=(8+u*30)*fade;line([[cx,cy],[lerp(cx,tx,u),lerp(cy,ty,u)]],'#fff3a0',w+28,36);line([[cx,cy],[lerp(cx,tx,u),lerp(cy,ty,u)]],'#fff',w,22);disc(tx,ty,38*impact*fade,'#fff3aa',36)}break}
case 'arcane':case 'orbit':{let n=k==='arcane'?8:5;for(let j=0;j<n;j++){let a=j*TAU/n+t*7,u=k==='arcane'?smooth(.22+j*.035,.52+j*.035,t):smooth(.5,.8,t),x=lerp(cx,tx,u)+Math.cos(a)*65*(1-u),y=lerp(cy,ty,u)+Math.sin(a)*50*(1-u);disc(x,y,14,col,28);disc(x,y,5,'#fff',14)}break}
case 'poison':case 'swamp':{g.save();g.globalAlpha=.7*fade;for(let j=0;j<10;j++){let a=j*TAU/10,r=impact*(k==='swamp'?140:95);disc(tx+Math.cos(a)*r,ty+Math.sin(a)*r*.45,22+8*Math.sin(t*7+j),'#3b8f4b',18)}g.restore();for(let j=0;j<25;j++)disc(tx+(rnd(j*7)-.5)*180,ty+40-(t*40+j*23)%130,3+rnd(j)*7,'#a3ff91',10);break}
case 'summon':case 'skeleton':{let u=smooth(.23,.48,t);sigil(tx,ty+65,t*.5,col,95);g.save();g.translate(tx,ty+65-u*120);g.globalAlpha=u*fade;if(k==='summon'){g.fillStyle='#a2eaff88';g.beginPath();g.moveTo(-36,-55);g.quadraticCurveTo(0,-110,35,-55);g.lineTo(50,65);g.quadraticCurveTo(0,35,-50,65);g.closePath();g.fill();disc(-12,-58,5,'#fff',16);disc(12,-58,5,'#fff',16);line([[25,-15],[55,-65],[85,-35]],'#e2ffff',9,24)}else{disc(0,-55,28,'#e9e3d6',12);disc(-10,-57,7,'#1c1622');disc(10,-57,7,'#1c1622');line([[-35,0],[35,0]],'#e9e3d6',11);line([[0,-30],[0,45]],'#e9e3d6',12);line([[-15,10],[-36,40]],'#e9e3d6',8);line([[15,10],[40,-40]],'#e9e3d6',8);line([[-12,42],[-25,70]],'#e9e3d6',8);line([[12,42],[25,70]],'#e9e3d6',8);line([[40,-40],[65,-85]],'#d8d6d1',6,14)}g.restore();break}}
if(t>.46&&t<.67){g.save();g.globalAlpha=(1-smooth(.46,.67,t))*.65;disc(tx,ty,25+impact*50,'#fff',40);g.restore()}}
function drawEffects(){for(let r of rings){g.save();g.globalAlpha=clamp(r.life/.6)*.8;ring(r.x,r.y,r.r,r.c,6,1,1);g.restore()}for(let p of particles){g.save();g.globalAlpha=clamp(p.life/.8);disc(p.x,p.y,p.r,p.color,8);g.restore()}for(let p of projectiles){disc(p.x,p.y,8,'#ff4b6e',18);disc(p.x,p.y,3,'#fff',8)}for(let n of numbers){g.save();g.globalAlpha=clamp(n.life*1.7);g.textAlign='center';g.font=`900 ${n.crit?28:20}px system-ui`;g.lineWidth=5;g.strokeStyle='#000';g.strokeText(n.n,n.x,n.y);g.fillStyle=n.crit?'#ffe066':n.c;g.shadowColor=n.c;g.shadowBlur=14;g.fillText(n.n,n.x,n.y);if(n.crit){g.font='bold 12px system-ui';g.fillText('暴擊',n.x,n.y-25)}if(n.reaction){g.font='bold 12px system-ui';g.fillStyle=n.reaction[2];g.fillText(n.reaction[0]+'!',n.x,n.y-(n.crit?40:25))}g.restore()}g.textAlign='left'}
function render(now){let dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(!paused&&!ended)update(dt);g.save();g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);background(clock);for(let e of enemies)enemy(e);if(!ended)drawSpell(current,elapsed);drawEffects();g.restore();if(flash>0){g.fillStyle=`rgba(255,245,225,${flash})`;g.fillRect(0,0,W,H)}if(comboCount>1){g.save();g.font='900 31px system-ui';g.textAlign='right';g.strokeStyle='#000';g.lineWidth=5;g.strokeText(comboCount+' COMBO',W-30,40);g.fillStyle='#ffe066';g.fillText(comboCount+' COMBO',W-30,40);g.restore()}requestAnimationFrame(render)}
const quick=['fire','ice','lightning','meteor','sword','storm'];for(let s of skills){let b=document.createElement('button');b.dataset.key=s[0];b.innerHTML=`${s[1]} ${s[2]}<span class="cd"></span>`;b.onclick=()=>cast(s[0]);$('catalog').appendChild(b)}for(let k of quick){let b=document.createElement('button');b.dataset.key=k;b.title=byKey[k][2];b.innerHTML=`${byKey[k][1]}<i></i>`;b.onclick=()=>cast(k);$('heroBar').appendChild(b)}
function reset(){initEnemies();projectiles=[];particles=[];rings=[];numbers=[];events=[];cooldowns=Object.fromEntries(skills.map(s=>[s[0],0]));stats={totalDmg:0,maxHit:0,hits:0,maxCombo:0,crits:0,casts:0,kills:0};heroLevel=1;heroExp=0;coreHp=coreMax;clock=0;attackTimer=2.5;comboCount=0;comboTimer=0;lastCastElement=null;lastCastAt=-999;castId++;ended=false;paused=false;$('pause').textContent='暫停';$('overlay').classList.remove('show');refreshStats();cast('fire')}
$('replay').onclick=()=>{cooldowns[current]=0;cast(current,{force:true})};$('auto').onclick=e=>{auto=!auto;e.currentTarget.textContent=auto?'■ 停止輪播':'▶ 自動輪播'};$('quality').onclick=e=>{quality=quality==='high'?'medium':quality==='medium'?'low':'high';e.currentTarget.textContent='畫質：'+({high:'高',medium:'中',low:'低'}[quality])};$('pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶ 繼續':'暫停'};$('reset').onclick=reset;$('restart').onclick=reset;C.onclick=()=>{cooldowns[current]=0;cast(current,{force:true})};document.addEventListener('keydown',e=>{let i=Number(e.key)-1;if(i>=0&&i<quick.length)cast(quick[i])});reset();requestAnimationFrame(render);
