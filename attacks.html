</style></head><body><header><div><h1>✦ 靈境守衛 · 22 法術實戰特效</h1><small>晶核施法 · 專屬物件 · 命中回饋 · iPad Safari</small></div><a href="index.html">返回遊戲</a></header><div class="layout"><main><div class="stage"><canvas id="stage" width="960" height="540" aria-label="法術動畫試演區"></canvas></div><div class="controls"><button id="replay">↻ 再施放一次</button><button id="auto">▶ 自動輪播</button><button id="quality">畫質：高</button><button id="pause">暫停</button><span id="status">準備就緒</span></div><h2 id="skillTitle"></h2><p id="caption"></p><p class="foot">點擊法術按鈕立即施放。此為獨立試演場，不會修改原遊戲存檔。所有圖形在瀏覽器內即時繪製，不依賴外部圖片。</p></main><aside><h2>⚔ 全部攻擊法術（22）</h2><div id="catalog"></div></aside></div><script>
'use strict';
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d',{alpha:false});
const W=960,H=540,TAU=Math.PI*2,source={x:275,y:274},target={x:660,y:275};
const SK={
 fire:['🔥','爆裂火球','#ff9554','熔融火核飛行，落點爆燃、火舌翻卷與餘燼飄散'],
 ice:['❄','寒冰長槍','#8befff','冰晶長槍刺入目標，結晶碎片與霜花向外擴散'],
 lightning:['⚡','連鎖雷電','#cdb8ff','多段電弧連鎖跳躍，短暫殘留電漿光暈'],
 poison:['☣','毒霧','#a2ff9a','毒氣團擴散，氣泡浮起並留下腐蝕區域'],
 meteor:['☄','流星雨','#ffba70','燃燒隕石接連墜落，地面出現熔岩撞擊痕跡'],
 arcane:['✦','奧術飛彈','#dfbfff','追蹤奧術彈群，以符文星芒連續擊中敵人'],
 sword:['⚔','迴旋月刃','#ffe0a0','實體弧形月刃高速迴旋，拖出金色斬擊軌跡'],
 pierce:['➶','穿透射線','#8ce9f8','蓄能後釋放貫穿光矛，形成連續透射衝擊'],
 earth:['⛰','土刺','#d8b589','岩柱沿地表依序隆起，尖石與塵土爆散'],
 wind:['🌪','颶風','#a7eddf','旋轉風牆形成龍捲，捲起葉片和氣流'],
 beam:['🔆','聚焦光束','#ffe6a0','晶核聚焦持續光束，目標端熾熱灼燒'],
 orbit:['🪐','旋轉法球','#bd9dff','多枚法球繞目標旋轉後依序收束轟擊'],
 lava:['🌋','熔岩裂隙','#ff8c66','地面裂開流動熔岩，噴出火柱與火星'],
 gravity:['🌀','引力漩渦','#9f9cff','重力奇點拉扯星塵，環狀空間逐漸塌縮'],
 summon:['👻','幽靈守衛','#b4f5f1','幽靈從召喚陣升起，向敵人突進並斬擊'],
 thorn:['🌿','荊棘護城','#b7ee85','藤蔓生長盤繞，帶刺枝條突擊並留下葉片'],
 spark:['✨','火花術','#ffd189','數枚火花跳彈，產生密集跳躍式火星'],
 storm:['🌩','雷電風暴','#dfc8ff','雷雲聚集後連續落雷，雲層與地面同步閃動'],
 blizzard:['🌨','暴風雪','#b0eaff','冰雪漩流籠罩戰場，片狀雪晶持續飛旋'],
 nova:['💠','冰霜新星','#a2f4ff','中心爆發環形冰晶浪潮，地面結出六角霜紋'],
 swamp:['🧪','毒沼','#a8ef92','毒液鋪展成沼澤，持續冒泡與濺出腐蝕液滴'],
 skeleton:['💀','骷髏召喚','#d9d1bd','骷髏從地底升起，持劍前進並完成劈砍']};
const keys=Object.keys(SK),catalog=document.getElementById('catalog'),title=document.getElementById('skillTitle'),caption=document.getElementById('caption'),status=document.getElementById('status');
let current='fire',auto=false,paused=false,quality='high',age=0,frame=0,last=performance.now(),lastAuto=0,flash=0,shake=0,particles=[],hasHit=false;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),smooth=t=>{t=clamp(t);return t*t*(3-2*t)},mix=(a,b,t)=>a+(b-a)*t;
function glow(color,blur=18){ctx.shadowColor=color;ctx.shadowBlur=blur}
function circle(x,y,r,color,alpha=1){if(r<=0)return;ctx.save();ctx.globalAlpha*=clamp(alpha);ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore()}
function ring(x,y,r,color,width=3,alpha=1,scaleY=1){if(r<=0)return;ctx.save();ctx.translate(x,y);ctx.scale(1,scaleY);ctx.globalAlpha*=clamp(alpha);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.stroke();ctx.restore()}
function line(x1,y1,x2,y2,color,width=3,alpha=1){ctx.save();ctx.globalAlpha*=clamp(alpha);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
function polygon(x,y,r,n,color,rotation=0,inner=0){ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.fillStyle=color;ctx.beginPath();for(let i=0;i<n*(inner?2:1);i++){let a=i*TAU/(n*(inner?2:1))-Math.PI/2,rr=inner&&i%2?inner:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.restore()}
function ellipse(x,y,rx,ry,color,alpha=1){ctx.save();ctx.globalAlpha*=clamp(alpha);ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU);ctx.fill();ctx.restore()}
function bolt(x1,y1,x2,y2,color,seed=0,thick=5,alpha=1){ctx.save();ctx.lineCap='round';for(const [w,c,a] of [[thick*4,color,.12],[thick*1.8,color,.7],[Math.max(1,thick*.35),'#ffffff',.95]]){ctx.beginPath();ctx.moveTo(x1,y1);for(let i=1;i<9;i++){let t=i/9,px=mix(x1,x2,t),py=mix(y1,y2,t);let d=Math.sin(i*15.7+seed*11+Math.floor(age*24)*4)*16*(1-Math.abs(t-.5));ctx.lineTo(px+d*(y2-y1)/Math.max(1,Math.hypot(x2-x1,y2-y1)),py-d*(x2-x1)/Math.max(1,Math.hypot(x2-x1,y2-y1)))}ctx.lineTo(x2,y2);ctx.strokeStyle=c;ctx.globalAlpha=alpha*a;ctx.lineWidth=w;ctx.stroke()}ctx.restore()}
function crystal(x,y,len,width,color,angle=0){ctx.save();ctx.translate(x,y);ctx.rotate(angle);glow(color,12);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(len*.62,0);ctx.lineTo(-len*.2,-width);ctx.lineTo(-len*.48,-width*.45);ctx.lineTo(-len*.48,width*.45);ctx.lineTo(-len*.2,width);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#f5ffff';ctx.beginPath();ctx.moveTo(len*.62,0);ctx.lineTo(-len*.2,-width);ctx.lineTo(-len*.12,0);ctx.closePath();ctx.fill();ctx.restore()}
function rune(x,y,r,t,color){ctx.save();ctx.translate(x,y);ctx.rotate(t);glow(color,9);ring(0,0,r,color,2,.7);ring(0,0,r*.75,color,1,.8);for(let i=0;i<8;i++){let a=i*TAU/8;line(Math.cos(a)*r*.83,Math.sin(a)*r*.83,Math.cos(a)*r*.97,Math.sin(a)*r*.97,color,3,.9)}polygon(0,0,r*.58,6,color,t*.2);circle(0,0,r*.45,'#071427');polygon(0,0,r*.35,3,color,-t);ctx.restore()}
function addParticles(x,y,color,n=35,power=180,gravity=30){n=Math.floor(n*(quality==='high'?1:quality==='medium'?.65:.35));for(let i=0;i<n;i++){let a=rand(0,TAU),v=rand(power*.2,power);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.35,1.1),max:1.1,r:rand(1.5,5),color,gravity})}if(particles.length>900)particles.splice(0,particles.length-900)}
function hit(x=target.x,y=target.y,color=SK[current][2],power=1){if(hasHit)return;hasHit=true;flash=.38*power;shake=13*power;addParticles(x,y,color,65,270*power);}
function reset(){age=0;particles=[];hasHit=false;flash=0;shake=0;lastAuto=performance.now();status.textContent='正在施放 · '+SK[current][1]}
function choose(k){if(!SK[k])return;current=k;title.textContent=SK[k][0]+' '+SK[k][1];title.style.color=SK[k][2];caption.textContent=SK[k][3];for(const b of catalog.children)b.classList.toggle('active',b.dataset.key===k);reset()}
for(const k of keys){let b=document.createElement('button');b.textContent=SK[k][0]+' '+SK[k][1];b.dataset.key=k;b.addEventListener('click',()=>choose(k));catalog.appendChild(b)}
function drawBG(t){ctx.fillStyle='#050b1a';ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(480,220,50,480,270,600);g.addColorStop(0,'#152b4c');g.addColorStop(1,'#050915');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#4268871b';ctx.lineWidth=1;for(let x=0;x<W;x+=48){line(x,0,x,H,'#5ac9ff',.6,.06)}for(let y=0;y<H;y+=48){line(0,y,W,y,'#5ac9ff',.6,.06)}ellipse(480,390,390,80,'#0c223a',.8);for(let r=140;r<=350;r+=55)ring(480,350,r,'#426d9a',1,.2,.32);rune(source.x,source.y,55,t*.5,'#5de8ff');ring(source.x,source.y+64,100,'#5de8ff',2,.3,.25);drawEnemy(t)}
function drawEnemy(t){ctx.save();ctx.translate(target.x,target.y+Math.sin(t*2)*3);ellipse(0,78,58,14,'#02030b',.8);glow('#f05d96',12);ctx.fillStyle='#30274f';ctx.beginPath();ctx.moveTo(-36,-26);ctx.lineTo(-48,60);ctx.quadraticCurveTo(0,92,49,60);ctx.lineTo(36,-26);ctx.closePath();ctx.fill();ctx.fillStyle='#58406d';polygon(0,-28,44,6,'#58406d',Math.PI/6);ctx.fillStyle='#1a2038';ellipse(0,-23,29,36,'#1a2038');circle(-13,-27,5,'#ff6c93');circle(13,-27,5,'#ff6c93');ctx.shadowBlur=0;ctx.strokeStyle='#cf75b2';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-31,-55);ctx.lineTo(-45,-76);ctx.moveTo(31,-55);ctx.lineTo(45,-76);ctx.stroke();ctx.restore()}
function renderSpell(k,t){const col=SK[k][2],u=clamp(t/2.6),charge=smooth(t/.38),impact=smooth((t-.67)/.22),fade=1-smooth((t-1.75)/.8);ctx.save();ctx.globalCompositeOperation='lighter';if(t<.48){rune(source.x,source.y,35+charge*42,t*2,col);ring(source.x,source.y,65+charge*70,col,4,1-charge,.55)}
const fly=smooth((t-.2)/.58),fx=mix(source.x,target.x,fly),fy=mix(source.y,target.y,fly);
switch(k){
case 'fire':{if(t<.9){for(let j=0;j<5;j++){let xx=fx-j*22,yy=fy+Math.sin(t*14+j)*12;circle(xx,yy,30-j*4,j%2?'#ff4800':'#ffb000',.75)}circle(fx,fy,23,'#fff4b5')}if(t>.7){if(!hasHit)hit();for(let i=0;i<14;i++){let a=i*TAU/14+t*.8,r=(t-.7)*130;crystal(target.x+Math.cos(a)*r,target.y+Math.sin(a)*r*.65,45,8,i%2?'#ff6000':'#ffc052',a)}ring(target.x,target.y,(t-.7)*210,'#ff7e39',10,fade,.55);ellipse(target.x,target.y+58,110,18,'#e75c16',fade*.5)}break}
case 'ice':{if(t<.9){crystal(fx,fy,125,23,col,0);for(let i=0;i<5;i++)crystal(fx-35-i*22,fy+Math.sin(i*2+t*10)*15,24,5,col,.1)}if(t>.7){if(!hasHit)hit();for(let i=0;i<16;i++){let a=i*TAU/16,r=(t-.7)*120;crystal(target.x+Math.cos(a)*r,target.y+Math.sin(a)*r,60,10,i%2?'#fff':'#70dfff',a)}ring(target.x,target.y,110*impact,col,4,fade,.48)}break}
case 'lightning':{if(t>.3){bolt(source.x,source.y,fx,fy,col,1,7,fade);if(t>.7){if(!hasHit)hit();for(let i=0;i<5;i++){let a=i*TAU/5;bolt(target.x,target.y,target.x+Math.cos(a)*150,target.y+Math.sin(a)*100,col,i,4,fade)}}}break}
case 'poison':{for(let i=0;i<14;i++){let a=i*2.4,xx=target.x+Math.sin(a+t*.7)*((t+.3)*30+i*3),yy=target.y+Math.cos(a*.8)*45-Math.sin(t*3+i)*12;ellipse(xx,yy,18+impact*19,12+impact*15,i%3?'#6cba54':'#c4ff7e',fade*.2)}if(t>.7){if(!hasHit)hit();ellipse(target.x,target.y+55,110*impact,29,'#5b9b3a',fade*.6);for(let i=0;i<9;i++)circle(target.x+Math.sin(i*4)*80,target.y+35-Math.abs(Math.sin(t*3+i))*75,4+i%3*3,col,fade)}break}
case 'meteor':{for(let i=0;i<5;i++){let tt=t-i*.16;if(tt<0)continue;let q=smooth(tt/.8),x=target.x+(i-2)*68+mix(-220,0,q),y=mix(-140,target.y+(i%2)*32,q);if(tt<.85){line(x-110,y-95,x,y,'#ff7d2e',19,.7);circle(x,y,24,'#ffc278');circle(x,y,12,'#fff')}else{ring(target.x+(i-2)*68,target.y+(i%2)*32,(tt-.85)*180,col,9,fade,.35);ellipse(target.x+(i-2)*68,target.y+55,35+tt*18,12,'#d35a18',fade)}}if(t>.8&&!hasHit)hit();break}
case 'arcane':{for(let i=0;i<7;i++){let q=smooth((t-.12-i*.08)/.65),x=mix(source.x,target.x,q),y=mix(source.y,target.y,q)+Math.sin(t*13+i*2)*28;polygon(x,y,18,5,i%2?'#e5baff':'#fff',t*5+i,7);ring(x,y,26,col,2,.6)}if(t>.7&&!hasHit)hit();break}
case 'sword':{let x=fx,y=fy;for(let i=0;i<3;i++){let a=t*9+i*TAU/3;ctx.save();ctx.translate(x+Math.cos(a)*30,y+Math.sin(a)*30);ctx.rotate(a);glow(col,15);ctx.fillStyle=i%2?'#fff5ca':'#f7c45f';ctx.beginPath();ctx.moveTo(-58,-16);ctx.quadraticCurveTo(20,-60,80,-3);ctx.quadraticCurveTo(12,-25,-44,19);ctx.closePath();ctx.fill();ctx.restore()}if(t>.7){if(!hasHit)hit();ring(target.x,target.y,120*impact,col,8,fade,.55)}break}
case 'pierce':{if(t<.55){rune(source.x,source.y,85,t*3,col)}else{let q=smooth((t-.55)/.18);glow(col,28);line(source.x,source.y,source.x+650*q,source.y,'#7aefff',27*fade,.5);line(source.x,source.y,source.x+650*q,source.y,'#ffffff',7*fade);for(let i=0;i<9;i++)ring(source.x+i*70,source.y,25+20*Math.sin(t*13+i),col,2,fade,.5);if(t>.72&&!hasHit)hit()}break}
case 'earth':{for(let i=0;i<9;i++){let q=smooth((t-.25-i*.09)/.28),x=source.x+90+i*49,y=target.y+70;ctx.save();ctx.translate(x,y);ctx.scale(1,q);polygon(0,-45,44,3,i%2?'#b9906c':'#ddc29d',0);polygon(0,-60,22,3,'#f6dfb6',0);ctx.restore();ellipse(x,y,27,7,'#a88664',q*.5)}if(t>.95&&!hasHit)hit();break}
case 'wind':{for(let i=0;i<16;i++){let z=i/16,a=z*TAU+t*6,r=25+z*85,xx=target.x+Math.cos(a)*r*(.5+impact*.6),yy=target.y+Math.sin(a)*r*.7-z*90;ring(xx,yy,10+z*9,i%3?'#82d6d5':'#fff',2,fade*.7,.6);line(xx-30,yy+8,xx+25,yy-5,col,3,fade*.6)}if(t>.8&&!hasHit)hit();break}
case 'beam':{if(t<.52)rune(source.x,source.y,100,t*3,col);if(t>.5){let q=smooth((t-.5)/.2);glow(col,35);line(source.x,source.y,target.x, target.y,col,52*q*fade,.4);line(source.x,source.y,target.x,target.y,'#fff8c9',13*q*fade);for(let i=0;i<7;i++)ring(target.x,target.y,15+i*14+Math.sin(t*14+i)*7,col,3,fade*.5,.5);if(t>.75&&!hasHit)hit()}break}
case 'orbit':{for(let i=0;i<7;i++){let a=t*4+i*TAU/7,r=130*(1-smooth((t-1)/.65));let x=target.x+Math.cos(a)*r,y=target.y+Math.sin(a)*r*.7;glow(col,18);circle(x,y,15,i%2?'#fff':'#bba2ff');ring(x,y,23,col,2,.6)}if(t>1.3&&!hasHit)hit();break}
case 'lava':{let q=smooth((t-.25)/.6);ctx.save();ctx.strokeStyle='#ff5b20';ctx.lineWidth=14*q;glow('#ff5500',25);ctx.beginPath();ctx.moveTo(340,340);for(let i=0;i<9;i++)ctx.lineTo(340+i*50,340+Math.sin(i*2.3)*20);ctx.stroke();ctx.strokeStyle='#ffe089';ctx.lineWidth=3;ctx.stroke();ctx.restore();for(let i=0;i<7;i++){let x=380+i*55;ellipse(x,340,24,9,'#ff9a24',q*fade);if(t>.7)line(x,340,x+Math.sin(i*5)*12,340-70*Math.abs(Math.sin(t*5+i)),col,9,fade)}if(t>.8&&!hasHit)hit();break}
case 'gravity':{let q=smooth((t-.15)/.7);circle(target.x,target.y,34+q*25,'#080516');for(let i=0;i<8;i++){let a=t*(2+i*.12)+i*TAU/8,r=160*(1-smooth((t-1)/1.3))+(i%3)*12;ring(target.x+Math.cos(a)*r,target.y+Math.sin(a)*r*.65,10,col,2,fade);line(target.x+Math.cos(a)*r,target.y+Math.sin(a)*r*.65,target.x,target.y,col,1,fade*.25)}ring(target.x,target.y,80+Math.sin(t*7)*8,col,7,fade,.68);if(t>1.4&&!hasHit)hit();break}
case 'summon':{let q=smooth((t-.2)/.55),x=mix(source.x+90,target.x,q);rune(source.x+90,source.y+45,60,t,col);ctx.save();ctx.translate(x,target.y-30+Math.sin(t*6)*8);glow(col,18);ellipse(0,0,36,46,'#a3eee6',fade*.6);ellipse(0,-18,24,23,'#e6ffff',fade*.7);circle(-10,-20,4,'#214c64');circle(10,-20,4,'#214c64');for(let i=0;i<3;i++)line(-23+i*20,24,-32+i*22,66+Math.sin(t*7+i)*12,col,7,fade);line(25,2,65,-40,col,9,fade);ctx.restore();if(t>.85&&!hasHit)hit();break}
case 'thorn':{for(let i=0;i<9;i++){let x=target.x-150+i*38,q=smooth((t-.2-i*.07)/.45),height=(70+i%3*30)*q;ctx.save();ctx.strokeStyle=i%2?'#6aaf54':'#b4f88b';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(x,target.y+70);ctx.quadraticCurveTo(x+Math.sin(t*3+i)*20,target.y-height*.5,x+Math.sin(i*3)*20,target.y+70-height);ctx.stroke();ctx.restore();for(let j=0;j<3;j++)polygon(x+Math.sin(i*3)*12,target.y+70-height*(j+1)/3,9,3,'#c3f28c',i+j)}if(t>.9&&!hasHit)hit();break}
case 'spark':{for(let i=0;i<13;i++){let q=smooth((t-i*.065)/.8),x=mix(source.x,target.x,q),y=source.y+Math.sin(i*2.4+t*13)*55*(1-q);glow('#ffc95b',15);circle(x,y,5+i%3*2,i%2?'#fff':'#ffcb56');line(x-15,y+6,x,y,col,2,.5)}if(t>.8&&!hasHit)hit();break}
case 'storm':{for(let i=0;i<10;i++){let x=target.x-160+i*37,y=target.y-135+Math.sin(i*3+t*2)*9;ellipse(x,y,62,30,'#58668e',fade*.5);ellipse(x-10,y-10,45,24,'#8797bb',fade*.35)}if(t>.5){for(let i=0;i<7;i++){let st=t-.45-i*.19;if(st>0&&st<.3){let x=target.x-135+i*46;bolt(x,target.y-125,x+Math.sin(i*3)*28,target.y+55,col,i,7,fade)}}if(t>.7&&!hasHit)hit()}break}
case 'blizzard':{for(let i=0;i<65;i++){let a=i*2.399+t*2.6,r=Math.sqrt(i/65)*175,x=target.x+Math.cos(a)*r,y=target.y+Math.sin(a)*r*.8;polygon(x,y,3+i%4,6,i%3?'#a3eaff':'#fff',t+i);if(i%8===0)line(x-16,y+12,x+12,y-6,col,2,.4)}if(t>.7&&!hasHit)hit();break}
case 'nova':{let q=smooth((t-.45)/.7);for(let i=0;i<24;i++){let a=i*TAU/24,r=q*190;crystal(target.x+Math.cos(a)*r,target.y+Math.sin(a)*r*.75,65,10,i%2?'#fff':'#8defff',a)}ring(target.x,target.y,q*200,col,12,fade,.75);for(let i=0;i<6;i++)line(target.x,target.y,target.x+Math.cos(i*TAU/6)*q*160,target.y+Math.sin(i*TAU/6)*q*120,col,3,fade);if(t>.55&&!hasHit)hit();break}
case 'swamp':{let q=smooth((t-.25)/.7);ellipse(target.x,target.y+60,165*q,47*q,'#538b29',fade*.7);ellipse(target.x,target.y+60,135*q,33*q,'#b6e858',fade*.35);for(let i=0;i<18;i++){let x=target.x+Math.sin(i*3.7)*140*q,y=target.y+60+Math.cos(i*4.7)*28*q-Math.abs(Math.sin(t*4+i))*55*q;circle(x,y,3+i%5,col,fade*.7);ring(x,y,7+i%4,col,1,fade*.3,.7)}if(t>.8&&!hasHit)hit();break}
case 'skeleton':{let q=smooth((t-.2)/.7),x=mix(source.x+100,target.x-40,smooth((t-.65)/.75));rune(source.x+100,source.y+55,65,t,col);ctx.save();ctx.translate(x,target.y+55-q*40);glow('#c6d0bb',8);circle(0,-46,23,'#e2dfcb',q);circle(-9,-50,5,'#161b2b',q);circle(9,-50,5,'#161b2b',q);line(0,-22,0,25,col,10,q);for(let i=-1;i<=1;i++)line(-17,-8+i*10,17,-8+i*10,col,5,q);line(0,-10,-25,15,col,6,q);line(0,-10,32,-30,col,6,q);line(0,25,-18,62,col,7,q);line(0,25,20,62,col,7,q);line(32,-30,70,-65,'#fff',5,q);ctx.restore();if(t>1.25&&!hasHit)hit();break}
}
ctx.restore()}
function drawParticles(dt){for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;p.vx*=Math.pow(.965,dt*60);glow(p.color,8);circle(p.x,p.y,p.r,p.color,p.life/p.max)}particles=particles.filter(p=>p.life>0)}
function loop(now){let dt=Math.min(.04,Math.max(0,(now-last)/1000));last=now;if(!paused){age+=dt;frame++;if(auto&&now-lastAuto>3300)choose(keys[(keys.indexOf(current)+1)%keys.length]);if(age>2.8&&!auto)status.textContent='演出完成 · 可重新施放';flash=Math.max(0,flash-dt*2.8);shake*=Math.pow(.84,dt*60)}ctx.save();if(shake>.2)ctx.translate(rand(-shake,shake),rand(-shake,shake));drawBG(now*.001);renderSpell(current,Math.min(age,3.5));if(!paused)drawParticles(dt);else drawParticles(0);ctx.restore();if(flash>0){ctx.fillStyle='rgba(255,255,255,'+clamp(flash*.45)+')';ctx.fillRect(0,0,W,H)}const v=ctx.createRadialGradient(480,250,150,480,270,560);v.addColorStop(0,'#0000');v.addColorStop(1,'#000b');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);requestAnimationFrame(loop)}
document.getElementById('replay').addEventListener('click',reset);document.getElementById('auto').addEventListener('click',e=>{auto=!auto;e.currentTarget.textContent=auto?'■ 停止輪播':'▶ 自動輪播';e.currentTarget.classList.toggle('active',auto);lastAuto=performance.now()});document.getElementById('quality').addEventListener('click',e=>{quality=quality==='high'?'medium':quality==='medium'?'low':'high';e.currentTarget.textContent='畫質：'+({high:'高',medium:'中',low:'低'}[quality])});document.getElementById('pause').addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'▶ 繼續':'暫停';status.textContent=paused?'已暫停':'正在施放 · '+SK[current][1]});canvas.addEventListener('click',reset);choose('fire');requestAnimationFrame(loop);
</script></body></html>
