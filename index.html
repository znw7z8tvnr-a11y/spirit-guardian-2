function loop(t){let dt=last?Math.min(.05,Math.max(0,(t-last)/1000)):0;last=t;try{update(dt);draw()}catch(err){$('state').textContent='執行錯誤';note('錯誤：'+err.message+'（請截圖回報）');console.error(err);active=false;paused=true;render();requestAnimationFrame(loop);return}uiClock+=dt;if(uiClock>.4){uiClock=0;$('stats').innerHTML=`<span class="stat">❤️ ${Math.ceil(s.hp)}/${s.max}</span><span class="stat">🛡️ ${Math.ceil(s.shield)}/${s.shieldMax}</span><span class="stat">💎 ${s.crystal}</span><span class="stat">🌊 ${s.wave}/30</span><span class="stat">💀 ${s.kills}</span><span class="stat">🎯 ${['近','低血','高血','Boss'][s.targetMode||0]}</span>`;$('state').textContent=active?(paused?'已暫停':'戰鬥中'):'準備中';for(const [id,k] of [['skillFire','fire'],['skillIce','ice'],['skillBolt','bolt'],['skillArc','arc']]){$(id).title=manualCooldown[k]>0?'冷卻 '+manualCooldown[k].toFixed(1)+' 秒':'可手動施放'}}requestAnimationFrame(loop)}try{const v=Number(localStorage.getItem('sg-speed'));if([1,2,3].includes(v))speed=v}catch(e){}document.addEventListener('keydown',ev=>{if(ev.target&&['INPUT','TEXTAREA','SELECT'].includes(ev.target.tagName))return;if(ev.code==='Space'){ev.preventDefault();if(active){paused=!paused;render()}}else if(ev.key==='1')$('skillFire').click();else if(ev.key==='2')$('skillIce').click();else if(ev.key==='3')$('skillBolt').click();else if(ev.key==='4')$('skillArc').click()});window.addEventListener('pagehide',()=>save());document.addEventListener('visibilitychange',()=>{if(document.hidden&&active){paused=true;render();save()}});window.addEventListener('error',e=>{note('程式錯誤：'+e.message)});render();$('state').textContent='可以開始';requestAnimationFrame(loop)})();
