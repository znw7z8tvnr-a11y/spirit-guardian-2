case 'pierce':{let u=smooth(.18,.48,t),px=lerp(x,tx+120,u),py=lerp(y,ty,u);line([[x,y],[px,py]],'#76e7ff',5,16);line([[px-60,py],[px+25,py]],'#fff',5,15);poly([[px+32,py],[px-5,py-14],[px-5,py+14]],'#efffff','#9defff',2,15);if(t>.48)ring(tx,ty,90*impactP,col,3,fade)}break
case 'earth':case 'lava':case 'thorn':{for(let i=0;i<9;i++){let xx=480+i*38,u=smooth(.25+i*.05,.62+i*.05,t),h=(k==='lava'?95:110)*u*fade;if(k==='earth'){poly([[xx-18,410],[xx,410-h],[xx+21,410]],'#827768','#e4c7a5',3);poly([[xx,410-h],[xx+21,410],[xx,410]],'#b6a184')}else if(k==='lava'){line([[xx,412],[xx+Math.sin(i)*12,412-h]],'#ff5126',17,25);flame(xx+Math.sin(i)*12,412-h,15,t+i);line([[xx-16,413],[xx+19,413]],'#ffb33e',5,13)}else{line([[xx,420],[xx+Math.sin(i+t)*22,420-h*.7],[xx+Math.cos(i)*14,420-h]],'#4d9c50',9,9);poly([[xx,420-h*.6],[xx-12,420-h*.6-12],[xx+5,420-h*.6+5]],'#b6ee82')}}}break
case 'wind':{for(let i=0;i<14;i++){let r=15+i*9,a=t*4+i*.65;g.save();g.translate(tx,ty-35);g.rotate(a);g.strokeStyle=col;g.lineWidth=4-i*.16;g.globalAlpha=fade*.75;g.beginPath();g.ellipse(0,0,r,r*.43,0,.2,PI*1.6);g.stroke();g.restore()}for(let i=0;i<14;i++){let a=i*2.4+t*5,r=25+i*8;disc(tx+Math.cos(a)*r,ty+Math.sin(a)*r*.55,3,'#b4b6a8')}}break
case 'beam':{if(t>.26){let u=smooth(.26,.52,t),w=(10+u*25)*fade;line([[x,y],[lerp(x,tx,u),lerp(y,ty,u)]],'#ffbd53',w+24,35);line([[x,y],[lerp(x,tx,u),lerp(y,ty,u)]],'#fff7c6',w,25);for(let i=0;i<4;i++){let a=i*TAU/4+t*5;disc(tx+Math.cos(a)*50,ty+Math.sin(a)*50,6,col,16)}disc(tx,ty,25*fade,'#fff',28)}}break
case 'gravity':{disc(tx,ty,55*impactP,'#02030b',35);for(let i=0;i<10;i++){let r=(25+i*14)*(1-impactP*.5),a=t*4+i*.6;g.save();g.translate(tx,ty);g.rotate(a);g.strokeStyle=i%2?'#b2a1ff':'#e7baff';g.globalAlpha=fade*.7;g.lineWidth=5;g.beginPath();g.ellipse(0,0,r,r*.48,0,.2,PI*1.6);g.stroke();g.restore()}ring(tx,ty,66*impactP,'#e4baff',8,fade);}break
case 'summon':case 'skeleton':{let u=smooth(.22,.56,t);drawSigil(tx,ty+55,t,col,85);ring(tx,ty+55,100*u,col,4,fade,.4);for(let i=0;i<12;i++){let a=i*TAU/12+t;disc(tx+Math.cos(a)*85,ty+55+Math.sin(a)*38-u*60,4,col,12)}}break
case 'spark':{for(let i=0;i<9;i++){let u=smooth(.2+i*.045,.48+i*.045,t),sx=lerp(x,tx,u),sy=lerp(y,ty,u)+Math.sin(i*2.5)*30;disc(sx,sy,5+rand(i)*6,'#ffe7a3',14);if(u>=1&&t<1+i*.08){flame(tx+(i%3-1)*30,ty+(i%4-2)*20,12*fade,t+i)}}}break
case 'storm':{for(let i=0;i<6;i++){disc(550+i*45,100+Math.sin(t*2+i)*9,75,'#333b57',16);if(t>.32+i*.17&&t<.62+i*.17){let en=enemies.filter(z=>z.alive)[i%Math.max(1,enemies.filter(z=>z.alive).length)]||e;bolt(550+i*45,100,en.x,en.y,cycle*17+i+Math.floor(t*24),8)}}}break
case 'blizzard':{for(let i=0;i<(quality==='low'?35:quality==='medium'?60:100);i++){let xx=((rand(i*3)*W+t*130*(i%3+1))%W),yy=((rand(i*7)*H+t*160)%H);line([[xx,yy],[xx-18,yy+12]],'#c6efff',1.5);if(i%7===0)crystal(xx,yy,.08,PI/4)}}break
case 'nova':{ring(tx,ty,185*impactP,'#b7f6ff',8,fade,.52);for(let i=0;i<22;i++){let a=i*TAU/22,r=impactP*180;crystal(tx+Math.cos(a)*r,ty+Math.sin(a)*r*.52,.3+fade*.65,a)}}break
}
if(t>.48&&t<.9){g.save();g.globalAlpha=(1-smooth(.48,.9,t))*.45;disc(tx,ty,20+impactP*25,'#fff',25);g.restore()}}
function drawHUD(){if(combo>1&&comboClock>0)text(combo+' COMBO',930,52,29,'#ffe178','right');text('Lv.'+heroLevel+'  ·  '+stats.kills+' 擊殺  ·  '+grade()+' 級',22,32,13,'#a7c6df','left');if(bossWarning>0){g.save();g.globalAlpha=.3+.3*Math.sin(clock*18);disc(765,255,130,'#ff3558',10);g.restore();text('⚠ 首領範圍攻擊',730,65,20,'#ff637b')}}
function grade(){let score=Math.min(stats.maxCombo*8,200)+stats.crits*6+stats.reactions*15+stats.bossKills*40+heroLevel*15+Math.min(stats.totalDmg/1000,300);return score>=500?'S':score>=300?'A':score>=150?'B':'C'}
function render(now){let dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(!paused&&!overlayOpen){let step=dt;if(hitStop>0){hitStop=Math.max(0,hitStop-dt);step*=.25}update(step)}g.save();g.translate((Math.random()-.5)*trauma*18,(Math.random()-.5)*trauma*14);drawBackground(clock);for(let e of enemies)drawEnemy(e,clock);drawHero(clock);drawSummons(clock);drawEnemyShots();drawSpell(current,spellTime);drawParticles();drawHUD();g.restore();if(flash>0){g.fillStyle=`rgba(255,240,215,${clamp(flash*.55)})`;g.fillRect(0,0,W,H)}requestAnimationFrame(render)}
const catalog=document.getElementById('catalog'),quick=document.getElementById('quick');for(let s of skills){let b=document.createElement('button');b.dataset.key=s[0];b.innerHTML=`${s[1]} ${s[2]} <span class="cool"></span>`;b.onclick=()=>startSpell(s[0]);catalog.appendChild(b)}for(let k of ['fire','ice','lightning','meteor','summon','skeleton']){let b=document.createElement('button');b.dataset.key=k;b.textContent=byKey[k][1];b.title=byKey[k][2];b.onclick=()=>startSpell(k);quick.appendChild(b)}
function updateCooldownUI(){for(let b of document.querySelectorAll('[data-key]')){let cd=cooldowns[b.dataset.key];b.disabled=cd>.05;let label=b.querySelector('.cool');if(label)label.textContent=cd>.05?cd.toFixed(1)+'s':''}}
function updateUI(){let vals=[['總傷害',stats.totalDmg.toLocaleString()],['最高單擊',stats.maxHit.toLocaleString()],['命中次數',stats.hits],['最高連擊',stats.maxCombo],['暴擊次數',stats.crits],['施放技能',stats.casts],['擊殺數',stats.kills],['元素反應',stats.reactions],['目前評級',grade()],['戰鬥時間',Math.floor(battleTime)+'s'],['英雄生命',Math.round(heroHP)+' / '+heroMaxHP],['首領擊殺',stats.bossKills]];document.getElementById('stats').innerHTML=vals.map(a=>`<span class="muted">${a[0]}</span><b>${a[1]}</b>`).join('');document.getElementById('level').textContent='Lv.'+heroLevel;document.getElementById('equipCount').textContent=equipped.length+' / 4';document.getElementById('equipList').innerHTML=equipped.length?equipped.map(e=>`<div class="row"><span>${e[1]} ${e[2]}</span><span class="muted">${e[5]}</span></div>`).join(''):'<span class="muted">尚未獲得裝備</span>';document.getElementById('summonCount').textContent=summons.length+' / 3';document.getElementById('summonList').innerHTML=summons.length?summons.map(s=>`<div class="row"><span>${s.type==='ghost'?'👻 幽靈守衛':'💀 骷髏戰士'} ${Math.round(s.hp/s.maxHp*100)}%</span><span class="muted">${Math.ceil(s.duration)}s</span></div>`).join(''):'<span class="muted">尚無召喚獸</span>'}
function reset(){resetEnemies();for(let k in stats)stats[k]=0;for(let k in cooldowns)cooldowns[k]=0;for(let k in bonuses)bonuses[k]=0;heroLevel=1;heroExp=0;heroHP=heroMaxHP;equipped=[];summons=[];achievements.clear();particles=[];rings=[];numbers=[];enemyShots=[];enemyAttackCd=2;battleTime=0;clock=0;combo=0;comboClock=0;bossAttackCd=5;bossWarning=0;lastElement=null;lastElementTime=-100;paused=false;overlayOpen=false;document.getElementById('overlay').classList.remove('show');document.getElementById('pause').textContent='Ⅱ 暫停';startSpell('fire',true);updateUI()}
document.getElementById('replay').onclick=()=>startSpell(current,true);document.getElementById('auto').onclick=e=>{auto=!auto;e.currentTarget.textContent=auto?'■ 停止輪播':'▶ 自動輪播';if(auto)spellTime=2.7};document.getElementById('quality').onclick=e=>{quality=quality==='high'?'medium':quality==='medium'?'low':'high';e.currentTarget.textContent='畫質：'+({high:'高',medium:'中',low:'低'})[quality]};document.getElementById('pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶ 繼續':'Ⅱ 暫停'};document.getElementById('reset').onclick=reset;document.getElementById('settle').onclick=()=>{overlayOpen=true;document.getElementById('overlay').classList.add('show');document.getElementById('resultGrade').textContent=grade();document.getElementById('resultData').innerHTML=`戰鬥時間：${Math.floor(battleTime)} 秒<br>總傷害：${stats.totalDmg.toLocaleString()}<br>最高單擊：${stats.maxHit.toLocaleString()}<br>擊殺：${stats.kills}（首領 ${stats.bossKills}）<br>暴擊：${stats.crits}　元素反應：${stats.reactions}<br>最高連擊：${stats.maxCombo}　英雄 Lv.${heroLevel}`;document.getElementById('resultAchievements').innerHTML='<b>🏆 本局成就</b><p>'+(achievementDefs.filter(a=>achievements.has(a[0])).map(a=>a[1]).join('　')||'尚未解鎖')+'</p>'};document.getElementById('closeResult').onclick=()=>{overlayOpen=false;document.getElementById('overlay').classList.remove('show');last=performance.now()};C.onclick=()=>startSpell(current,true);document.addEventListener('keydown',e=>{let n=Number(e.key);if(n>=1&&n<=6)startSpell(['fire','ice','lightning','meteor','summon','skeleton'][n-1])});window.addEventListener('error',e=>{let el=document.getElementById('error');el.style.display='block';el.textContent='執行錯誤：'+e.message});reset();requestAnimationFrame(render);
</script></body></html>
