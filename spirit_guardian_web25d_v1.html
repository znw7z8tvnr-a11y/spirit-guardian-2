<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>靈境守衛｜Web 2.5D 原型 V1</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050918;color:#ecf5ff;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}canvas{width:100%;height:100%;display:block}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-between;padding:10px;pointer-events:none;gap:8px}.pane{background:#07152bdc;border:1px solid #5cdde266;border-radius:12px;padding:9px 12px;font-size:12px;box-shadow:0 4px 20px #0008}b{color:#ffdf9b}#bottom{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:7px;flex-wrap:wrap;padding:0 8px}button{background:linear-gradient(#273962,#111b37);color:white;border:1px solid #6d9dd2;border-radius:10px;padding:11px 13px;font-weight:700;font-size:13px;min-height:42px}button.active{border-color:#ffd16c;box-shadow:0 0 18px #ffc44d66}#overlay{position:fixed;inset:0;background:#050a1bdc;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}#overlay.hidden{display:none}.modal{max-width:490px;background:linear-gradient(145deg,#192b52,#0a122b);border:1px solid #6be5e3;border-radius:18px;padding:24px;text-align:center;box-shadow:0 0 55px #4b7de044}h1{font-size:clamp(25px,5vw,39px);color:#ffdf9b}p{line-height:1.65;color:#c3d4e8}#hint{position:fixed;top:74px;left:50%;transform:translateX(-50%);font-size:11px;color:#a9f7ef;pointer-events:none;white-space:nowrap}@media(max-width:600px){#hud .pane{padding:7px;font-size:10px}button{padding:8px;font-size:11px}#hint{top:63px}}</style></head><body><canvas id="scene"></canvas><div id="hud"><div class="pane">✦ 靈境守衛 <b>2.5D V1</b><div id="status">守護塔 1000 / 1000</div></div><div class="pane" id="score">波次 1 / 10 · 擊殺 0</div></div><div id="hint">點選元素切換攻擊 · 連鎖元素可觸發共振</div><div id="bottom"><button data-element="fire" class="active">🔥 火焰</button><button data-element="ice">❄️ 冰霜</button><button data-element="lightning">⚡ 雷電</button><button data-element="arcane">🔮 奧術</button><button id="chain">💎 連鎖：開</button><button id="pause">⏸ 暫停</button></div><div id="overlay"><div class="modal"><h1>靈境守衛</h1><h3>水晶祭壇 · 2.5D 戰鬥原型</h3><p>這是與 V32 分開的第一個視覺及戰鬥驗收版。立體斜俯視祭壇、分層水晶塔、四元素攻擊、連鎖共振與第十波 Boss。可直接在 iPad Safari 試玩。</p><button id="start">▶ 開始守護</button></div></div><script>
(()=>{'use strict';const c=document.getElementById('scene'),g=c.getContext('2d');let W=0,H=0,dpr=1,scale=1,cx=0,cy=0,elapsed=0,spawn=0,shoot=0,wave=1,kills=0,health=1000,running=false,paused=false,element='fire',chain=true,bossSpawned=false,last=0;const enemies=[],shots=[],particles=[],rings=[],texts=[];const colors={fire:'#ff914d',ice:'#8deaff',lightning:'#f8e47a',arcane:'#c89aff'};const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);cx=W*.5;cy=H*.53;scale=Math.min(W/950,H/720,1.5);g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function pos(x,z,y=0){return {x:cx+(x-z)*.77*scale,y:cy+(x+z)*.30*scale-y*.95*scale}}function poly(points,fill,stroke,width=1){g.beginPath();points.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=width;g.stroke()}}function line(a,b,color,w){g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.strokeStyle=color;g.lineWidth=w;g.stroke()}function ellipse(p,rx,ry,fill){g.beginPath();g.ellipse(p.x,p.y,rx*scale,ry*scale,0,0,Math.PI*2);g.fillStyle=fill;g.fill()}function prism(x,z,w,d,h,top,side){let a=pos(x-w/2,z-d/2,h),b=pos(x+w/2,z-d/2,h),cc=pos(x+w/2,z+d/2,h),dd=pos(x-w/2,z+d/2,h),ab=pos(x+w/2,z-d/2),bc=pos(x+w/2,z+d/2),cd=pos(x-w/2,z+d/2);poly([b,cc,bc,ab],side);poly([cc,dd,cd,bc],'#17284c');poly([a,b,cc,dd],top,'#7e8dba55')}function glow(p,r,col){let gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,r*scale);gr.addColorStop(0,col+'a0');gr.addColorStop(.4,col+'38');gr.addColorStop(1,col+'00');g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,r*scale,0,Math.PI*2);g.fill()}function arena(t){let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#060b22');bg.addColorStop(.55,'#101b39');bg.addColorStop(1,'#050914');g.fillStyle=bg;g.fillRect(0,0,W,H);for(let i=0;i<55;i++){let x=(i*7919%997)/997*W,y=(i*3191%991)/991*H;g.fillStyle='#b1c8ff'+(i%3===0?'70':'30');g.fillRect(x,y,1.5,1.5)}let A=[pos(-420,-420),pos(420,-420),pos(420,420),pos(-420,420)];poly(A,'#0e1a30','#536ea044',2);for(let k=0;k<8;k++){let q=-350+k*100;line(pos(q,-400),pos(q,400),'#3d6a8750',1);line(pos(-400,q),pos(400,q),'#3d6a8750',1)}for(let i=0;i<4;i++){let x=i<2?-320:320,z=i%2?-320:320;prism(x,z,55,55,48,'#26375a','#14223e');let p=pos(x,z,85);glow(p,35,'#56dfff');poly([pos(x-15,z,55),pos(x,z-15,90),pos(x+15,z,55),pos(x,z+15,45)],'#6ceaf1','#c3ffff',1)}for(let r=280;r>70;r-=42){g.beginPath();for(let j=0;j<=100;j++){let a=j/100*Math.PI*2,p=pos(Math.cos(a)*r,Math.sin(a)*r);j?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)}g.strokeStyle=r%3?'#2ba8b444':'#ffd78855';g.lineWidth=r===280?3:1.4;g.stroke()}let p=pos(0,0);glow(p,195,'#3b8cdd');prism(0,0,185,185,28,'#2e3e68','#162547');prism(0,0,142,142,48,'#334d76','#1a3154');for(let k=0;k<8;k++){let a=k*Math.PI/4+t*.08,rr=102,q=pos(Math.cos(a)*rr,Math.sin(a)*rr,55);glow(q,11,'#e6bf73');ellipse(q,3,2,'#ffe6ac')}}function tower(t){let p=pos(0,0,165);glow(p,105,'#68e9ff');prism(0,0,72,72,105,'#a4b9d0','#283b65');prism(0,0,90,90,20,'#d6c28a','#4b496b');for(let i=0;i<4;i++){let a=i*Math.PI/2+t*.25,x=Math.cos(a)*44,z=Math.sin(a)*44;let q=pos(x,z,125+Math.sin(t*2+i)*6);glow(q,22,'#b594ff');ellipse(q,5,8,'#c2a6ff')}let v=[pos(-27,-27,150),pos(27,-27,150),pos(27,27,150),pos(-27,27,150)],tip=pos(0,0,225+Math.sin(t*2)*7),base=pos(0,0,112);poly([v[0],v[1],tip],'#a1f5ff','#eaffff',1.5);poly([v[1],v[2],tip],'#39a7e7','#b0faff',1.5);poly([v[2],v[3],tip],'#3377c6');poly([v[3],v[0],tip],'#7edaf5');poly([v[2],v[3],base],'#164d85');glow(tip,45,'#a7f7ff');let orbit=pos(Math.cos(t)*95,Math.sin(t)*95,155);glow(orbit,16,'#e6bbff');ellipse(orbit,4,4,'#fff4d4')}function spawnEnemy(boss=false){let a=rand(0,Math.PI*2),r=rand(335,405);let typ=boss?'boss':Math.random()<.2?'elite':Math.random()<.25?'fast':'normal';let hp=typ==='boss'?1600:typ==='elite'?200:typ==='fast'?55:90;enemies.push({x:Math.cos(a)*r,z:Math.sin(a)*r,hp,max:hp,type:typ,speed:typ==='boss'?13:typ==='fast'?52:typ==='elite'?21:31,phase:rand(0,7),slow:0,hit:0});if(boss)notice('⚠️ 裂晶王降臨！')}function fx(x,z,y,color,n=12){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),v=rand(25,100);particles.push({x,z,y,vx:Math.cos(a)*v,vz:Math.sin(a)*v,vy:rand(20,130),life:rand(.25,.7),max:.7,color})}}function notice(t){texts.push({t,life:2.1})}function attack(){if(!enemies.length)return;let sorted=[...enemies].sort((a,b)=>Math.hypot(a.x,a.z)-Math.hypot(b.x,b.z));let target=sorted[0];shots.push({x:0,z:0,y:190,target,life:0,color:colors[element],type:element});if(chain&&sorted.length>1&&Math.random()<.36){let t2=sorted[1];shots.push({x:0,z:0,y:190,target:t2,life:-.12,color:'#ffe5ad',type:'resonance'});if(Math.random()<.17)notice('✦ 元素共振！')}}function update(dt){if(!running||paused)return;elapsed+=dt;spawn+=dt;shoot+=dt;if(shoot>.36){shoot=0;attack()}let targetWave=Math.min(10,Math.floor(elapsed/18)+1);if(targetWave!==wave){wave=targetWave;notice('第 '+wave+' 波來襲')}if(spawn>Math.max(.42,1.7-wave*.1)){spawn=0;if(wave===10&&!bossSpawned){spawnEnemy(true);bossSpawned=true}else if(enemies.length<55)spawnEnemy()}for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],d=Math.hypot(e.x,e.z);e.phase+=dt;e.hit=Math.max(0,e.hit-dt);e.slow=Math.max(0,e.slow-dt);if(d<45){health-=e.type==='boss'?180:35;fx(e.x,e.z,35,'#ff7d75',18);enemies.splice(i,1);if(health<=0){health=0;end(false)}continue}let sp=e.speed*(e.slow? .35:1)*dt;e.x-=e.x/d*sp;e.z-=e.z/d*sp}for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.life+=dt;if(s.life<0)continue;let e=s.target;if(!enemies.includes(e)){shots.splice(i,1);continue}let dx=e.x-s.x,dz=e.z-s.z,dist=Math.hypot(dx,dz),speed=420*dt;if(dist<speed+8){let damage=s.type==='resonance'?68:s.type==='fire'?48:s.type==='ice'?34:s.type==='lightning'?56:42;e.hp-=damage;e.hit=.14;if(s.type==='ice')e.slow=1.6;if(s.type==='lightning'){let other=enemies.find(q=>q!==e&&Math.hypot(q.x-e.x,q.z-e.z)<125);if(other){other.hp-=24;fx(other.x,other.z,45,'#f8e47a',8)}}fx(e.x,e.z,e.type==='boss'?75:38,s.color,s.type==='resonance'?25:12);rings.push({x:e.x,z:e.z,r:5,life:.36,color:s.color});shots.splice(i,1);if(e.hp<=0){kills++;fx(e.x,e.z,e.type==='boss'?95:45,'#ffdd99',e.type==='boss'?70:18);let isBoss=e.type==='boss';enemies.splice(enemies.indexOf(e),1);if(isBoss)end(true)}}else{s.x+=dx/dist*speed;s.z+=dz/dist*speed;s.y+=(e.type==='boss'?75:38-s.y)*Math.min(1,dt*8)}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}p.x+=p.vx*dt;p.z+=p.vz*dt;p.y+=p.vy*dt;p.vy-=250*dt}for(let i=rings.length-1;i>=0;i--){rings[i].life-=dt;rings[i].r+=170*dt;if(rings[i].life<=0)rings.splice(i,1)}for(let i=texts.length-1;i>=0;i--){texts[i].life-=dt;if(texts[i].life<=0)texts.splice(i,1)}document.getElementById('status').textContent='守護塔 '+Math.ceil(health)+' / 1000';document.getElementById('score').textContent='波次 '+wave+' / 10 · 擊殺 '+kills}function drawEnemy(e){let p=pos(e.x,e.z),h=e.type==='boss'?110:e.type==='elite'?58:39,rad=e.type==='boss'?38:e.type==='elite'?20:14;ellipse(p,rad,rad*.45,'#020814bb');let top=pos(e.x,e.z,h+Math.sin(e.phase*4)*3);glow(top,rad*1.8,e.type==='boss'?'#fa507c':e.type==='elite'?'#d4a0ff':'#68c6ff');let fill=e.hit?'#ffffff':e.type==='boss'?'#b94a78':e.type==='elite'?'#9060cb':e.type==='fast'?'#61d0b7':'#6987bb';poly([pos(e.x-rad,e.z,h*.45),pos(e.x,e.z-rad,h*.65),top,pos(e.x+rad,e.z,h*.45),pos(e.x,e.z+rad,h*.3)],fill,'#e1d7ff99');if(e.type==='boss'){poly([pos(e.x-38,e.z,h*.7),pos(e.x-58,e.z,h*1.2),top],'#e2b4dc');poly([pos(e.x+38,e.z,h*.7),pos(e.x+58,e.z,h*1.2),top],'#e2b4dc')}let bar=pos(e.x,e.z,h+18);g.fillStyle='#120e24';g.fillRect(bar.x-rad,bar.y,rad*2,4);g.fillStyle=e.type==='boss'?'#ff7798':'#7ef5da';g.fillRect(bar.x-rad,bar.y,rad*2*clamp(e.hp/e.max,0,1),4)}function draw(t){g.clearRect(0,0,W,H);arena(t);let objs=enemies.map(e=>({e,depth:e.x+e.z}));objs.push({tower:true,depth:0});objs.sort((a,b)=>a.depth-b.depth);for(const o of objs)o.tower?tower(t):drawEnemy(o.e);for(const r of rings){let p=pos(r.x,r.z,8);g.globalAlpha=clamp(r.life/.36,0,1);g.strokeStyle=r.color;g.lineWidth=3;g.beginPath();g.ellipse(p.x,p.y,r.r*scale,r.r*.4*scale,0,0,Math.PI*2);g.stroke();g.globalAlpha=1}for(const s of shots){if(s.life<0)continue;let p=pos(s.x,s.z,s.y);glow(p,24,s.color);ellipse(p,5,5,'#ffffff');let tail=pos(s.x-8,s.z-8,s.y+5);line(p,tail,s.color,3)}for(const p of particles){let q=pos(p.x,p.z,p.y);g.globalAlpha=clamp(p.life/.5,0,1);ellipse(q,rand(1.4,2.2),2,p.color);g.globalAlpha=1}for(let i=0;i<texts.length;i++){let o=texts[i];g.globalAlpha=Math.min(1,o.life);g.font='bold '+Math.max(17,Math.min(29,W/24))+'px system-ui';g.textAlign='center';g.fillStyle='#ffe6ac';g.shadowColor='#d66eff';g.shadowBlur=18;g.fillText(o.t,cx,Math.max(120,H*.21)-i*35);g.shadowBlur=0;g.globalAlpha=1}}function end(win){running=false;document.getElementById('overlay').classList.remove('hidden');document.querySelector('.modal').innerHTML='<h1>'+(win?'🏆 守護成功！':'💔 祭壇失守')+'</h1><p>波次 '+wave+' · 擊殺 '+kills+'<br>這是 2.5D 原型，完整 V32 系統尚未移植。</p><button id="restart">↻ 再玩一次</button>';document.getElementById('restart').onclick=reset}function reset(){enemies.length=shots.length=particles.length=rings.length=texts.length=0;elapsed=spawn=shoot=0;wave=1;kills=0;health=1000;bossSpawned=false;running=true;paused=false;document.getElementById('overlay').classList.add('hidden');notice('守護開始！')}document.getElementById('start').onclick=reset;document.querySelectorAll('[data-element]').forEach(b=>b.onclick=()=>{element=b.dataset.element;document.querySelectorAll('[data-element]').forEach(x=>x.classList.toggle('active',x===b));notice(({fire:'🔥 烈焰',ice:'❄️ 冰霜',lightning:'⚡ 雷霆',arcane:'🔮 奧術'})[element]+'已裝備')});document.getElementById('chain').onclick=e=>{chain=!chain;e.target.textContent='💎 連鎖：'+(chain?'開':'關');e.target.classList.toggle('active',chain)};document.getElementById('pause').onclick=e=>{if(!running)return;paused=!paused;e.target.textContent=paused?'▶ 繼續':'⏸ 暫停'};function loop(ts){let dt=Math.min((ts-last)/1000||0,.04);last=ts;update(dt);draw(ts/1000);requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
