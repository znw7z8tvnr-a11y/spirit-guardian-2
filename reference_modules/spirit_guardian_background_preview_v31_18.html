 function syncPause(){pause.setAttribute('aria-pressed',String(paused));pause.textContent=paused?'繼續動畫':'暫停動畫'}
 pause.onclick=()=>{paused=!paused;last=0;syncPause()};syncPause();
 document.addEventListener('visibilitychange',()=>{last=0});
 resize();
 function frame(ms){if(!last)last=ms;const dt=Math.min((ms-last)/1000,.05);last=ms;if(!paused)t+=dt;
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(staticLayer,0,0);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const s=Math.max(w/1280,h/720),dw=1280*s,dh=720*s;
  ctx.save();ctx.translate((w-dw)/2,(h-dh)/2);ctx.scale(s,s);
  SGBackground.drawRunicPulse(ctx,{time:t,quality,width:1280,height:720,reducedMotion:reduced});
  SGBackground.drawAtmosphere(ctx,{time:t,quality,width:1280,height:720});ctx.restore();
  requestAnimationFrame(frame);
 }requestAnimationFrame(frame);
