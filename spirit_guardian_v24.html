<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>靈境守衛｜V24 法術實體化</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#07101e;color:#e7f4ff;font:14px system-ui,-apple-system,sans-serif}body{background:radial-gradient(ellipse at 45% 0%,#233455,#060b17 78%)}header{padding:12px 16px;border-bottom:1px solid #45688a;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(15px,3vw,22px);margin:0;color:#c2f6ff}small{color:#8eafc8;font-size:11px}a{color:#8be8ff;text-decoration:none;border:1px solid #487da0;border-radius:8px;padding:7px 10px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;padding:12px;max-width:1480px;margin:auto}.stage{border:1px solid #599ab8;border-radius:12px;overflow:hidden;background:#0b1422;box-shadow:0 15px 50px #0008}canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;touch-action:manipulation}.bar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}button{font:inherit;min-height:37px;border:1px solid #508db4;border-radius:8px;background:#1a3353;color:#e6f8ff;padding:7px 12px;cursor:pointer}button:active{transform:scale(.97)}button.active{background:#256b87;border-color:#b2f6ff}aside{background:#101d34;border:1px solid #3c6485;border-radius:12px;padding:10px}#catalog{display:grid;grid-template-columns:1fr 1fr;gap:6px}#catalog button{text-align:left;font-size:11px;padding:7px 6px}h2{font-size:17px;margin:7px 0;color:#c2f6ff}p{color:#b5cce0;font-size:13px;line-height:1.5}.meta,.hint{color:#9eb8cf;font-size:12px}.hint{border:1px solid #315573;background:#0b172a;border-radius:8px;padding:10px;margin-bottom:10px;line-height:1.7}@media(max-width:820px){.layout{grid-template-columns:1fr;padding:8px}#catalog{grid-template-columns:repeat(3,1fr)}}@media(max-width:490px){#catalog{grid-template-columns:repeat(2,1fr)}header small{display:none}.bar button{flex:1}}
</style></head><body><header><div><h1>✦ 靈境守衛 · 像素法術 V24</h1><small>22 種獨立演出｜單次命中｜暫停修正｜塔體反饋</small></div><a href="index.html">返回遊戲</a></header><div class="layout"><main><div class="stage"><canvas id="stage" width="960" height="540"></canvas></div><div class="bar"><button id="replay">↻ 重新施放</button><button id="auto">▶ 自動輪播</button><button id="pause">Ⅱ 暫停</button></div><h2 id="skillTitle"></h2><p id="caption"></p><div class="meta" id="status"></div></main><aside><div class="hint">V24：修正重複扣血、暫停仍運作、傷害數字與實際扣血不符；22 種法術均有專屬視覺。<br>點選法術即可重新播放；也可啟動自動輪播。</div><h2>⚔ 22 種法術</h2><div id="catalog"></div></aside></div><script>
'use strict';
const C=document.getElementById('stage'),g=C.getContext('2d',{alpha:false}),W=960,H=540,PI=Math.PI,TAU=2*PI;
const skills=[['fire','🔥','爆裂火球','#ff6b2a','fire'],['ice','❄','寒冰長槍','#6cddff','ice'],['lightning','⚡','連鎖雷電','#b2a1ff','thunder'],['poison','☣','毒霧','#83df63','poison'],['meteor','☄','流星雨','#ff8b35','fire'],['arcane','✦','奧術飛彈','#c5a5ff','arcane'],['sword','⚔','迴旋月刃','#ffd56e','physical'],['pierce','➶','穿透射線','#78e8ff','physical'],['earth','⛰','土刺','#c2a172','earth'],['wind','🌪','颶風','#8cebd8','wind'],['beam','🔆','聚焦光束','#ffe082','light'],['orbit','🪐','旋轉法球','#a68cff','arcane'],['lava','🌋','熔岩裂隙','#ff5835','fire'],['gravity','🌀','引力漩渦','#9686ff','arcane'],['summon','👻','幽靈守衛','#86ffe1','spirit'],['thorn','🌿','荊棘護城','#9dff77','nature'],['spark','✨','火花術','#ffc84c','fire'],['storm','🌩','雷電風暴','#b8a6ff','thunder'],['blizzard','🌨','暴風雪','#b5f2ff','ice'],['nova','💠','冰霜新星','#85ebff','ice'],['swamp','🧪','毒沼','#85d35b','poison'],['skeleton','💀','骷髏召喚','#e2d7c3','spirit']];
const byKey=Object.fromEntries(skills.map(s=>[s[0],s]));let current='fire',time=0,last=performance.now(),auto=false,paused=false,hitStop=0,trauma=0,particles=[],numbers=[],didHit=false,cycle=0,skillAlpha=1;const tower={x:240,y:225,scale:1,recoil:0};
const targets=[650,720,790].map((x,i)=>({x,y:340,baseX:x,baseY:340,hp:100,maxHp:100,hit:0,dead:0,respawn:0,phase:i*2.1}));
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};const rnd=n=>{let x=Math.sin(n*127.1+13.7)*43758.5453;return x-Math.floor(x)};
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function disc(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,Math.max(.1,r),0,TAU);g.fill()}function line(a,c,w=2){g.strokeStyle=c;g.lineWidth=w;g.beginPath();a.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke()}function bolt(x1,y1,x2,y2,seed=1){let a=[];for(let i=0;i<=9;i++){let t=i/9;a.push([x1+(x2-x1)*t+(i===0||i===9?0:(rnd(seed+i*7)-.5)*22),y1+(y2-y1)*t+(i===0||i===9?0:(rnd(seed+i*11)-.5)*22)])}line(a,'#7455dd',9);line(a,'#d6cbff',4);line(a,'#fff',2)}
function particle(x,y,n,c,sp=120,life=.55,size=4){for(let i=0;i<n;i++){let a=Math.random()*TAU,s=sp*(.35+Math.random()*.8),l=life*(.6+Math.random()*.6);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:l,max:l,size:size*(.6+Math.random()),c})}if(particles.length>650)particles.splice(0,particles.length-650)}
function damage(e,col,amount=25){if(e.dead>0||e.respawn>0||e.hp<=0)return;e.hp=Math.max(0,e.hp-amount);e.hit=.23;e.x+=15;numbers.push({x:e.x,y:e.y-45,life:.9,value:amount,col});particle(e.x,e.y-8,15,col,150,.5,4);hitStop=2;trauma=Math.max(trauma,.6);if(e.hp===0){e.dead=.6;particle(e.x,e.y,28,'#fa6380',200,.9,5)}}
function update(dt){tower.scale+=(1-tower.scale)*Math.min(1,dt*8);tower.recoil+=(0-tower.recoil)*Math.min(1,dt*9);for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}for(let i=numbers.length-1;i>=0;i--){let n=numbers[i];n.y-=45*dt;n.life-=dt;if(n.life<=0)numbers.splice(i,1)}for(let e of targets){e.hit=Math.max(0,e.hit-dt);if(e.dead>0){e.dead-=dt;if(e.dead<=0)e.respawn=1.2}else if(e.respawn>0){e.respawn-=dt;if(e.respawn<=0){e.hp=e.maxHp;e.x=e.baseX;particle(e.x,e.y,12,'#fff',80,.4,3)}}else{e.phase+=dt*3;e.y=e.baseY+Math.sin(e.phase)*4;e.x+=(e.baseX-e.x)*Math.min(1,dt*5)}}trauma=Math.max(0,trauma-dt*3);skillAlpha=Math.max(0,skillAlpha-dt*.65)}
function background(){rect(0,0,W,H,'#284724');for(let i=0;i<360;i++){let x=rnd(i+20)*W,y=rnd(i*4+90)*H;rect(x,y,4,4,i%3?'#33552a':'#40642f')}for(let i=0;i<32;i++){let x=rnd(i+450)*W,y=rnd(i+660)*H;rect(x,y,3,10,'#5d7e3d');rect(x-4,y+5,10,3,'#466a32')}g.fillStyle='#796244';g.beginPath();g.moveTo(0,300);g.bezierCurveTo(230,290,320,390,500,345);g.bezierCurveTo(700,290,800,200,960,240);g.lineTo(960,385);g.bezierCurveTo(800,335,700,440,500,480);g.bezierCurveTo(320,525,210,430,0,435);g.fill();line([[0,301],[150,311],[330,359],[500,346],[710,293],[960,241]],'#a48b61',4);for(let i=0;i<80;i++){let x=rnd(i+1800)*W,y=335+rnd(i+1100)*105;rect(x,y,3+rnd(i+30)*5,2,i%2?'#a1875c':'#5e4c38')}for(let i=0;i<11;i++){let x=40+i*91,y=120+Math.sin(i*3)*27;rect(x,y,26,12,'#213b23');rect(x+5,y-20,17,22,'#315b30');rect(x+10,y-29,8,12,'#426b36')}}
function drawTower(){g.fillStyle='#0008';g.beginPath();g.ellipse(240,301,57,18,0,0,TAU);g.fill();rect(190,210,101,88,'#3a526b');rect(200,198,82,88,'#617f9c');rect(206,210,70,10,'#9fb7c9');rect(209,230,63,55,'#4a627e');for(let i=0;i<4;i++){rect(194+i*24,190,19,17,'#a1b7c8');rect(194+i*24,203,19,6,'#617a92')}rect(228,257,24,30,'#1c3049');rect(233,259,4,8,'#e9c578');g.save();g.translate(240-tower.recoil,191);g.scale(tower.scale,tower.scale);g.rotate(Math.sin(time*2)*.09);disc(0,0,26,'#2b8fbb');g.fillStyle='#62efff';g.beginPath();g.moveTo(0,-27);g.lineTo(16,0);g.lineTo(0,27);g.lineTo(-16,0);g.closePath();g.fill();line([[0,-27],[0,27]],'#d8ffff',3);g.restore();g.fillStyle='#d8edfa';g.font='bold 14px monospace';g.fillText('水晶守衛塔',192,327)}
function drawTargets(){for(let e of targets){if(e.dead>0||e.respawn>0)continue;g.save();g.translate(Math.round(e.x),Math.round(e.y));g.fillStyle='#0007';g.beginPath();g.ellipse(0,16,16,6,0,0,TAU);g.fill();g.translate(e.hit>0?Math.sin(time*65)*3:0,0);rect(-13,-14,26,28,e.hit>0?'#fff':'#426fb2');rect(-10,-27,20,17,e.hit>0?'#fff':'#c5bba5');rect(-5,-21,4,4,'#111725');rect(4,-21,4,4,'#111725');rect(-17,4,6,17,'#314e77');rect(11,4,6,17,'#314e77');rect(-19,-39,38,6,'#18232c');rect(-18,-38,36*e.hp/e.maxHp,4,'#ff5575');g.restore()}}
function spell(k,t){const col=byKey[k][3],sx=240,sy=191,tar=targets.find(e=>e.dead<=0&&e.respawn<=0)||targets[0],x=tar.x,y=tar.y-10,u=smooth(.18,.56,t),live=targets.filter(e=>e.dead<=0&&e.respawn<=0);if(t<.2)tower.scale=1+t*2;else if(t<.26)tower.recoil=6;if(!didHit&&t>=.53){didHit=true;let multi=['lightning','storm','beam','nova','blizzard','meteor','pierce','lava','wind','gravity'].includes(k);(multi?live:[tar]).forEach(e=>damage(e,col,k==='meteor'?40:25))}const active=t>.18&&t<1.2;switch(k){
case 'fire':if(u>0&&u<1){let px=sx+(x-sx)*u,py=sy+(y-sy)*u-100*Math.sin(u*PI);disc(px,py,14,'#b53c20');disc(px,py,9,'#ffae3d');disc(px-3,py-3,4,'#fff3a8')}if(t>.53&&t<.9){disc(x,y,50*smooth(.53,.8,t),'#ff9d3544');for(let i=0;i<9;i++){let a=i*TAU/9+t*2;rect(x+Math.cos(a)*35,y+Math.sin(a)*35,7,7,col)}}break;
case 'ice':if(u>0&&u<1){let px=sx+(x-sx)*u,py=sy+(y-sy)*u;g.save();g.translate(px,py);g.rotate(Math.atan2(y-sy,x-sx));g.fillStyle=col;g.beginPath();g.moveTo(28,0);g.lineTo(-16,-10);g.lineTo(-10,0);g.lineTo(-16,10);g.closePath();g.fill();g.restore()}if(t>.5&&t<1){for(let i=0;i<7;i++)rect(x+(i-3)*12,y-25-rnd(i)*28,5,24,col)}break;
case 'lightning':if(t>.22&&t<.75){let last=[sx,sy];live.forEach((e,i)=>{bolt(last[0],last[1],e.x,e.y-12,i+Math.floor(t*16));last=[e.x,e.y-12]})}break;
case 'poison':case 'swamp':if(t>.32&&t<1.2){let r=70*smooth(.32,.85,t);g.globalAlpha=.45*(1-smooth(.95,1.2,t));disc(x,y+12,r,col);g.globalAlpha=1;for(let i=0;i<12;i++){let px=x+Math.sin(i*3.4+t*2)*r*.7,py=y+Math.cos(i*4.1+t)*r*.4;disc(px,py,3+i%3,col)}}break;
case 'meteor':if(active)for(let i=0;i<5;i++){let v=smooth(.17+i*.075,.55+i*.075,t);if(v<=0||v>=1)continue;let px=x+(i-2)*48+(1-v)*170,py=y-340*(1-v);line([[px+22,py-33],[px,py]],'#ff733c',9);disc(px,py,11,'#ffcf73')}break;
case 'arcane':if(active)for(let i=0;i<5;i++){let v=smooth(.15+i*.06,.52+i*.06,t);if(v>=1)continue;let px=sx+(x-sx)*v,py=sy+(y-sy)*v+Math.sin(v*12+i*2)*28;disc(px,py,8,col);disc(px,py,3,'#fff')}break;
case 'sword':if(active){let v=t<.7?smooth(.2,.7,t):1-smooth(.7,1.15,t),px=sx+(x-sx)*v,py=sy+(y-sy)*v;g.save();g.translate(px,py);g.rotate(t*13);rect(-22,-4,44,8,'#ffe1a0');rect(-4,-18,8,36,col);g.restore()}break;
case 'pierce':if(t>.3&&t<.9){line([[sx,sy],[W,y]],'#3887ab',15);line([[sx,sy],[W,y]],col,6);line([[sx,sy],[W,y]],'#fff',2)}break;
case 'earth':case 'thorn':if(t>.35&&t<1.1)for(let i=0;i<7;i++){let px=x+(i-3)*22,h=(20+rnd(i+10)*42)*smooth(.35+i*.03,.6+i*.03,t)*(1-smooth(.85,1.1,t));g.fillStyle=col;g.beginPath();g.moveTo(px-10,y+15);g.lineTo(px,y+15-h);g.lineTo(px+10,y+15);g.fill()}break;
case 'wind':if(active)for(let i=0;i<5;i++){let v=(t*.9+i/5)%1,ry=80*(1-v),rx=25+v*58;g.save();g.translate(x,y-ry);g.scale(1,.3);g.strokeStyle=col;g.lineWidth=5;g.beginPath();g.ellipse(0,0,rx,rx,0,0,TAU*.85);g.stroke();g.restore()}break;
case 'beam':if(t>.25&&t<.9){let w=8+Math.sin(t*55)*3;line([[sx,sy],[x,y]],'#be8a33',w+12);line([[sx,sy],[x,y]],col,w);line([[sx,sy],[x,y]],'#fff',3);disc(x,y,19,col)}break;
case 'orbit':if(active)for(let i=0;i<5;i++){let a=t*8+i*TAU/5;let cx=sx+(x-sx)*smooth(.2,.9,t),cy=sy+(y-sy)*smooth(.2,.9,t);disc(cx+Math.cos(a)*30,cy+Math.sin(a)*20,9,col)}break;
case 'lava':if(t>.35&&t<1.1){let v=smooth(.35,.8,t);line([[sx+40,300],[x-50,y+18],[x+100,y+40]],'#5c2523',27*v);line([[sx+40,300],[x-50,y+18],[x+100,y+40]],col,13*v);for(let i=0;i<8;i++)disc(x+(i-3)*20,y+30+Math.sin(i+t*6)*10,4,'#ffcc65')}break;
case 'gravity':if(active){let r=65*smooth(.2,.75,t);disc(x,y,r,'#4d347b66');for(let i=0;i<8;i++){let a=i*TAU/8+t*5,rr=r*(.3+.7*rnd(i+30));disc(x+Math.cos(a)*rr,y+Math.sin(a)*rr,5,col)}disc(x,y,17,'#26194d')}break;
case 'summon':if(active){let px=sx+115+Math.sin(t*3)*18,py=sy+70;disc(px,py-15,19,'#a4ffed99');disc(px-6,py-18,3,'#172b32');disc(px+6,py-18,3,'#172b32');for(let i=0;i<4;i++)disc(px+(i-1.5)*8,py+6+Math.sin(t*8+i)*5,5,col);line([[px+16,py],[x,y]],col,3)}break;
case 'spark':if(active)for(let i=0;i<16;i++){let v=smooth(.2+i*.012,.7+i*.012,t),px=sx+(x-sx)*v+Math.sin(i*3+t*9)*35,py=sy+(y-sy)*v+Math.cos(i*4+t*9)*26;rect(px,py,4+i%3,4+i%3,i%3?'#ffc84c':'#fff')}break;
case 'storm':if(active){for(let i=0;i<3;i++){let px=targets[i].x,py=targets[i].y;bolt(px-35,-30,px,py-15,i+Math.floor(t*10));disc(px,py,18,'#b8a6ff77')}}break;
case 'blizzard':if(active){g.globalAlpha=.3;rect(540,180,350,210,'#a7e8ff');g.globalAlpha=1;for(let i=0;i<75;i++){let px=560+rnd(i*3+5)*300,py=160+((rnd(i*9)*270+t*130)%260);rect(px,py,4,4,i%2?'#fff':col)}}break;
case 'nova':if(t>.3&&t<1.1){let r=150*smooth(.3,.75,t);g.strokeStyle=col;g.lineWidth=12*(1-smooth(.75,1.1,t));g.beginPath();g.ellipse(x,y,r,r*.42,0,0,TAU);g.stroke();for(let i=0;i<12;i++){let a=i*TAU/12;disc(x+Math.cos(a)*r,y+Math.sin(a)*r*.42,5,'#fff')}}break;
case 'skeleton':if(active){let px=sx+115,py=sy+100;disc(px,py-18,15,'#e4decf');rect(px-9,py-3,18,27,'#c7bfaf');rect(px-6,py-22,4,5,'#17232b');rect(px+4,py-22,4,5,'#17232b');line([[px+10,py],[px+30,py-20],[x,y]],'#d9cfb8',4)}break;
}}
function effects(){for(let p of particles){g.globalAlpha=clamp(p.life/p.max);rect(p.x,p.y,p.size,p.size,p.c)}g.globalAlpha=1;for(let n of numbers){g.globalAlpha=clamp(n.life*2);g.font='bold 20px monospace';g.textAlign='center';g.lineWidth=4;g.strokeStyle='#10131a';g.strokeText(n.value,n.x,n.y);g.fillStyle=n.col;g.fillText(n.value,n.x,n.y)}g.globalAlpha=1;g.textAlign='left'}
function render(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){if(hitStop>0){dt*=.12;hitStop--}time+=dt;update(dt);if(auto&&time>=1.65){let i=skills.findIndex(s=>s[0]===current);choose(skills[(i+1)%skills.length][0])}}g.save();let s=trauma*trauma;g.translate(Math.round((Math.random()*2-1)*8*s),Math.round((Math.random()*2-1)*8*s));background();drawTower();drawTargets();spell(current,time);effects();g.restore();if(skillAlpha>0){g.globalAlpha=skillAlpha;g.textAlign='center';g.font='bold 26px monospace';g.strokeStyle='#0a1322';g.lineWidth=5;g.strokeText(byKey[current][2],W/2,70);g.fillStyle='#fff';g.fillText(byKey[current][2],W/2,70);g.globalAlpha=1;g.textAlign='left'}requestAnimationFrame(render)}
const catalog=document.getElementById('catalog'),title=document.getElementById('skillTitle'),caption=document.getElementById('caption'),status=document.getElementById('status');for(const s of skills){let b=document.createElement('button');b.textContent=s[1]+' '+s[2];b.dataset.key=s[0];b.onclick=()=>choose(s[0]);catalog.appendChild(b)}function choose(k){if(!byKey[k])return;current=k;time=0;didHit=false;hitStop=0;trauma=.25;skillAlpha=1;particles=[];numbers=[];tower.scale=1;tower.recoil=0;targets.forEach(e=>{e.hp=e.maxHp;e.dead=0;e.respawn=0;e.hit=0;e.x=e.baseX;e.y=e.baseY});title.textContent=byKey[k][1]+' '+byKey[k][2];title.style.color=byKey[k][3];caption.textContent='元素：'+byKey[k][4]+'｜獨立施法演出、命中判定、擊退與碎裂。';status.textContent='V24 · '+(paused?'已暫停':'播放中')+' · '+skills.length+' 種技能';for(let b of catalog.children)b.classList.toggle('active',b.dataset.key===k)}document.getElementById('replay').onclick=()=>choose(current);document.getElementById('auto').onclick=e=>{auto=!auto;e.currentTarget.textContent=auto?'■ 停止輪播':'▶ 自動輪播';e.currentTarget.classList.toggle('active',auto);if(auto&&time>1.4)time=1.4};document.getElementById('pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶ 繼續':'Ⅱ 暫停';status.textContent='V24 · '+(paused?'已暫停':'播放中')+' · '+skills.length+' 種技能'};choose('fire');requestAnimationFrame(render);
</script></body></html>
