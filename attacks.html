</style></head><body><header><div><h1>✦ 靈境守衛 · 全法術動畫試演場</h1><small>22 種攻擊法術｜獨立動畫｜施法 → 成形 → 命中 → 殘留</small></div><a class="back" href="index.html">返回遊戲 ↗</a></header><div class="layout"><main><div class="stage"><canvas id="stage" width="960" height="540" aria-label="法術動畫展示"></canvas></div><div class="bar"><button id="replay">↻ 再施放一次</button><button id="auto">自動輪播 22 招</button><button id="quality">畫質：高</button><span class="status">可點選右側任一法術</span></div><h2 id="skillTitle"></h2><p id="caption"></p><p class="status">這是以遊戲 Canvas 特效核心建立的動畫試演場，並非實機遊戲截圖。獨特的召喚單位 AI 和持續區域傷害仍由戰鬥系統決定。</p></main><aside><h2>⚔ 全部攻擊法術（22）</h2><div id="catalog"></div></aside></div><script>
const canvas=document.getElementById('stage');const ctx=canvas.getContext('2d',{alpha:false});const W=960,H=540;
canvas.width=W;canvas.height=H;
const prefs={quality:'high'};let p2Effects=[];let current='fire',auto=false,nextAuto=0,last=performance.now(),frame=0;
const SK={
 fire:['🔥','爆裂火球','#ff9554',24],ice:['❄','寒冰長槍','#86eaff',21],lightning:['⚡','連鎖雷電','#e3c2ff',20],poison:['☣','毒霧','#a2ff9a',17],meteor:['☄','流星雨','#ffbf73',44],arcane:['✦','奧術飛彈','#e8d7ff',18],sword:['⚔','迴旋月刃','#ffdb91',26],pierce:['➶','穿透射線','#8ce9f8',24],earth:['⛰','土刺','#d8b589',29],wind:['🌪','颶風','#a7eddf',17],beam:['🔆','聚焦光束','#ffe6a0',30],orbit:['🪐','旋轉法球','#bd9dff',22],lava:['🌋','熔岩裂隙','#ff8c66',25],gravity:['🌀','引力漩渦','#9f9cff',20],summon:['👻','幽靈守衛','#b4f5f1',22],thorn:['🌿','荊棘護城','#b7ee85',20],spark:['✨','火花術','#ffd189',13],storm:['🌩','雷電風暴','#dfc8ff',35],blizzard:['🌨','暴風雪','#b0eaff',27],nova:['💠','冰霜新星','#a2f4ff',28],swamp:['🧪','毒沼','#a8ef92',22],skeleton:['💀','骷髏召喚','#d9d1bd',23]
};
const P2_PREMIUM_SPRITES={};
function p2PremiumSprite(type){
 if(P2_PREMIUM_SPRITES[type])return P2_PREMIUM_SPRITES[type];
 const c=document.createElement('canvas');c.width=c.height=192;const g=c.getContext('2d');g.translate(96,96);
 if(type==='flame'||type==='ember'){const rg=g.createRadialGradient(0,0,0,0,0,82);rg.addColorStop(0,'#ffffff');rg.addColorStop(.14,'#ffeab0');rg.addColorStop(.36,'#ff9a38');rg.addColorStop(.65,'#f54c13aa');rg.addColorStop(1,'#ff4f0000');g.fillStyle=rg;g.fillRect(-96,-96,192,192)}
 if(type==='void'){const rg=g.createRadialGradient(0,0,5,0,0,84);rg.addColorStop(0,'#03010d');rg.addColorStop(.4,'#120528');rg.addColorStop(.67,'#a34dff9c');rg.addColorStop(1,'#a43cff00');g.fillStyle=rg;g.fillRect(-96,-96,192,192)}
 if(type==='frost'){g.shadowColor='#c9faff';g.shadowBlur=16;g.fillStyle='#efffff';g.strokeStyle='#4ceaff';g.lineWidth=4;g.beginPath();g.moveTo(0,-85);g.lineTo(16,-17);g.lineTo(10,59);g.lineTo(0,82);g.lineTo(-10,59);g.lineTo(-16,-17);g.closePath();g.fill();g.stroke();g.fillStyle='#71c9ef';g.beginPath();g.moveTo(0,-70);g.lineTo(8,-12);g.lineTo(0,60);g.closePath();g.fill()}
 if(type==='blade'){g.shadowColor='#fff3bb';g.shadowBlur=13;g.fillStyle='#f5fcff';g.strokeStyle='#c38aff';g.lineWidth=5;g.beginPath();g.moveTo(-84,7);g.quadraticCurveTo(8,-77,83,-24);g.quadraticCurveTo(14,-30,-50,30);g.closePath();g.fill();g.stroke()}
 if(type==='rune'){g.strokeStyle='#c3faff';g.lineWidth=3;g.shadowColor='#45dbff';g.shadowBlur=14;for(let j=0;j<2;j++){g.beginPath();g.arc(0,0,66-j*18,0,Math.PI*2);g.stroke()}for(let i=0;i<8;i++){const a=i*Math.PI/4;g.save();g.rotate(a);g.strokeRect(-4,-72,8,10);g.beginPath();g.moveTo(0,-47);g.lineTo(0,-38);g.stroke();g.restore()}g.beginPath();for(let i=0;i<6;i++){let a=i*Math.PI/3;let x=Math.cos(a)*42,y=Math.sin(a)*42;i?g.lineTo(x,y):g.moveTo(x,y)}g.closePath();g.stroke()}
 if(type==='ghost'||type==='skeleton'){g.shadowColor='#86ffff';g.shadowBlur=18;g.strokeStyle=type==='ghost'?'#a8efff':'#b6ffd5';g.fillStyle=type==='ghost'?'#73c8ff7a':'#a9f7db';g.lineWidth=5;g.beginPath();g.arc(0,-41,15,0,Math.PI*2);g.fill();g.stroke();if(type==='ghost'){g.beginPath();g.moveTo(-16,-21);g.quadraticCurveTo(-42,5,-34,55);g.quadraticCurveTo(0,37,33,57);g.quadraticCurveTo(35,5,16,-21);g.closePath();g.fill();g.stroke();g.beginPath();g.moveTo(20,-13);g.lineTo(54,-65);g.stroke()}else{g.beginPath();g.moveTo(0,-20);g.lineTo(0,36);g.moveTo(-25,2);g.lineTo(25,2);g.moveTo(0,36);g.lineTo(-23,64);g.moveTo(0,36);g.lineTo(23,64);g.stroke()}}
 return P2_PREMIUM_SPRITES[type]=c;
}
function p2DrawEffects(ctx,p2Effects,prefs){
 const q=prefs.quality==='low'?.42:prefs.quality==='medium'?.7:1;
 const sprite=(key,x,y,size,alpha=1,angle=0)=>{ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);ctx.rotate(angle);ctx.drawImage(p2PremiumSprite(key),-size/2,-size/2,size,size);ctx.restore()};
 const line=(x,y,xx,yy,width=2)=>{ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke()};
 const circ=(x,y,r,width=2)=>{ctx.lineWidth=width;ctx.beginPath();ctx.arc(x,y,Math.max(.01,r),0,Math.PI*2);ctx.stroke()};
 const crystal=(x,y,r,angle=0)=>{ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r*.25,-r*.3);ctx.lineTo(r*.18,r*.7);ctx.lineTo(0,r);ctx.lineTo(-r*.22,r*.5);ctx.lineTo(-r*.26,-r*.27);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()};
 for(const f of p2Effects){
  const p=Math.min(1,f.age/f.life), cast=Math.min(1,p/.19), impact=Math.max(0,1-Math.abs(p-.47)/.18), after=Math.max(0,Math.min(1,(p-.52)/.48));
  const fade=Math.max(0,1-p),rng=(i)=>Math.sin(f.seed*13.17+i*78.24)*43758.5453%1;
  const x=f.x,y=f.y,ang=Math.atan2(y-f.oy,x-f.ox),dist=Math.hypot(x-f.ox,y-f.oy),deep=1+Math.min(f.depth,6)*.12;
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.88*fade;ctx.translate(x,y);
  ctx.strokeStyle=f.color;ctx.fillStyle=f.color;ctx.shadowColor=f.color;ctx.shadowBlur=12*q;
  // The cast ritual is distinguishable, and precedes the principal body.
  if(p<.38){ctx.save();ctx.globalAlpha*=1-p/.45;ctx.scale(1,.48);ctx.rotate(f.seed+p*2);sprite('rune',0,0,(42+cast*110)*deep);ctx.restore()}
  // Ground contact shadow/afterglow keeps spells part of the map rather than pasted on top.
  if(p>.36){ctx.save();ctx.scale(1,.36);ctx.globalAlpha*=Math.max(0,(1-p)*1.5);circ(0,0,(18+p*110)*deep,4+impact*7);ctx.restore()}
  switch(f.kind){
   case 'fire':case 'spark':case 'meteor':case 'lava':{
    const isMeteor=f.kind==='meteor',isSpark=f.kind==='spark',isLava=f.kind==='lava';
    const volume=isMeteor?2.3:isLava?1.35:isSpark?.55:1;
    if(p<.55){let k=Math.min(1,p/.46),bx=-(1-k)*Math.cos(ang)*Math.min(dist,190),by=-(1-k)*Math.sin(ang)*Math.min(dist,190);sprite('flame',bx,by,(isMeteor?135:isSpark?45:88)*deep,1,ang);for(let j=0;j<4*q+2;j++){let xx=bx-Math.cos(ang)*(j*15+9),yy=by-Math.sin(ang)*(j*15+9);sprite('ember',xx,yy,(38-j*5)*volume,.52-j*.085)}}
    if(p>.34){sprite('flame',0,0,(68+impact*145)*volume*deep,.85*fade);ctx.lineWidth=5;circ(0,0,(15+after*175)*volume,5*fade);for(let i=0;i<12*q+4;i++){let a=i*2.399+f.seed,rr=(30+after*105)*volume;ctx.save();ctx.rotate(a);line(rr-17,-4,rr+35+impact*40,6,2+impact*4);ctx.restore()}if(isMeteor||isLava){ctx.save();ctx.globalAlpha*=.5;ctx.scale(1,.45);for(let i=0;i<6;i++){let a=i*Math.PI/3;line(Math.cos(a)*16,Math.sin(a)*16,Math.cos(a)*(85+after*80),Math.sin(a)*(85+after*80),5)}ctx.restore()}}
    break}
   case 'ice':case 'nova':case 'blizzard':{
    const storm=f.kind==='blizzard',nova=f.kind==='nova';
    if(!storm&&!nova&&p<.62){const t=Math.min(1,p/.54);let bx=-(1-t)*Math.cos(ang)*Math.min(dist,170),by=-(1-t)*Math.sin(ang)*Math.min(dist,170);sprite('frost',bx,by,150*deep,1,ang+Math.PI/2)}
    for(let j=0;j<(storm?15:8)*q+3;j++){let a=j*2.399+f.seed+p*(storm?4:.25),rr=(nova?20:12)+(j*17)%75+after*85;ctx.save();ctx.rotate(a);crystal(rr,Math.sin(j*5+p*22)*9,(9+(j%4)*8)*(nova?1.5:1)*(1-.55*after),a+p);ctx.restore()}
    if(storm){ctx.globalAlpha*=.55;circ(0,0,110+Math.sin(p*25)*12,8);ctx.rotate(p*2);circ(0,0,80,3)}
    break}
   case 'lightning':case 'storm':{
    const branches=f.kind==='storm'?8:5;
    for(let i=0;i<branches;i++){const a=i*Math.PI*2/branches+f.seed;ctx.save();ctx.rotate(a);ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(0,0);for(let j=1;j<=7;j++){let rr=j*(f.kind==='storm'?22:14)*deep;ctx.lineTo(rr,(Math.sin(j*12+f.seed*9+i*3+p*38)*14)*(1-j/10))}ctx.shadowBlur=18;ctx.lineWidth=12*(1-p)+3;ctx.strokeStyle='#3667ff';ctx.stroke();ctx.lineWidth=2.8;ctx.strokeStyle='#f3ffff';ctx.stroke();ctx.restore()}sprite('rune',0,0,45+impact*90,.8);break}
   case 'gravity':case 'wind':{
    if(f.kind==='gravity')sprite('void',0,0,(85+after*185)*deep,.9);
    for(let k=0;k<3;k++){ctx.save();ctx.rotate((k%2?-1:1)*(p*7)+k*2);ctx.scale(1,.65);ctx.lineWidth=3+k;ctx.beginPath();ctx.arc(0,0,35+k*29+Math.sin(p*15+k)*9,k*1.3,k*1.3+Math.PI*1.4);ctx.stroke();ctx.restore()}
    for(let j=0;j<12*q+2;j++){let a=j*2.399+p*(f.kind==='wind'?10:-7)+f.seed,rr=(f.kind==='gravity'?140-after*115:45+after*105)+(j%4)*8;crystal(Math.cos(a)*rr,Math.sin(a)*rr*.65,6+(j%3)*5,a+p*8)}break}
   case 'beam':case 'pierce':{
    ctx.save();ctx.rotate(ang);let length=Math.max(70,Math.min(370,dist));ctx.fillStyle='#ffffff';ctx.strokeStyle=f.color;ctx.shadowBlur=27;ctx.fillRect(-length, -5-impact*4,length+80,10+impact*8);for(let i=0;i<3;i++){ctx.globalAlpha*=.8;line(-length,(-1+i)*13,82,(-1+i)*13,3)}ctx.restore();sprite('rune',0,0,64+impact*36,.8);break}
   case 'sword':{
    for(let j=0;j<3;j++){let a=j*Math.PI*2/3+p*8; sprite('blade',Math.cos(a)*32,Math.sin(a)*30,110+impact*45,1,a+Math.PI/2)}break}
   case 'earth':case 'thorn':{
    for(let i=0;i<8;i++){const a=i*2.399+f.seed,rr=18+(i%4)*20;ctx.save();ctx.translate(Math.cos(a)*rr,Math.sin(a)*rr);ctx.rotate(a);crystal(0,-17-(1-after)*22,(25+(i%3)*16)*Math.sin(Math.PI*Math.min(1,p/.8)),a);ctx.restore()}break}
   case 'poison':case 'swamp':{
    ctx.save();ctx.scale(1,.53);ctx.fillStyle='#27d98b25';ctx.beginPath();ctx.ellipse(0,0,60+after*110,45+after*60,0,0,Math.PI*2);ctx.fill();ctx.restore();for(let i=0;i<14*q+3;i++){let a=i*2.399+f.seed,rr=20+(i*19)%105+after*25;let yy=Math.sin(a)*rr-(p*75*(i%4)/4);circ(Math.cos(a)*rr,yy,4+(i%5)*3,2)}break}
   case 'arcane':case 'orbit':{
    sprite('rune',0,0,110+impact*100,.95,p*3);for(let i=0;i<5;i++){let a=i*2*Math.PI/5+p*7;crystal(Math.cos(a)*60,Math.sin(a)*35,18+p*8,a)}break}
   case 'summon':case 'skeleton':{
    sprite('rune',0,18,125+after*70,.9);ctx.save();ctx.globalAlpha*=Math.sin(Math.PI*Math.min(1,p/.92));sprite(f.kind==='summon'?'ghost':'skeleton',0,-45*(1-p),140*deep,.9);ctx.restore();break}
  }
  // Expanding loose shards and stardust. Bounded by quality, seeded rather than allocated each frame.
  const n=Math.ceil(9*q);for(let i=0;i<n;i++){const a=i*2.399+f.seed,rr=(18+i%5*8)+after*(55+i%4*26);ctx.globalAlpha*=.96;ctx.fillStyle=i%2?'#ffffff':f.color;ctx.beginPath();ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr*.7-(p*p*55)*(i%3)/2,1.3+i%3,0,Math.PI*2);ctx.fill()}
  ctx.restore();
 }
}

const keys=Object.keys(SK);let raf;
const catalog=document.getElementById('catalog'),title=document.getElementById('skillTitle'),caption=document.getElementById('caption'),mode=document.getElementById('auto');
const groups={fire:'有火舌的熔岩球體、餘燼與焦痕',ice:'可辨識的冰晶槍體、冰片與霜痕',lightning:'多股游走電弧、電紋與閃白',poison:'腐蝕毒雲、氣泡與持續毒域',meteor:'隕石下墜、熔岩核心與地裂',arcane:'旋轉奧術符文、晶體追蹤彈',sword:'旋轉月牙刀刃與折返殘影',pierce:'貫穿式能量槍與聚能軌道',earth:'岩刺從地面逐段升起',wind:'旋風渦流、環繞碎片和吸力',beam:'持續聚焦光束與魔法鏡環',orbit:'數顆環繞水晶法球自轉',lava:'熔岩裂隙、火核與地表裂紋',gravity:'黑紫色奇點、扭曲環與吸入物',summon:'召喚法陣與凝聚的幽靈輪廓',thorn:'從地下冒出的荊棘晶刺',spark:'密集高速火花與短尾焰',storm:'分岔雷暴、地表電紋',blizzard:'冰屑旋流與逐層寒霧',nova:'霜晶放射與結晶擴散',swamp:'腐蝕毒池、氣泡與蒸騰',skeleton:'亡靈召喚陣與骷髏身軀'};
for(const k of keys){const b=document.createElement('button');b.textContent=SK[k][0]+' '+SK[k][1];b.dataset.key=k;b.onclick=()=>choose(k);catalog.append(b)}
function choose(k){current=k;p2Effects=[];title.textContent=SK[k][0]+' '+SK[k][1];caption.textContent='演出設計：'+(groups[k]||'四階段法術演出')+'。動畫包含聚能、法術本體、命中與殘留。';for(const b of catalog.children)b.classList.toggle('active',b.dataset.key===k);trigger();}
function trigger(){const k=current;const long=['beam','gravity','blizzard','swamp','meteor','storm','summon','skeleton'].includes(k);const life=long?2.35:1.65;const x=630,y=290,ox=335,oy=290;p2Effects.push({kind:k,x,y,color:SK[k][2],depth:2,branch:0,ox,oy,age:0,life,seed:Math.random()*6.283});if(k==='meteor'||k==='storm'||k==='blizzard'){for(let j=0;j<3;j++)p2Effects.push({kind:k,x:x+(j-1)*92,y:y+(j%2)*70-35,color:SK[k][2],depth:1,branch:j,ox,oy,age:-j*.17,life,seed:Math.random()*6.283})}nextAuto=performance.now()+2250;}
function rune(x,y,r,time){ctx.save();ctx.translate(x,y);ctx.scale(1,.62);ctx.strokeStyle='#6ee9ff35';ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(0,0,r-i*18,0,Math.PI*2);ctx.stroke()}ctx.rotate(time*.2);for(let i=0;i<12;i++){let a=i*Math.PI/6;ctx.save();ctx.rotate(a);ctx.strokeRect(-3,-r-6,6,13);ctx.restore()}ctx.restore()}
function drawBG(now){ctx.fillStyle='#070d1d';ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(520,230,5,510,290,540);g.addColorStop(0,'#152d4e');g.addColorStop(.6,'#0d1832');g.addColorStop(1,'#030510');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(0,95);ctx.fillStyle='#0e223a';ctx.beginPath();ctx.ellipse(480,350,450,118,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#2f6d9180';ctx.lineWidth=3;ctx.stroke();rune(480,350,290,now*.001);ctx.restore();rune(335,280,72,now*.001);ctx.save();ctx.translate(335,280);ctx.fillStyle='#8be7ff';ctx.shadowBlur=35;ctx.shadowColor='#54bdff';for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.beginPath();ctx.moveTo(Math.cos(a)*18,Math.sin(a)*18);ctx.lineTo(Math.cos(a+.35)*35,Math.sin(a+.35)*35);ctx.lineTo(Math.cos(a-.35)*35,Math.sin(a-.35)*35);ctx.fill()}ctx.restore();ctx.strokeStyle='#c9e5ff22';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(360,294);ctx.lineTo(607,294);ctx.stroke();ctx.fillStyle='#a1d3ec';ctx.font='18px system-ui';ctx.fillText('守護祭壇',275,395);ctx.fillText('命中區',602,425)}
function loop(now){const dt=Math.min(.04,(now-last)/1000||.016);last=now;frame++;if(auto&&now>nextAuto){const idx=(keys.indexOf(current)+1)%keys.length;choose(keys[idx]);}drawBG(now);for(const f of p2Effects)f.age+=dt;p2Effects=p2Effects.filter(f=>f.age<f.life);p2DrawEffects(ctx,p2Effects,prefs);raf=requestAnimationFrame(loop)}
document.getElementById('replay').onclick=()=>trigger();mode.onclick=()=>{auto=!auto;mode.textContent=auto?'停止輪播':'自動輪播 22 招';mode.classList.toggle('active',auto);nextAuto=performance.now()+2100};document.getElementById('quality').onclick=(e)=>{prefs.quality=prefs.quality==='high'?'medium':prefs.quality==='medium'?'low':'high';e.target.textContent='畫質：'+({high:'高',medium:'中',low:'低'}[prefs.quality]);};choose('fire');raf=requestAnimationFrame(loop);
</script></body></html>
