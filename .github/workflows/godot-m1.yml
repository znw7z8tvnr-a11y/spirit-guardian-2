name: Godot M2 validation and Web build
on:
  push:
    branches: ['godot/**']
    paths: ['godot/**', 'tools/**', 'reference_modules/**', '.github/workflows/godot-m1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: '4.6.3'
      XDG_DATA_HOME: /tmp/sg-ci/data
      XDG_CONFIG_HOME: /tmp/sg-ci/config
      XDG_CACHE_HOME: /tmp/sg-ci/cache
    steps:
      - uses: actions/checkout@v4
      - name: Install matching official Godot and Web templates
        shell: bash
        run: |
          mkdir -p "$XDG_DATA_HOME/godot/export_templates/$GODOT_VERSION.stable" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" /tmp/godot
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64"
          ln -s "/tmp/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64" /tmp/godot/godot
          echo /tmp/godot >> "$GITHUB_PATH"
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_export_templates.tpz"
          unzip -j -q /tmp/templates.tpz 'templates/web_*' -d "$XDG_DATA_HOME/godot/export_templates/$GODOT_VERSION.stable"
      - name: Verify source-derived catalogs
        run: |
          python3 tools/build_supplement_catalog.py
          git diff --exit-code -- godot/data docs/m2/asset-manifest.json
      - name: Import and engine integration
        run: python3 tools/check_godot.py
      - name: Export single-thread Web
        run: |
          mkdir -p godot/export/web
          godot --headless --path godot --export-release Web > docs/m2-1/godot-export.log 2>&1
          if rg 'SCRIPT ERROR|ERROR:' docs/m2-1/godot-export.log; then exit 1; fi
          cp godot/assets/fonts/OFL.txt godot/export/web/FONT-LICENSE.txt
          cp godot/assets/fonts/FONT_INFO.json godot/export/web/FONT-INFO.json
      - name: Export separate Chain Lab
        run: |
          mkdir -p godot/export/lab
          godot --headless --path godot --export-release "Web Chain Lab" > docs/chain-lab/godot-lab-export.log 2>&1
          if rg "SCRIPT ERROR|ERROR:" docs/chain-lab/godot-lab-export.log; then exit 1; fi
          cp godot/assets/fonts/OFL.txt godot/export/lab/FONT-LICENSE.txt
          cp godot/assets/fonts/FONT_INFO.json godot/export/lab/FONT-INFO.json
      - name: Browser test dependencies
        run: |
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium
      - name: WebGL touch smoke
        run: python3 tools/test_web.py
      - name: Chain Lab WebGL touch smoke
        run: python3 tools/test_chain_lab_web.py
      - name: Package importable project and Web build
        run: |
          python3 tools/package_project.py
          python3 tools/package_chain_lab.py
      - uses: actions/upload-artifact@v4
        with:
          name: godot-chain-lab-delivery
          path: |
            dist/*.zip
            docs/m2-1/*.log
            docs/m2-1/*.json
            docs/m2-1/*.png
            docs/chain-lab/*.log
            docs/chain-lab/*.json
            docs/chain-lab/*.png
          if-no-files-found: error
