name: Godot M2 validation and Web build
on:
  push:
    branches: ['godot/**']
    paths: ['godot/**', 'tools/**', 'reference_modules/**', '.github/workflows/godot-m1.yml']
  workflow_dispatch:
    inputs:
      profile:
        description: 'focused: changed modules; integration: short cross-module checks; full: release regression'
        type: choice
        options: [focused, integration, full]
        default: focused
concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.plan.outputs.native }}
      browsers: ${{ steps.plan.outputs.browsers }}
      profile: ${{ steps.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify validation selection rules
        run: python3 tools/test_validation_plan.py
      - id: plan
        env:
          BASE_SHA: ${{ github.event.before }}
          PROFILE: ${{ inputs.profile || 'focused' }}
        run: python3 tools/plan_validation.py --profile "$PROFILE" --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: validation-selection
          path: qa/selection.json
  validate-build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: '4.6.3'
      XDG_DATA_HOME: /tmp/sg-ci/data
      XDG_CONFIG_HOME: /tmp/sg-ci/config
      XDG_CACHE_HOME: /tmp/sg-ci/cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/godot
            /tmp/sg-ci/data/godot/export_templates
          key: godot-${{ runner.os }}-4.6.3-v1
      - name: Install matching official Godot and Web templates
        shell: bash
        run: |
          mkdir -p "$XDG_DATA_HOME/godot/export_templates/$GODOT_VERSION.stable" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" /tmp/godot
          if [ ! -x /tmp/godot/godot ]; then
            curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64"
          ln -s "/tmp/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64" /tmp/godot/godot
          fi
          echo /tmp/godot >> "$GITHUB_PATH"
          mkdir -p docs/final-gems
          python3 tools/test_web_template_ranges.py
          if [ ! -s "$XDG_DATA_HOME/godot/export_templates/$GODOT_VERSION.stable/web_nothreads_release.zip" ] || [ ! -s "$XDG_DATA_HOME/godot/export_templates/$GODOT_VERSION.stable/web_nothreads_debug.zip" ]; then
            python3 tools/install_godot_web_templates.py --version "$GODOT_VERSION" --directory "$XDG_DATA_HOME/godot/export_templates/$GODOT_VERSION.stable" | tee docs/final-gems/template-range-download.json
          fi
      - name: Verify source-derived catalogs
        run: |
          python3 tools/build_supplement_catalog.py
          git diff --exit-code -- godot/data docs/m2/asset-manifest.json
      - name: Preserved source inventory
        run: python3 tools/inventory_port_sources.py
      - name: Import and engine integration
        run: python3 tools/check_godot.py --suites '${{ needs.plan.outputs.native }}' --report-dir qa/native
      - name: Export single-thread Web
        run: |
          mkdir -p godot/export/web
          godot --headless --path godot --export-release Web > docs/m2-1/godot-export.log 2>&1
          if rg 'SCRIPT ERROR|ERROR:' docs/m2-1/godot-export.log; then exit 1; fi
          cp godot/assets/fonts/OFL.txt godot/export/web/FONT-LICENSE.txt
          cp godot/assets/fonts/FONT_INFO.json godot/export/web/FONT-INFO.json
      - name: Export separate Chain Lab
        run: |
          mkdir -p godot/export/lab
          godot --headless --path godot --export-release "Web Chain Lab" > docs/flesh-wall/godot-lab-export.log 2>&1
          if rg "SCRIPT ERROR|ERROR:" docs/flesh-wall/godot-lab-export.log; then exit 1; fi
          cp godot/assets/fonts/OFL.txt godot/export/lab/FONT-LICENSE.txt
          cp godot/assets/fonts/FONT_INFO.json godot/export/lab/FONT-INFO.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-validation
          path: qa/native
      - uses: actions/upload-artifact@v4
        with:
          name: web-builds
          path: godot/export
      - name: Package full-release candidate only
        if: needs.plan.outputs.profile == 'full'
        run: |
          python3 tools/package_project.py
          python3 tools/package_chain_lab.py
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.profile == 'full'
        with:
          name: full-release-candidate-requires-browser-pass
          path: dist/*.zip
  browser:
    needs: [plan, validate-build]
    if: needs.plan.outputs.browsers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        script: ${{ fromJSON(needs.plan.outputs.browsers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-builds
          path: godot/export
      - run: python3 -m pip install playwright==1.62.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-1.62.0
      - run: python3 -m playwright install --with-deps chromium
      - name: Remove historical reports before generating current evidence
        run: find docs -type f \( -name '*.png' -o -name '*.json' -o -name '*.log' \) -delete
      - run: python3 tools/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.script }}
          path: |
            docs/**/*.png
            docs/**/*.json
            docs/**/*.log
