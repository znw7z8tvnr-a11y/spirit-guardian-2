 case 'r26':if(active)for(let i=0;i<2;i++){let a=t*15+i*PI,px=x+Math.cos(a)*50,py=y+Math.sin(a)*50;g.save();g.translate(px,py);g.rotate(a);g.fillStyle=col;g.beginPath();g.moveTo(0,-20);g.lineTo(15,0);g.lineTo(0,20);g.lineTo(-15,0);g.fill();g.restore()}break;

 case 'r28':if(active)for(let i=0;i<4;i++){let px=x+(i-1.5)*20,py=y+Math.sin(t*10+i)*15;rect(px-5,py-15,10,30,col);disc(px,py-20,8,'#fff')}break;
 case 'r29':if(active)for(let i=0;i<3;i++){let r=40+i*30;g.strokeStyle=col;g.lineWidth=2;g.beginPath();g.arc(x,y,r,t*3,t*3+PI);g.stroke()}break;
 case 'r30':if(active)for(let i=0;i<5;i++){let v=(t*.9+i/5)%1,ry=100*(1-v),rx=30+v*60;g.save();g.translate(x,y-ry);g.scale(1,.3);g.strokeStyle=col;g.lineWidth=6;g.beginPath();g.ellipse(0,0,rx,rx,0,0,TAU*.85);g.stroke();g.restore()}break;
 case 'r31':if(active)for(let i=0;i<6;i++){let v=smooth(.15+i*.06,.6+i*.06,t);if(v<=0||v>=1)continue;let px=x+(i-2.5)*40+(1-v)*100,py=y-250*(1-v);disc(px,py,10,col)}break;
 case 'r32':if(active)for(let i=0;i<5;i++){g.strokeStyle=col;g.lineWidth=3;g.beginPath();g.moveTo(sx+100,sy);g.lineTo(x+(i-2)*40,y-80);g.stroke()}break;
 case 'r33':if(t>.2&&t<.9){let v=smooth(.2,.8,t),px=sx+(x-sx)*v,py=sy+(y-sy)*v;g.save();g.translate(px,py);g.rotate(-PI/4);rect(-40,-5,80,10,col);g.restore();disc(px,py,20,'#fff')}break;
 case 'r34':if(active)for(let i=0;i<4;i++){let a=t*8+i*TAU/4;disc(x+Math.cos(a)*60,y+Math.sin(a)*40,8,col)}break;
 case 'r35':if(active)for(let i=0;i<5;i++){let a=i*TAU/5+t,px=x+Math.cos(a)*50,py=y+Math.sin(a)*50;disc(px,py,5,'#fff');line([[px,py],[x,y]],col,1)}break;
 case 'r36':if(active){g.strokeStyle=col;g.lineWidth=15;g.beginPath();g.moveTo(sx,sy);g.bezierCurveTo(sx+200,sy-100,x-200,y-100,x,y);g.stroke();disc(x,y,25,'#fff')}break;
 case 'r37':if(active){let r=150*smooth(.2,.9,t);disc(x,y,r,'#fff3a822');g.strokeStyle=col;g.lineWidth=8;g.beginPath();g.arc(x,y,r,0,TAU);g.stroke()}break;
 case 'r38':if(t>.3&&t<1.1){let r=100*(1-smooth(.3,1,t));disc(x,y,r,col);for(let i=0;i<12;i++){let a=i*TAU/12+t*5;disc(x+Math.cos(a)*r*1.5,y+Math.sin(a)*r*1.5,5,'#fff')}}break;
 case 'r39':if(active)for(let i=0;i<8;i++){let a=t*10+i*TAU/8,rr=40+Math.sin(t*15+i)*20;disc(x+Math.cos(a)*rr,y+Math.sin(a)*rr,6,col)}break;
 case 'r40':if(active){let r=90*smooth(.2,.8,t);for(let i=0;i<8;i++){let a=i*TAU/8+t*2;disc(x+Math.cos(a)*r,y+Math.sin(a)*r*.6,10,col);disc(x+Math.cos(a)*r*.5,y+Math.sin(a)*r*.3,5,'#fff')}}break;
 case 'r41':if(active){g.globalAlpha=.5;disc(sx+100,sy+50,60,col);g.globalAlpha=1;rect(sx+80,sy+20,80,100,'#85ebff44');for(let i=0;i<3;i++)rect(sx+90+i*20,sy+30+i*20,20,60,'#fff')}break;
 case 'r42':if(t>.2&&t<1)for(let i=0;i<4;i++){let v=smooth(.2+i*.05,.7+i*.05,t);if(v<=0||v>=1)continue;let px=x+(i-1.5)*40,py=y-300*(1-v);g.save();g.translate(px,py);g.rotate(PI/4);rect(-10,-30,20,60,col);g.restore()}break;
 case 'r43':if(active)for(let i=0;i<5;i++){let px=x+(i-2)*25,h=100*smooth(.2+i*.05,.7+i*.05,t);g.strokeStyle=col;g.lineWidth=8;g.beginPath();g.moveTo(px,y+20);g.bezierCurveTo(px-20,y+20-h/2,px+20,y+20-h,px,y+20-h);g.stroke()}break;
 case 'r44':if(active){let r=120*smooth(.2,.7,t);disc(x,y,r,'#000000bb');disc(x,y,r*.5,col);disc(x,y,r*.2,'#fff')}break;
 case 'r45':if(active){let r=100*smooth(.2,.9,t);for(let i=0;i<10;i++){let a=i*TAU/10+t,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;disc(px,py,15,col);line([[px,py],[x,y]],col,3)}}break;
 case 'r46':if(active)for(let i=0;i<4;i++){let px=x+(i-1.5)*40,py=y+Math.sin(t*10+i)*20;g.save();g.translate(px,py);g.rotate(PI/4);rect(-10,-10,20,20,col);g.restore()}break;
 case 'r47':if(active)for(let i=0;i<4;i++){let a=t*5+i*TAU/4,r=60;disc(x+Math.cos(a)*r,y+Math.sin(a)*r,15,'#78e8ff44');disc(x+Math.cos(a)*r,y+Math.sin(a)*r,5,'#fff')}break;
 case 'r48':if(active)for(let i=0;i<6;i++){let a=t*8+i*TAU/6;line([[x,y],[x+Math.cos(a)*80,y+Math.sin(a)*80]],col,4);disc(x+Math.cos(a)*80,y+Math.sin(a)*80,4,'#fff')}break;
 case 'r49':if(active){let r=80*smooth(.2,.8,t);g.strokeStyle=col;g.lineWidth=10;g.beginPath();g.arc(x,y,r,t*5,t*5+PI*1.5);g.stroke();disc(x,y,20,col)}break;
 case 'r50':if(t>.3&&t<1.2){let r=180*smooth(.3,.8,t);disc(x,y,r,'#ff6b2a33');for(let i=0;i<20;i++){let a=i*TAU/20+t*4;disc(x+Math.cos(a)*r*.8,y+Math.sin(a)*r*.6,10,'#fff')} // Ring is spawned exactly once on impact, not per render frame.
 }break;
 }
 g.globalAlpha=1;g.shadowBlur=0;
}
function effects(){for(let r of rings){g.globalAlpha=r.life/r.max;g.strokeStyle=r.c;g.lineWidth=6*(r.life/r.max);g.beginPath();g.arc(r.x,r.y,r.r,0,TAU);g.stroke()}g.globalAlpha=1;g.shadowBlur=10;for(let p of particles){g.globalAlpha=clamp(p.life/p.max);g.shadowColor=p.c;rect(p.x,p.y,p.size,p.size,p.c)}g.shadowBlur=0;for(let n of numbers){g.globalAlpha=clamp(n.life*2);g.font=n.isCrit?'bold 28px monospace':'bold 22px monospace';g.textAlign='center';g.lineWidth=n.isCrit?5:3;g.strokeStyle='#10131a';g.strokeText(n.value,n.x,n.y);g.fillStyle=n.isCrit?'#ffea00':n.col;g.fillText(n.value,n.x,n.y);if(n.isCrit){g.font='bold 12px monospace';g.fillStyle='#fff';g.fillText('CRITICAL',n.x,n.y-25)}}g.globalAlpha=1;g.textAlign='left'}
function advanceCast(dt){
 if(time<.2)tower.scale=1+time*2;else if(time<.26)tower.recoil=6;
 if(!didHit&&time>=.53){
  didHit=true;
  const multi=['r01','r02','r03','r04','r05','r09','r12','r14','r15','r17','r19','r22','r24','r25','r26','r29','r30','r31','r32','r34','r36','r38','r39','r40','r41','r42','r44','r46','r48','r50'].includes(current);
  const live=targets.filter(e=>e.dead<=0&&e.respawn<=0);
  const tar=live[0]||targets[0],col=byKey[current][3];
  (multi?live:[tar]).forEach((e,i)=>{let crit=Math.random()>.7;queuedHits.push({token:castToken,target:e,color:col,amount:crit?45:25,crit,delay:i*.08})});
  if(current==='r50')addRing(tar.x,tar.y-10,180,'#fff',.8);
 }
}
function render(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){if(hitStop>0){dt*=.05;hitStop--}else time+=dt;advanceCast(dt);update(dt);if(auto&&time>=1.65){let i=skills.findIndex(s=>s[0]===current);choose(skills[(i+1)%skills.length][0])}}g.save();let s=trauma*trauma,shakeX=(Math.random()*2-1)*12*s,shakeY=(Math.random()*2-1)*12*s;g.translate(W/2,H/2);g.scale(zoom,zoom);g.translate(-W/2+shakeX,-H/2+shakeY);background();drawTower();drawTargets();spell(current,time);effects();g.restore();if(skillAlpha>0){g.globalAlpha=skillAlpha;g.textAlign='center';g.font='bold 28px monospace';g.strokeStyle='#0a1322';g.lineWidth=8;g.strokeText(byKey[current][2],W/2,70);g.fillStyle=byKey[current][3];g.fillText(byKey[current][2],W/2,70);g.globalAlpha=1;g.textAlign='left'}requestAnimationFrame(render)}
const catalog=document.getElementById('catalog'),title=document.getElementById('skillTitle'),caption=document.getElementById('caption'),status=document.getElementById('status');for(const s of skills){let b=document.createElement('button');b.innerHTML=`<span>${s[1]} ${s[2]}</span><span>${s[0].toUpperCase()}</span>`;b.dataset.key=s[0];b.onclick=()=>choose(s[0]);catalog.appendChild(b)}function choose(k){if(!byKey[k])return;current=k;time=0;didHit=false;castToken++;queuedHits=[];hitStop=0;trauma=.25;zoom=1;skillAlpha=1;particles=[];rings=[];numbers=[];tower.scale=1;tower.recoil=0;targets.forEach(e=>{e.hp=e.maxHp;e.dead=0;e.respawn=0;e.hit=0;e.flash=0;e.x=e.baseX;e.y=e.baseY});title.textContent=byKey[k][1]+' '+byKey[k][2];title.style.color=byKey[k][3];caption.textContent='元素：'+byKey[k][4]+'｜V29 像素共鳴圖鑑演出';status.textContent='V29 · '+(paused?'已暫停':'播放中')+' · '+skills.length+' 種法術';for(let b of catalog.children)b.classList.toggle('active',b.dataset.key===k)}document.getElementById('replay').onclick=()=>choose(current);document.getElementById('auto').onclick=e=>{auto=!auto;e.currentTarget.textContent=auto?'■ 停止輪播':'▶ 自動輪播';e.currentTarget.classList.toggle('active',auto);if(auto&&time>1.4)time=1.4};document.getElementById('pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶ 繼續':'Ⅱ 暫停';status.textContent='V29 · '+(paused?'已暫停':'播放中')+' · '+skills.length+' 種法術'};choose('r01');requestAnimationFrame(render);
</script></body></html>
