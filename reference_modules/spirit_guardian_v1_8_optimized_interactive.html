:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#050916;color:#eaf5ff;font:15px system-ui,-apple-system,"Noto Sans TC",sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom))}main{max-width:1280px;margin:auto}h1{font-size:clamp(18px,3vw,27px);margin:5px 0 10px}.frame{position:relative;width:100%;aspect-ratio:16/9;border:1px solid #344b70;border-radius:14px;overflow:hidden;background:#081120;box-shadow:0 14px 40px #0008}canvas{display:block;width:100%;height:100%;touch-action:manipulation}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{font:inherit;color:#e6f5ff;background:#15273d;border:1px solid #50749a;border-radius:9px;padding:9px 12px;touch-action:manipulation;cursor:pointer}button.active{border-color:#7ce2fa;background:#1a4760}button:focus-visible,input:focus-visible{outline:3px solid #f7d58d}.note{color:#aebfd2;line-height:1.55;font-size:13px}.dev{border:1px solid #354b66;border-radius:12px;background:#0c1729;padding:10px 14px;margin:10px 0}.dev summary{cursor:pointer;font-weight:650}.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:10px}.settings label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#c4d5e9}.settings input{width:100%;accent-color:#7ed8f3}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}#status{min-height:18px;color:#a9c7df;font-size:13px;margin:6px 0}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main><h1>靈境守衛｜V1.8 沉浸式互動展示</h1><div class="frame"><canvas id="scene" role="img" aria-label="原版靈境守衛水晶聖塔與可互動的戰鬥視覺展示"></canvas></div><div class="controls"><button id="mode">切換手動模式</button><button id="attack">普通攻擊</button><button id="damage">城牆受擊</button><button id="elite">精英擊破</button><button id="boss">BOSS 來襲</button><button id="shield" aria-pressed="false">護盾：關</button><button id="sound" aria-pressed="false">音效：關</button><button id="reset">重置</button></div><div id="status" role="status" aria-live="polite">自動演示中。點擊任何戰鬥按鈕即切換手動模式。</div><div id="urgent" class="sr-only" aria-live="assertive"></div><details class="dev"><summary>開發者視覺調整</summary><div class="settings"><label>背景亮度 <output id="brightnessValue">70%</output><input id="brightness" type="range" min="45" max="100" value="70"></label><label>暗角強度 <output id="vignetteValue">25%</output><input id="vignette" type="range" min="0" max="60" value="25"></label><label>水晶能量 <output id="glowValue">45%</output><input id="glow" type="range" min="0" max="100" value="45"></label><label>靈氣粒子 <output id="particlesValue">18</output><input id="particles" type="range" min="0" max="30" value="18"></label></div></details><p class="note">使用原版遊戲內嵌場景素材。點擊中央守護塔或聚焦畫布後按 Enter 可模擬攻擊；普通攻擊不會扣除城牆血量。此為獨立視覺與互動原型，尚未接入完整遊戲的敵人 AI、技能與波次系統。音效預設關閉；部分 iPad 不支援網頁震動。</p></main><script>

if(runtime.toast&&state.clock<runtime.toastUntil&&runtime.fx.every(f=>f.kind!=='boss'||state.clock-f.t>1.3)){ctx.save();ctx.globalAlpha=Math.min(.9,(runtime.toastUntil-state.clock)*2);label(runtime.toast,640,680,15,'#e1e9f1',600,'center');ctx.restore()}
}finally{ctx.restore()}}
function frame(now){if(runtime.last===null)runtime.last=now;const dt=runtime.hidden?0:Math.min(.05,Math.max(0,(now-runtime.last)/1000));runtime.last=now;if(!runtime.hidden){state.clock+=dt;runtime.damageFlash=Math.max(0,runtime.damageFlash-dt*3.5);runtime.shieldAlpha+=(Number(state.shield)-runtime.shieldAlpha)*Math.min(1,dt*6);runtime.fx=runtime.fx.filter(f=>state.clock-f.t<1.65);runtime.fxParticles=runtime.fxParticles.filter(p=>state.clock-p.t<p.life);runtime.shieldPulse=Math.max(0,runtime.shieldPulse-dt*2);if(runtime.urgentClear&&state.clock>=runtime.urgentClear){$('urgent').textContent='';runtime.urgentClear=0}if(state.mode==='auto'&&state.clock>=runtime.nextAuto){const roll=Math.random();if(roll<.56)attack(true);else if(roll<.77)elite(true);else if(roll<.94)damage(true);else boss(true);runtime.autoIndex++;runtime.nextAuto=state.clock+1.8+Math.random()*2.3}draw()}runtime.raf=requestAnimationFrame(frame)}
$('mode').onclick=()=>{state.mode=state.mode==='auto'?'manual':'auto';runtime.nextAuto=state.clock+2;sync();announce(state.mode==='auto'?'已恢復自動演示':'已切換手動測試')};$('attack').onclick=()=>attack();$('damage').onclick=()=>damage();$('elite').onclick=()=>elite();$('boss').onclick=()=>boss();$('shield').onclick=()=>{manual();state.shield=!state.shield;if(state.shield)runtime.shieldPulse=1;sync();announce('護盾'+(state.shield?'啟動':'解除'))};$('sound').onclick=()=>{manual();state.sound=!state.sound;sync();announce('音效'+(state.sound?'開啟':'關閉'));if(state.sound){initAudio();tone('elite')}};$('reset').onclick=reset;
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;if(((x-640)/115)**2+((y-360)/165)**2<=1)attack()});
for(const id of ['brightness','vignette','glow','particles']){$(id).addEventListener('input',e=>{const limits={brightness:[45,100],vignette:[0,60],glow:[0,100],particles:[0,30]};state[id]=Math.max(limits[id][0],Math.min(limits[id][1],Number(e.target.value)||0));$(id+'Value').textContent=state[id]+(id==='particles'?'':'%')})}
canvas.tabIndex=0;canvas.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();attack()}});document.addEventListener('visibilitychange',()=>{runtime.hidden=document.hidden;runtime.last=null});bg.onload=draw;sync();runtime.raf=requestAnimationFrame(frame);
</script></body></html>
