<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090d1d"><title>靈境守衛・Reborn Web</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c19;color:#f7e7bf;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}#hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;text-shadow:0 2px 6px #000;font-size:13px}#hud b{font-size:17px;color:#ffe4a3}.panel{background:#090e21d9;border:1px solid #9c7d4777;border-radius:12px;padding:8px 12px;box-shadow:0 0 24px #0009}.bar{width:160px;max-width:30vw;height:7px;border-radius:8px;background:#342738;overflow:hidden;margin-top:5px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#e5536b,#ffc07d)}#controls{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:10px}button{font:inherit;color:#fff1d0;border:1px solid #b68a4f;border-radius:12px;background:linear-gradient(#3d335c,#181c38);padding:12px 17px;cursor:pointer;box-shadow:0 4px 18px #0009;touch-action:manipulation}button:active{transform:scale(.96)}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#030610c9;backdrop-filter:blur(5px);padding:18px}#overlay.hidden{display:none}.modal{width:min(680px,95vw);max-height:90vh;overflow:auto;background:linear-gradient(155deg,#24203c,#0a1026 70%);border:1px solid #d6a45b88;border-radius:20px;padding:25px;box-shadow:0 0 90px #6138a84a;text-align:center}h1{margin:0 0 9px;color:#ffe3a2;letter-spacing:3px;font-size:clamp(25px,5vw,42px)}h2{color:#ffdf9d}p{line-height:1.6;color:#c8cce3}.cards{display:grid;grid-template-colu (()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),modal=document.getElementById('modal');let W=1280,H=720,DPR=1,scale=1,ox=0,oy=0;const C={x:640,y:360};function resize(){DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*DPR);canvas.height=Math.round(innerHeight*DPR);W=canvas.width;H=canvas.height;scale=Math.min(W/1280,H/720);ox=(W-1280*scale)/2;oy=(H-720*scale)/2}addEventListener('resize',resize);resize();let state='menu',t=0,last=0,wave=1,waveClock=0,spawnClock=0,spawned=0,kills=0,health=100,xp=0,level=1,needed=8,pulseCD=0,shake=0,combo=0,comboTime=0;let enemies=[],shots=[],particles=[],texts=[],rings=[];let skills={fire:1,ice:0,lightning:0,poison:0,split:0,orbit:0,rate:0,pierce:0};const COLORS={fire:'#ff9a50',ice:'#8be7ff',lightning:'#c9a1ff',poison:'#92ed90'};let uid=0,fireImpactCount=0,lightningLinks=[];const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function reset(){state='play';t=0;wave=1;waveClock=0;spawnClock=0;spawned=0;kills=0;health=100;xp=0;level=1;needed=8;pulseCD=0;shake=0;combo=0;comboTime=0;enemies=[];shots=[];particles=[];texts=[];rings=[];lightningLinks=[];fireImpactCount=0;uid=0;fireTimer=0;iceTimer=0;boltTimer=0;orbitTimer=0;skills={fire:1,ice:0,lightning:0,poison:0,split:0,orbit:0,rate:0,pierce:0};overlay.classList.add('hidden')}document.getElementById('start').onclick=reset;function burst(x,y,color,n=10,speed=95){for(let i=0;i<n&&particles.length<500;i++){const a=rand(0,Math.PI*2),s=rand(speed*.3,speed);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.65),max:.65,r:rand(1,4),color})}}function floatText(x,y,value,color){texts.push({x,y,value,life:.8,color});if(texts.length>50)texts.shift()}function spawn(){let a=rand(0,Math.PI*2),r=rand(470,610),boss=wave%4===0&&spawned===Math.floor((14+wave*5)/2);let type=boss?'boss':Math.random()<.2?'swift':Math.random()<.23?'armored':'grunt';let hp=type==='boss'?300+wave*105:type==='armored'?60+wave*11:type==='swift'?19+wave*5:30+wave*6;enemies.push({id:++uid,x:C.x+Math.cos(a)*r,y:C.y+Math.sin(a)*r,type,hp,max:hp,r:type==='boss'?34:type==='armored'?18:type==='swift'?11:14,speed:type==='boss'?24:type==='swift'?68+wave*2:type==='armored'?29+wave:40+wave*1.3,slow:0,poison:0,hit:0,phase:rand(0,7)});spawned++}function nearest(x,y,range=650,exclude=[]){let best=null,d=range*range;for(const e of enemies){if(e.hp<=0||exclude.includes(e.id))continue;const v=(e.x-x)**2+(e.y-y)**2;if(v<d){d=v;best=e}}return best}function shoot(kind,target,angleOffset=0){if(!target)return;let a=Math.atan2(target.y-C.y,target.x-C.x)+angleOffset,speed=kind==='ice'?310:kind==='fire'?390:450;shots.push({x:C.x,y:C.y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,kind,life:2.1,r:kind==='fire'?8:6,damage:kind==='fire'?15+skills.fire*7:kind==='ice'?10+skills.ice*4:12+skills.lightning*5,hit:[],pierce:skills.pierce,trail:[]});burst(C.x+Math.cos(a)*29,C.y+Math.sin(a)*29,COLORS[kind],3,30)}function damage(e,amount,kind){if(e.hp<=0)return;e.hp-=amount;e.hit=.13;floatText(e.x+rand(-8,8),e.y-12,Math.ceil(amount),COLORS[kind]||'#fff');burst(e.x,e.y,COLORS[kind]||'#fff',3,50);if(kind==='ice')e.slow=Math.max(e.slow,1.9+skills.ice*.25);if(kind==='poison')e.poison=Math.max(e.poison,2.5);if(e.hp<=0){kills++;xp+=e.type==='boss'?12:e.type==='armored'?2:1;combo++;comboTime=2.5;burst(e.x,e.y,e.type==='boss'?'#eab6ff':'#ffb579',e.type==='boss'?65:13,155);rings.push({x:e.x,y:e.y,r:3,max:e.type==='boss'?125:34,life:.6,color:e.type==='boss'?'#d2a3ff':'#ffb56b'});if(xp>=needed&&state==='play')choose();}}function choose(){state='choice';let pool=[['fire','🔥','炎爆進化','火球傷害提升；Lv2 起每三次命中引發大範圍炎爆'],['ice','❄','寒霜領域','新增冰晶減速；Lv2 起命中時碎裂並冰封周圍敵人'],['lightning','⚡','雷霆鏈結','新增閃電彈，連鎖跳躍並顯示分叉電弧'],['poison','☣','腐蝕毒霧','攻擊附加持續毒傷'],['split','✧','星火分裂','火球左右各增加一條彈道，升級後形成扇形彈幕'],['orbit','◈','環繞魔晶','生成繞塔旋轉的防禦魔晶'],['rate','✦','奧術急速','提升全系法術發射頻率'],['pierce','➶','貫穿符文','彈丸可貫穿更多敵人']];pool.sort(()=>Math.random()-.5);let picks=pool.slice(0,3);if(level===1){picks=[pool.find(p=>p[0]==='split'),pool.find(p=>p[0]==='ice'),pool.find(p=>p[0]==='lightning')]}else if(level===2){picks=[pool.find(p=>p[0]==='orbit'),pool.find(p=>p[0]==='fire'),pool.find(p=>p[0]==='rate')]}else if(level===3){picks=[pool.find(p=>p[0]==='lightning'),pool.find(p=>p[0]==='split'),pool.find(p=>p[0]==='ice')]}overlay.classList.remove('hidden');modal.innerHTML='<h2>✦ 靈能覺醒 · 等級 '+(level+1)+'</h2><p>選擇一項進化，直接改變你的戰鬥方式</p><div class="cards">'+picks.map((p,i)=>'<button class="choice" data-choice="'+i+'"><span class="sigil">'+p[1]+'</span><strong>'+p[2]+'</strong><small>'+p[3]+'<br>目前 Lv '+(skills[p[0]]||0)+'</small></button>').join('')+'</div>';modal.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let key=picks[Number(b.dataset.choice)][0];skills[key]++;level++;xp-=needed;needed=Math.round(needed*1.27+3);state='play';overlay.classList.add('hidden');burst(C.x,C.y,'#ffe9a1',70,200);rings.push({x:C.x,y:C.y,r:10,max:230,life:.9,color:'#ffe6a0'});if(xp>=needed)choose()})}function end(){state='over';overlay.classList.remove('hidden');modal.innerHTML='<h1>守衛終章</h1><h2>抵達第 '+wave+' 波</h2><p>擊殺 '+kills+' 隻敵人 · 守護塔等級 '+level+'<br>每次重玩都有不同法術進化組合。</p><button id="again">✦ 再守衛一次</button>';document.getElementById('again').onclick=reset}let fireTimer=0,iceTimer=0,boltTimer=0,orbitTimer=0;function update(dt){if(state!=='play')return;t+=dt;waveClock+=dt;pulseCD=Math.max(0,pulseCD-dt);shake=Math.max(0,shake-dt*15);comboTime=Math.max(0,comboTime-dt);const limit=14+wave*5;if(spawned<limit){spawnClock-=dt;if(spawnClock<=0){spawn();spawnClock=Math.max(.15,.9-wave*.05)}}else if(enemies.length===0){wave++;spawned=0;spawnClock=2;waveClock=0;health=Math.min(100,health+8);rings.push({x:C.x,y:C.y,r:40,max:310,life:1.3,color:'#f8d28e'});floatText(C.x,C.y-85,'第 '+wave+' 波','#ffe4a0')}fireTimer-=dt;iceTimer-=dt;boltTimer-=dt;orbitTimer-=dt;let target=nearest(C.x,C.y);let cadence=1+skills.rate*.19;if(fireTimer<=0&&target){shoot('fire',target);for(let i=1;i<=Math.min(3,skills.split);i++){shoot('fire',target,i*.15);shoot('fire',target,-i*.15)}fireTimer=.67/cadence}if(skills.ice&&iceTimer<=0&&target){shoot('ice',target);iceTimer=Math.max(.2,1.5-skills.ice*.15)/cadence}if(skills.lightning&&boltTimer<=0&&target){shoot('lightning',target);boltTimer=Math.max(.2,1.35-skills.lightning*.13)/cadence}if(skills.orbit&&orbitTimer<=0){for(let i=0;i<skills.orbit*2;i++){let a=t*2.5+i*Math.PI/skills.orbit,x=C.x+Math.cos(a)*105,y=C.y+Math.sin(a)*105;for(const e of enemies)if(e.hp>0&&Math.hypot(e.x-x,e.y-y)<e.r+12)damage(e,5+skills.orbit*2,'lightning')}orbitTimer=.12}for(const e of enemies){if(e.hp<=0)continue;let d=dist(e,C),v=e.speed*(e.slow>0?.43:1);if(d>36){e.x+=(C.x-e.x)/d*v*dt;e.y+=(C.y-e.y)/d*v*dt}else{health-=e.type==='boss'?32:e.type==='armored'?15:8;e.hp=0;shake=9;burst(C.x,C.y,'#ff5577',25,110);if(health<=0){health=0;end();break}}e.slow=Math.max(0,e.slow-dt);e.hit=Math.max(0,e.hit-dt);e.phase+=dt;if(e.poison>0){e.poison-=dt;e.hp-=dt*(4+skills.poison*3);if(e.hp<=0){e.hp=1;damage(e,2,'poison')}}}enemies=enemies.filter(e=>e.hp>0);for(const s of shots){s.life-=dt;if(s.life<=0)continue;s.trail.push({x:s.x,y:s.y});if(s.trail.length>7)s.trail.shift();s.x+=s.vx*dt;s.y+=s.vy*dt;for(const e of enemies){if(e.hp<=0||s.hit.includes(e.id)||Math.hypot(e.x-s.x,e.y-s.y)>e.r+s.r)continue;s.hit.push(e.id);damage(e,s.damage,s.kind);if(s.kind==='fire'){fireImpactCount++;if(skills.fire>=2&&fireImpactCount%3===0){rings.push({x:s.x,y:s.y,r:4,max:85+skills.fire*8,life:.52,color:'#ffbd71'});burst(s.x,s.y,'#ff9b51',30,180);for(const other of enemies)if(other.hp>0&&dist(other,s)<75+skills.fire*8)damage(other,s.damage*.8,'fire')}rings.push({x:s.x,y:s.y,r:3,max:26+skills.fire*6,life:.3,color:'#ff9252'});for(const other of enemies)if(other!==e&&other.hp>0&&dist(other,s)<24+skills.fire*6)damage(other,s.damage*.3,'fire')}if(s.kind==='ice'&&skills.ice>=2){rings.push({x:s.x,y:s.y,r:2,max:55+skills.ice*8,life:.46,color:'#a9efff'});burst(s.x,s.y,'#9deeff',15,110);for(const other of enemies)if(other!==e&&other.hp>0&&dist(other,s)<50+skills.ice*8){damage(other,s.damage*.55,'ice')}}if(s.kind==='lightning'){let from=e,used=[e.id];for(let i=0;i<Math.min(5,skills.lightning+1);i++){let next=nearest(from.x,from.y,120,used);if(!next)break;lightningLinks.push({x:from.x,y:from.y,xx:next.x,yy:next.y,life:.25,max:.25});damage(next,s.damage*.7,'lightning');used.push(next.id);from=next}}if(skills.poison&&Math.random()<.35)damage(e,skills.poison*2,'poison');if(s.hit.length>skills.pierce){s.life=0;break}}}shots=shots.filter(s=>s.life>0);for(const arc of lightningLinks)arc.life-=dt;lightningLinks=lightningLinks.filter(a=>a.life>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const r of rings){r.life-=dt;r.r+=(r.max-r.r)*Math.min(1,dt*6)}rings=rings.filter(r=>r.life>0);for(const q of texts){q.life-=dt;q.y-=dt*32}texts=texts.filter(q=>q.life>0);document.getElementById('stats').textContent='第 '+wave+' 波 · 擊殺 '+kills+' · Lv '+level;document.getElementById('hp').style.width=health+'%';document.getElementById('time').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');document.getElementById('build').textContent=['🔥'+skills.fire,'❄'+skills.ice,'⚡'+skills.lightning,'◈'+skills.orbit].join('  ');document.getElementById('xp').textContent='靈能 '+xp+' / '+needed;document.getElementById('pulse').textContent=pulseCD>0?'❄ 冷卻 '+Math.ceil(pulseCD)+'s':'❄ 冰霜脈衝'}function polygon(x,y,r,n,rot,color,stroke){ctx.beginPath();for(let i=0;i<n;i++){let a=rot+i*Math.PI*2/n;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}function line(x,y,xx,yy,color,width=2){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}function glow(x,y,r,color){let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');circle(x,y,r,g)}// Pre-render the entire arena once. Avoid redrawing thousands of stones every frame on iPad.
const arena=document.createElement('canvas');arena.width=1280;arena.height=720;
const ac=arena.getContext('2d');
function buildArena(){
 let seed=18427;const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
 const g=ac.createRadialGradient(640,360,55,640,360,850);
 g.addColorStop(0,'#292744');g.addColorStop(.48,'#161a30');g.addColorStop(1,'#070b16');ac.fillStyle=g;ac.fillRect(0,0,1280,720);
 // Hand-built tile field, uneven stone outlines and fissures.
 for(let y=-20;y<750;y+=48)for(let x=-20;x<1310;x+=48){
  const dx=x+(rnd()-.5)*8,dy=y+(rnd()-.5)*8;
  ac.fillStyle=rnd()>.5?'#38374b16':'#80718a0b';ac.fillRect(dx+2,dy+2,43,43);
  ac.strokeStyle=rnd()>.5?'#aa94ad1b':'#c6a47612';ac.lineWidth=1;
  ac.strokeRect(dx+2,dy+2,43,43);
  if(rnd()<.17){ac.beginPath();ac.moveTo(dx+4,dy+rand(5,28));ac.lineTo(dx+21,dy+18);ac.lineTo(dx+33,dy+36);ac.strokeStyle='#080d1f88';ac.stroke()}
 }
 for(let i=0;i<105;i++){let x=rnd()*1280,y=rnd()*720,r=2+rnd()*8;ac.fillStyle=rnd()>.5?'#bca0c218':'#d5b87e16';ac.beginPath();ac.ellipse(x,y,r,r*.4,rnd()*3,0,Math.PI*2);ac.fill()}
 // Altar rings and runic compass are part of the terrain, not HUD.
 ac.save();ac.translate(640,360);
 for(const radius of [86,100,146,213,290]){ac.beginPath();ac.arc(0,0,radius,0,Math.PI*2);ac.strokeStyle=radius<150?'#d3ae6c55':'#af8d9950';ac.lineWidth=radius===100?3:1.5;ac.stroke()}
 for(let i=0;i<24;i++){let a=i*Math.PI/12;ac.save();ac.rotate(a);ac.fillStyle=i%3===0?'#f3d6a55c':'#bca8d340';ac.beginPath();ac.moveTo(0,-207);ac.lineTo(-5,-221);ac.lineTo(0,-231);ac.lineTo(5,-221);ac.closePath();ac.fill();ac.restore()}
 for(let i=0;i<8;i++){let a=i*Math.PI/4;ac.save();ac.rotate(a);ac.strokeStyle='#e0b56c55';ac.strokeRect(-13,-137,26,26);ac.beginPath();ac.moveTo(0,-147);ac.lineTo(7,-137);ac.lineTo(0,-127);ac.lineTo(-7,-137);ac.closePath();ac.stroke();ac.restore()}
 ac.restore();
 const v=ac.createRadialGradient(640,360,250,640,360,790);v.addColorStop(0,'#00000000');v.addColorStop(1,'#000916cc');ac.fillStyle=v;ac.fillRect(0,0,1280,720);
}
buildArena();

 const drift=Math.sin(t*(.35+i%5*.07)+i*2.3)*8;

}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#080c18';ctx.fillRect(0,0,W,H);ctx.setTransform(scale,0,0,scale,ox+rand(-shake,shake)*scale,oy+rand(-shake,shake)*scale);ctx.drawImage(arena,0,0);drawAtmosphere();ctx.save();ctx.translate(C.x,C.y);ctx.rotate(t*.08);for(let i=0;i<12;i++){let a=i*Math.PI/6;polygon(Math.cos(a)*210,Math.sin(a)*210,8,4,a,'#806a8c77','#e7bb7477')}ctx.restore();for(let i=0;i<48;i++){let a=i*Math.PI/24+t*.07;let r=110+Math.sin(i*7)*5;circle(C.x+Math.cos(a)*r,C.y+Math.sin(a)*r,2,'#ffce7677')}for(const r of rings){ctx.globalAlpha=Math.min(1,r.life*2);ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.strokeStyle=r.color;ctx.lineWidth=3;ctx.stroke();if(r.line){line(r.x,r.y,r.line[0],r.line[1],r.color,3)}}ctx.globalAlpha=1;for(const arc of lightningLinks){ctx.save();ctx.globalAlpha=arc.life/arc.max;ctx.strokeStyle='#bda0ff';ctx.lineWidth=7;ctx.shadowColor='#bca5ff';ctx.shadowBlur=18;ctx.beginPath();ctx.moveTo(arc.x,arc.y);for(let j=1;j<7;j++){let k=j/7;ctx.lineTo(arc.x+(arc.xx-arc.x)*k+Math.sin(j*18+t*33)*9,arc.y+(arc.yy-arc.y)*k+Math.cos(j*21+t*29)*9)}ctx.lineTo(arc.xx,arc.yy);ctx.stroke();ctx.strokeStyle='#f9edff';ctx.lineWidth=2;ctx.stroke();ctx.restore()}for(const e of enemies){if(e.type==='boss'){ctx.save();ctx.strokeStyle='#ff6987aa';ctx.lineWidth=2.5;ctx.setLineDash([14,10]);ctx.lineDashOffset=-t*22;ctx.beginPath();ctx.arc(e.x,e.y,59+Math.sin(t*3)*4,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore();}glow(e.x,e.y,e.r*2.5,e.type==='boss'?'#b856ad44':'#a4425540');ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.atan2(C.y-e.y,C.x-e.x));if(e.type==='boss'){polygon(0,0,39,8,t*.35,'#482744','#e8a9db');polygon(0,0,29,6,0,'#9a5168','#ffe1ab');for(let i=-1;i<=1;i++)polygon(16,i*18,11,3,0,'#e4bc80','#fff0b7');glow(0,0,25,'#fb68c999');circle(0,0,9,'#ffd9f5')}else if(e.type==='armored'){polygon(0,0,20,6,0,'#394763','#b2d9ed');polygon(0,0,12,4,Math.PI/4,'#7283a1','#e0f3ff');circle(4,0,4,'#fff4c9')}else if(e.type==='swift'){polygon(0,0,16,3,0,'#913d60','#ffa4b0');circle(2,0,4,'#ffd5a8')}else{polygon(0,0,16,6,t*.2,'#713d59','#d98a92');circle(5,-4,3,'#ffdfab');circle(5,4,3,'#ffdfab')}if(e.hit>0){ctx.globalAlpha=e.hit*4;circle(0,0,e.r,'#fff');ctx.globalAlpha=1}ctx.restore();if(e.type==='boss'||e.type==='armored'){ctx.fillStyle='#241d34';ctx.fillRect(e.x-30,e.y-e.r-14,60,5);ctx.fillStyle=e.type==='boss'?'#ff91c8':'#8cdefa';ctx.fillRect(e.x-30,e.y-e.r-14,60*Math.max(0,e.hp/e.max),5)}}for(const s of shots){let col=COLORS[s.kind];for(let i=0;i<s.trail.length;i++){let p=s.trail[i];ctx.globalAlpha=(i+1)/s.trail.length*.5;circle(p.x,p.y,2+i*.65,col)}ctx.globalAlpha=1;glow(s.x,s.y,26,col+'66');if(s.kind==='fire'){circle(s.x,s.y,8,'#ff6a35');circle(s.x,s.y,4,'#fff0ae')}else if(s.kind==='ice'){polygon(s.x,s.y,11,4,Math.PI/4,'#a3edff','#fff')}else{polygon(s.x,s.y,10,6,t*10,'#d8a6ff','#fff')}}for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);circle(p.x,p.y,p.r,p.color)}ctx.globalAlpha=1;ctx.save();ctx.translate(C.x,C.y);glow(0,0,120,'#8263ff55');ctx.rotate(t*.15);polygon(0,0,57,8,Math.PI/8,'#343c64','#f2cb86');polygon(0,0,48,8,0,'#17263d','#9ac8e8');for(let i=0;i<8;i++){let a=i*Math.PI/4;polygon(Math.cos(a)*44,Math.sin(a)*44,12,4,a,'#7c6d78','#f9d99c')}ctx.rotate(-t*.37);polygon(0,0,33,6,Math.PI/6,'#66529b','#dfc4ff');polygon(0,-5,23,4,Math.PI/4,'#8ad9ff','#ffffff');glow(0,0,38,'#93e4ff88');circle(0,0,9,'#e9faff');ctx.restore();if(skills.orbit)for(let i=0;i<skills.orbit*2;i++){let a=t*2.5+i*Math.PI/skills.orbit,x=C.x+Math.cos(a)*105,y=C.y+Math.sin(a)*105;glow(x,y,28,'#b68fff66');polygon(x,y,11,4,a,'#8c9cfe','#fff1d4')}for(const q of texts){ctx.globalAlpha=Math.min(1,q.life*2);ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillStyle='#100e1b';ctx.fillText(q.value,q.x+1,q.y+2);ctx.fillStyle=q.color;ctx.fillText(q.value,q.x,q.y)}ctx.globalAlpha=1;if(comboTime>0&&combo>3){ctx.font='bold 23px system-ui';ctx.textAlign='center';ctx.fillStyle='#ffe2a0';ctx.fillText('✦ '+combo+' 連斬',640,120)}if(state==='pause'){ctx.fillStyle='#05071399';ctx.fillRect(0,0,1280,720);ctx.font='bold 40px system-ui';ctx.textAlign='center';ctx.fillStyle='#ffe6ac';ctx.fillText('已暫停',640,320)}}function pulse(){if(state!=='play'||pulseCD>0)return;pulseCD=16;rings.push({x:C.x,y:C.y,r:25,max:520,life:1,color:'#9beaff'});for(const e of enemies)if(e.hp>0){e.slow=4;damage(e,12+skills.ice*4,'ice')}burst(C.x,C.y,'#b7efff',70,220)}document.getElementById('pulse').onclick=pulse;document.getElementById('pause').onclick=()=>{if(state==='play'){state='pause';document.getElementById('pause').textContent='▶ 繼續'}else if(state==='pause'){state='play';document.getElementById('pause').textContent='Ⅱ 暫停'}};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pulse()}if(e.code==='Escape')document.getElementById('pause').click()});function frame(now){let dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
