 fire:['🔥','爆裂火球','#ff9554',24],ice:['❄','寒冰長槍','#86eaff',21],lightning:['⚡','連鎖雷電','#e3c2ff',20],poison:['☣','毒霧','#a2ff9a',17],meteor:['☄','流星雨','#ffbf73',44],arcane:['✦','奧術飛彈','#e8d7ff',18],sword:['⚔','迴旋月刃','#ffdb91',26],pierce:['➶','穿透射線','#8ce9f8',24],earth:['⛰','土刺','#d8b589',29],wind:['🌪','颶風','#a7eddf',17],beam:['🔆','聚焦光束','#ffe6a0',30],orbit:['🪐','旋轉法球','#bd9dff',22],lava:['🌋','熔岩裂隙','#ff8c66',25],gravity:['🌀','引力漩渦','#9f9cff',20],summon:['👻','幽靈守衛','#b4f5f1',22],thorn:['🌿','荊棘護城','#b7ee85',20],spark:['✨','火花術','#ffd189',13],storm:['🌩','雷電風暴','#dfc8ff',35],blizzard:['🌨','暴風雪','#b0eaff',27],nova:['💠','冰霜新星','#a2f4ff',28],swamp:['🧪','毒沼','#a8ef92',22],skeleton:['💀','骷髏召喚','#d9d1bd',23]
};

 hit:['◈','命中觸發','命中後機率觸發：Lv1 30%／Lv2 45%／Lv3 60%'],chance:['✧','機率觸發','觸發率：Lv1 25%／Lv2 45%／Lv3 65%'],kill:['☠','擊殺觸發','擊殺時觸發：Lv1 40%／Lv2 70%／Lv3 100%'],split:['⟡','法術增幅','後續技能威力：+10%／+20%／+35%'],freeze:['❅','冰凍觸發','凍結或緩速時觸發：40%／65%／90%'],burn:['♨','灼燒觸發','火焰命中時觸發：40%／65%／90%'],echo:['↻','迴響寶石','後續技能再施放機率：20%／35%／50%'],crit:['✶','暴擊條件','暴擊連鎖機率：20%／35%／50%'],lowhp:['♡','殘血追擊','生命低於 25%／40%／55% 時觸發'],rapid:['➤','迅捷寶石','後續連鎖傷害 +10%／20%／35%'],delay:['⏱','時序寶石','觸發間隔：3／2／1 秒'],blast:['💥','爆破攻擊','前段法術傷害 +15%／30%／50%；不分流'],bolt:['⚡','雷擊攻擊','前段法術傷害 +12%／25%／45%；不分流'],venom:['☣','毒蝕攻擊','前段法術傷害 +10%／22%／40%；不分流'],frostatk:['❄','寒霜攻擊','前段法術傷害 +10%／20%／35%；不分流'],critical:['🎯','致命攻擊','前段法術傷害 +20%／40%／70%；不分流'],piercing:['➶','穿刺攻擊','前段法術傷害 +12%／25%／45%；不分流'],range:['◎','廣域攻擊','前段法術傷害 +10%／20%／35%；不分流'],multi:['✺','多重攻擊','前段法術傷害 +15%／30%／50%；不分流']
};
const ATTACK_GEMS=new Set(['blast','bolt','venom','frostatk','critical','piercing','range','multi']);
const maxChildren=g=>!g?0:ATTACK_GEMS.has(g.key)?1:(g.quality===3?2:1);
const quality=g=>Math.max(1,Math.min(3,g?.quality||1));
const bonus={blast:[.15,.30,.50],bolt:[.12,.25,.45],venom:[.10,.22,.40],frostatk:[.10,.20,.35],critical:[.20,.40,.70],piercing:[.12,.25,.45],range:[.10,.20,.35],multi:[.15,.30,.50]};
const gemBoost=g=>!g?1:ATTACK_GEMS.has(g.key)?1+(bonus[g.key]||[0,0,0])[quality(g)-1]:g.key==='split'?1+[.10,.20,.35][quality(g)-1]:g.key==='rapid'?1+[.10,.20,.35][quality(g)-1]:1;
const timeCooldown=new Map();const MAX_CHAIN_DEPTH=16,MAX_CHAIN_EVENTS=240,MAX_CHAIN_PENDING=400;

const ELEMENT={fire:'fire',meteor:'fire',lava:'fire',spark:'lightning',lightning:'lightning',storm:'lightning',ice:'ice',blizzard:'ice',nova:'ice',poison:'poison',swamp:'poison',wind:'wind',gravity:'wind'};const reactionTable={'fire+ice':['蒸氣爆炸',.45],'ice+lightning':['導電連鎖',.55],'fire+poison':['毒爆',.65],'lightning+poison':['腐蝕電弧',.45],'fire+wind':['烈焰旋風',.45],'ice+wind':['冰晶風暴',.45]};let reactionGate=0;let uid=1,roots=[],selected=null,inventoryMode=null,previous='play',triggerCount=0,damageCount=0,processing=false,runCount=0;
const node=(type,key,depth=0)=>({id:uid++,type,key,depth,quality:type==='gem'?1:undefined,gem:null,children:[]});
function defaults(){uid=1;const a=node('skill','fire',0);a.gem=node('gem','split');a.gem.quality=3;a.children=[node('skill','lightning',1),node('skill','ice',1)];a.children[0].gem=node('gem','delay');a.children[0].gem.quality=3;a.children[0].children=[node('skill','meteor',2)];a.children[1].gem=node('gem','freeze');a.children[1].gem.quality=3;a.children[1].children=[node('skill','arcane',2)];return [a]}
function load(){try{const raw=localStorage.getItem('sg_chain_v4');if(!raw)return defaults();if(raw.length>350000)throw Error('chain save too large');const v=JSON.parse(raw);if(!Array.isArray(v)||v.length>8)throw Error('invalid roots');const seen=new WeakSet();let count=0;const check=(n,d)=>{if(!n||typeof n!=='object'||Array.isArray(n)||seen.has(n)||d>28||++count>850)return false;seen.add(n);if(!['skill','gem'].includes(n.type)||typeof n.key!=='string'||n.key.length>48)return false;if(n.type==='skill'&&!Object.prototype.hasOwnProperty.call(SK,n.key))return false;if(n.type==='gem'&&!Object.prototype.hasOwnProperty.call(GEM,n.key))return false;if(n.gem!==undefined&&n.gem!==null&&!check(n.gem,d+1))return false;if(n.children!==undefined&&(!Array.isArray(n.children)||n.children.length>24||!n.children.every(c=>check(c,d+1))))return false;return true};if(!v.every(n=>check(n,0)))throw Error('invalid chain nodes');return normalize(v)}catch(e){try{const damaged=localStorage.getItem('sg_chain_v4');if(damaged&&damaged.length<=500000&&!localStorage.getItem('sg_chain_v4_recovery_317'))localStorage.setItem('sg_chain_v4_recovery_317',damaged)}catch(_){}try{console.warn('[SG317] invalid chain save; backup saved if storage available',e.message)}catch(_){}return defaults()}}

roots=load();{const ids=new Set();let nextId=1;const assign=n=>{if(!Number.isSafeInteger(n.id)||n.id<1||ids.has(n.id))n.id=nextId++;ids.add(n.id);nextId=Math.max(nextId,n.id+1);if(n.gem)assign(n.gem);(n.children||[]).forEach(assign)};roots.forEach(assign);uid=Math.max(uid,nextId)}

function makeNode(n){const div=document.createElement('div');div.className='chainNode '+n.type+(selected===n.id?' active':'');const d=n.type==='skill'?SK[n.key]:GEM[n.key];div.innerHTML='<span class="symbol">'+d[0]+'</span><span class="nm">'+d[1]+'</span><span class="sub">'+(n.type==='skill'?'法術 · 第 '+n.depth+' 層':(ATTACK_GEMS.has(n.key)?'攻擊寶石':'條件寶石')+' · 品質 '+(n.quality||1))+'</span>';div.onclick=()=>select(n.id);return div}

x.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.fillStyle='#73e6d7';ctx.beginPath();ctx.arc(w/2,h/2,25,0,Math.PI*2);ctx.fill();for(const e of enemies){if(e.hp<=0)continue;if(state==='play'&&e.slow>0)e.slow=Math.max(0,e.slow-dt);ctx.fillStyle=e.slow?'#9aeaff':'#e69a9d';ctx.beginPath();ctx.arc(e.x,e.y,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#283449';ctx.fillRect(e.x-18,e.y-24,36,4);ctx.fillStyle='#85edaa';ctx.fillRect(e.x-18,e.y-24,36*e.hp/e.maxHp,4)}for(let i=effects.length-1;i>=0;i--){const f=effects[i];if(state==='play')f.life-=dt;if(f.life<=0){effects.splice(i,1);continue}ctx.strokeStyle=f.color;ctx.globalAlpha=f.life/.55*.75;ctx.lineWidth=2;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1-f.life/.8),0,Math.PI*2);ctx.stroke()}for(const v of window.SGChain?.visuals()||[]){ctx.strokeStyle=v.color;ctx.globalAlpha=Math.max(0,Math.min(1,v.life/v.total));ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(v.sx,v.sy);ctx.lineTo(v.tx,v.ty);ctx.stroke()}ctx.globalAlpha=1;requestAnimationFrame(frame)}requestAnimationFrame(frame);})();
