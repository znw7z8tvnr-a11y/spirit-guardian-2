</style></head><body><header><div><h1>✦ 靈境守衛 · 法術實體化 V3</h1><small>怪物受擊｜施法前搖｜專屬形體｜衝擊餘波</small></div><a href="index.html">返回遊戲</a></header><div class="layout"><main><div class="stage"><canvas id="stage" width="960" height="540"></canvas></div><div class="bar"><button id="replay">↻ 重新施放</button><button id="auto">▶ 自動輪播</button><button id="quality">畫質：高</button><button id="pause">暫停</button></div><h2 id="skillTitle"></h2><p id="caption"></p><div class="meta" id="status">載入中</div></main><aside><h2>⚔ 22 種攻擊法術</h2><div id="catalog"></div></aside></div><script>
'use strict';
const C=document.getElementById('stage'),g=C.getContext('2d',{alpha:false}),W=960,H=540,PI=Math.PI,TAU=2*PI;
const skills=[['fire','🔥','爆裂火球','#ff8a42','熾熱火球拖著燃燒尾焰撞擊，爆發火浪並留下焦土。'],['ice','❄','寒冰長槍','#86ecff','六面晶槍貫穿目標，撞擊後冰晶向外崩裂。'],['lightning','⚡','連鎖雷電','#b7a6ff','曲折電弧穿過目標，分支電流持續閃爍。'],['poison','☣','毒霧','#a0ee85','腐蝕毒霧緩慢擴散，氣泡與黏液持續侵蝕。'],['meteor','☄','流星雨','#ff9e55','多顆熔岩隕石自天際墜落，造成多次撞擊。'],['arcane','✦','奧術飛彈','#d4b3ff','奧術彈群旋繞後接連追擊目標。'],['sword','⚔','迴旋月刃','#ffe1a3','金屬月刃高速迴旋，劃出銳利弧光。'],['pierce','➶','穿透射線','#9defff','高能箭矢穿透敵人並形成直線衝擊。'],['earth','⛰','土刺','#d8ba90','地表崩裂，岩石尖刺逐根破土而出。'],['wind','🌪','颶風','#b1f5e5','螺旋氣流捲起岩屑與敵人。'],['beam','🔆','聚焦光束','#ffe6a2','多層光束逐漸聚焦，燒灼目標護甲。'],['orbit','🪐','旋轉法球','#bd9dff','多顆魔力球環繞核心旋轉後同時釋放。'],['lava','🌋','熔岩裂隙','#ff7853','地面撕裂，熔岩從裂縫中噴湧。'],['gravity','🌀','引力漩渦','#a29aff','空間環與碎片被捲入黑色奇點。'],['summon','👻','幽靈守衛','#a7f8ed','靈體從符文門浮現，持劍向前斬擊。'],['thorn','🌿','荊棘護城','#b3f28b','有倒刺的藤蔓從地面盤繞刺穿敵人。'],['spark','✨','火花術','#ffda83','密集的金色火花彈射並形成連環小爆。'],['storm','🌩','雷電風暴','#d1c4ff','厚重雷雲翻滾，雷柱反覆轟擊地面。'],['blizzard','🌨','暴風雪','#c6efff','風雪漩流夾帶片狀冰晶封鎖目標。'],['nova','💠','冰霜新星','#a4f1ff','環形冰牆急速擴張，留下鋸齒冰稜。'],['swamp','🧪','毒沼','#9cdd70','地面湧出毒池，腐蝕氣泡不斷破裂。'],['skeleton','💀','骷髏召喚','#e2d6bb','召喚法陣升起骷髏戰士，揮舞骨刃。']];
const byKey=Object.fromEntries(skills.map(s=>[s[0],s]));let current='fire',time=0,last=performance.now(),auto=false,paused=false,quality='high',shake=0,flash=0,hit=0,cycle=0;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),smooth=(a,b,x)=>{let t=clamp((x-a)/(b-a));return t*t*(3-2*t)},rnd=(n)=>{let x=Math.sin(n*127.1+13.7)*43758.5453;return x-Math.floor(x)};
function line(points,color,width=3,glow=0){g.save();g.lineCap='round';g.lineJoin='round';g.strokeStyle=color;g.lineWidth=width;if(glow){g.shadowColor=color;g.shadowBlur=glow}g.beginPath();points.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();g.restore()}
function disc(x,y,r,color,glow=0){g.save();g.fillStyle=color;if(glow){g.shadowColor=color;g.shadowBlur=glow}g.beginPath();g.arc(x,y,Math.max(0.1,r),0,TAU);g.fill();g.restore()}
function ring(x,y,r,color,width=2,alpha=1,ellipse=.55){g.save();g.globalAlpha=alpha;g.translate(x,y);g.scale(1,ellipse);g.strokeStyle=color;g.lineWidth=width;g.beginPath();g.arc(0,0,Math.max(.1,r),0,TAU);g.stroke();g.restore()}
function poly(points,fill,stroke=null,lw=2,glow=0){g.save();g.beginPath();points.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fillStyle=fill;if(glow){g.shadowColor=fill;g.shadowBlur=glow}g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}g.restore()}
function bolt(x1,y1,x2,y2,seed,width=6){let pts=[];for(let i=0;i<=13;i++){let u=i/13;pts.push([x1+(x2-x1)*u+(i===0||i===13?0:(rnd(seed+i*3)-.5)*38),y1+(y2-y1)*u+(i===0||i===13?0:(rnd(seed+i*7)-.5)*32)])}line(pts,'#6b6eff',width+12,20);line(pts,'#8eeeff',width,18);line(pts,'#fff',Math.max(1,width*.3),8)}
function crystal(x,y,scale,angle=0,col='#8ceaff'){g.save();g.translate(x,y);g.rotate(angle);g.scale(scale,scale);poly([[0,-72],[23,-12],[14,48],[0,76],[-14,48],[-23,-12]],'#baf6ff','#f6ffff',3,15);poly([[0,-72],[23,-12],[0,56]],col);poly([[0,-72],[-23,-12],[0,56]],'#417fba');line([[0,-68],[0,62]],'#e9ffff',2);g.restore()}
function flame(x,y,r,seed=0){g.save();g.translate(x,y);g.rotate(seed);g.shadowColor='#ff4b13';g.shadowBlur=22;for(let j=0;j<3;j++){let pts=[];for(let i=0;i<22;i++){let a=i*TAU/22,rr=r*(1-j*.27)*(0.72+.24*Math.sin(i*3.2+seed*7+j));pts.push([Math.cos(a)*rr,Math.sin(a)*rr])}poly(pts,['#ff4219','#ffb22b','#fff4bd'][j])}g.restore()}
function dust(x,y,amount,t,color,spread=170){let count=quality==='low'?Math.ceil(amount*.4):quality==='medium'?Math.ceil(amount*.65):amount;g.save();for(let i=0;i<count;i++){let a=i*2.39996+rnd(i+cycle)*.7,sp=.2+rnd(i*5+cycle)*.8,u=clamp((t-.4)*1.3);if(u<=0)continue;let r=u*spread*sp,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r*.6-25*u*u;g.globalAlpha=(1-u)*(.4+rnd(i)*.6);disc(px,py,1.5+3*rnd(i*2),color,5)}g.restore()}
function sigil(x,y,t,col,size=85){g.save();g.translate(x,y);g.rotate(t*.6);g.globalAlpha=clamp(1-t*1.3);ring(0,0,size,col,3,1,1);ring(0,0,size*.67,col,2,1,1);for(let i=0;i<8;i++){let a=i*TAU/8;disc(Math.cos(a)*size*.85,Math.sin(a)*size*.85,4,col,8)}g.restore()}
function enemy(t){const x=690,y=292;g.save();g.translate(x,y);let knock=smooth(.43,.52,t)*(1-smooth(.72,1.05,t))*18;g.translate(knock,0);if(hit>0)g.translate((rnd(Math.floor(t*100))-0.5)*hit*8,0);g.fillStyle='#0009';g.beginPath();g.ellipse(0,78,58,17,0,0,TAU);g.fill();g.save();g.globalAlpha=.35;ring(0,72,72,'#d36dff',3,1,.3);g.restore();poly([[-43,-12],[-33,-62],[0,-78],[37,-55],[44,-5],[25,56],[-25,56]],'#27354f','#5c7798',5);poly([[-33,-59],[0,-78],[0,43],[-22,32]],'#364765');poly([[0,-78],[36,-55],[44,-5],[25,56],[0,43]],'#1b2a41');poly([[-42,-6],[-63,11],[-48,37],[-25,22]],'#4c5877','#9aa6c6');poly([[42,-6],[63,11],[48,37],[25,22]],'#4c5877','#9aa6c6');poly([[-27,-62],[-15,-85],[15,-85],[27,-62],[17,-36],[-17,-36]],'#63728e','#b5bed8');poly([[-14,-64],[-2,-57],[-14,-51]],'#ff4b87',null,1,10);poly([[14,-64],[2,-57],[14,-51]],'#ff4b87',null,1,10);line([[-20,-18],[18,-18]],'#9b7aa4',4);g.restore()}
function background(t){let grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#0b1633');grad.addColorStop(.65,'#152043');grad.addColorStop(1,'#070e21');g.fillStyle=grad;g.fillRect(0,0,W,H);for(let i=0;i<45;i++){let x=rnd(i)*W,y=rnd(i*4)*H*.75;disc(x,y,1+rnd(i*2)*1.5,'#a9d7ff',3)}g.fillStyle='#17243c';g.beginPath();g.moveTo(0,400);for(let i=0;i<=12;i++)g.lineTo(i*90,360+35*Math.sin(i*2.3));g.lineTo(W,H);g.lineTo(0,H);g.fill();for(let i=0;i<8;i++){let x=i*145-20;poly([[x,360],[x+27,330],[x+54,360],[x+48,490],[x+4,490]],'#14213b','#253d5e',2)}g.fillStyle='#11182b';g.fillRect(0,405,W,135);for(let i=0;i<14;i++)line([[i*80,408],[i*80-20,H]],'#2a3451',1);ring(330,365,108,'#3886b7',2,.55);ring(330,365,68,'#6ac9e3',2,.45);ring(690,375,90,'#9e4ab5',2,.45);g.save();g.translate(328,285);g.shadowColor='#55d5ff';g.shadowBlur=24;poly([[0,-90],[29,-35],[0,20],[-29,-35]],'#71e4ff','#d9ffff',3);poly([[0,-90],[29,-35],[0,20]],'#3178bd');g.restore();g.fillStyle='#aecfff';g.font='bold 15px system-ui';g.fillText('守護晶核',285,448);g.fillText('深淵裝甲獸',640,448)}
function wave(x,y,t,col,max=200){let u=smooth(.38,.9,t);if(u>0&&u<1)ring(x,y,10+max*u,col,7*(1-u),1-u,.42)}
function castSpell(k,t){const col=byKey[k][3],x=690,y=295,cx=330,cy=285;let charge=smooth(0,.32,t),impact=smooth(.43,.54,t),fade=1-smooth(.8,1.55,t),travel=smooth(.22,.48,t);if(t<.42){sigil(cx,cy,t*.5,col,55+charge*60);ring(cx,cy,35+charge*80,col,3,.8)}if(t>.44&&t<1.5){wave(x,y,t,col);dust(x,y,40,t,col,210)}
 switch(k){
 case 'fire':case 'spark':case 'meteor':{let n=k==='meteor'?5:k==='spark'?9:1;for(let i=0;i<n;i++){let delay=k==='meteor'?i*.09:k==='spark'?i*.035:0,u=smooth(.14+delay,.48+delay,t),xx=k==='meteor'?450+i*55:cx+(x-cx)*u,yy=k==='meteor'? -100+470*u+(i%2)*35:cy+(y-cy)*u-70*Math.sin(u*PI);if(u<1){flame(xx,yy,k==='meteor'?30:k==='spark'?12:43,t*5+i);for(let j=0;j<4;j++)disc(xx-25-j*15,yy+6*Math.sin(j+t*8),5+j*2,'#ff8539',12)}else if(t<.85+delay){flame(k==='meteor'?450+i*55:x,k==='meteor'?300+(i%2)*30:y,(k==='spark'?22:55)*(1-smooth(.58+delay,.86+delay,t)),t*9+i)}}if(k==='fire'||k==='meteor'){if(t>.5){g.save();g.globalAlpha=fade*.75;ring(x,y,50+impact*125,'#ff7637',12,1,.38);g.restore()}}break}
 case 'ice':case 'nova':case 'blizzard':{if(k==='ice'){if(travel<1){crystal(cx+(x-cx)*travel,cy-20+(y-cy)*travel,1.15,PI/2);for(let j=0;j<4;j++)crystal(cx+(x-cx)*travel-25-j*18,cy-20+(y-cy)*travel,0.2+j*.06,PI/2)}else{for(let j=0;j<12;j++){let a=j*TAU/12,rad=impact*(90+j%3*17);crystal(x+Math.cos(a)*rad,y+Math.sin(a)*rad*.6,.35+(.4*fade),a+PI/2)}}}else if(k==='nova'){for(let j=0;j<18;j++){let a=j*TAU/18,rad=impact*180;crystal(x+Math.cos(a)*rad,y+Math.sin(a)*rad*.45,.35+fade*.65,a)}ring(x,y,impact*190,'#a4f3ff',5,fade)}else{for(let j=0;j<95*(quality==='low'?.4:1);j++){let px=(rnd(j*3)+t*.22*(j%3+1))*W%W,py=(rnd(j*7)+t*.4)*H%H;line([[px,py],[px-20,py+12]],'#b9efff',1.5)}}break}
 case 'lightning':case 'storm':{let n=k==='storm'?6:3;for(let j=0;j<n;j++){let st=.26+j*.14;if(t>st&&t<st+.22){if(k==='storm'){disc(580+j*35,95,85,'#37435d',18);bolt(600+j*24,100,x+(j-2)*30,y,cycle*20+j,8)}else bolt(cx,cy,x+(j-1)*40,y+(j%2)*40,cycle*20+j,7)}}break}
 case 'sword':case 'pierce':{let u=travel;for(let j=0;j<(k==='sword'?3:1);j++){let xx=cx+(x-cx)*u,yy=cy+(y-cy)*u+Math.sin(t*17+j*2)*25;g.save();g.translate(xx,yy);g.rotate(k==='sword'?t*15+j*2:PI/2);poly([[0,-75],[24,-22],[12,25],[0,70],[-12,25],[-24,-22]],'#f5faff','#f9d28a',4,20);poly([[0,-75],[24,-22],[0,55]],'#ffcf78');g.restore();line([[xx-80,yy],[xx-12,yy]],col,5,18)}break}
 case 'earth':case 'lava':case 'thorn':{let count=k==='earth'?9:k==='thorn'?8:7;for(let i=0;i<count;i++){let xx=510+i*33,u=smooth(.28+i*.045,.53+i*.045,t),height=(k==='lava'?50:105)*u*fade;if(k==='earth'){poly([[xx-16,380],[xx,380-height],[xx+19,380]],'#887c73','#e4c7a5',3)}else if(k==='thorn'){line([[xx,390],[xx+Math.sin(i+t*5)*24,390-height*.65],[xx+Math.cos(i)*15,390-height]],'#63b45d',9,7);for(let j=0;j<3;j++)poly([[xx-5+j*8,360-j*13],[xx+15+j*8,348-j*13],[xx+3+j*8,365-j*13]],'#b9e985')}else{line([[xx,387],[xx+Math.sin(i)*8,360-height]],'#ff5d1d',15,25);flame(xx,365-height,18,t+i)}}break}
 case 'wind':case 'gravity':{for(let j=0;j<9;j++){let r=20+j*15*(k==='gravity'?fade:1),a=t*4+j*.8;g.save();g.translate(x,y);g.rotate(a);g.strokeStyle=k==='gravity'?'#9d92f4':'#b1f5e5';g.lineWidth=5-j*.25;g.globalAlpha=fade*.85;g.beginPath();g.ellipse(0,0,r,r*.48,0,.2,PI*1.55);g.stroke();g.restore()}if(k==='gravity'){disc(x,y,36+impact*20,'#02030b',32);ring(x,y,50+impact*25,'#e5baff',7,fade,1)}else{for(let j=0;j<20;j++){let a=j*.75+t*5,r=30+(j%6)*20;disc(x+Math.cos(a)*r,y+Math.sin(a)*r*.6,4,'#c4e5e8',5)}}break}
 case 'beam':{if(t>.24){let u=smooth(.24,.48,t),w=8+u*28*fade;line([[cx,cy],[cx+(x-cx)*u,cy+(y-cy)*u]],'#fff3a0',w+25,30);line([[cx,cy],[cx+(x-cx)*u,cy+(y-cy)*u]],'#fff',w,18);disc(x,y,35*impact*fade,'#fff3aa',30)}break}
 case 'arcane':case 'orbit':{let n=k==='arcane'?8:5;for(let j=0;j<n;j++){let a=j*TAU/n+t*7,u=k==='arcane'?smooth(.22+j*.035,.52+j*.035,t):smooth(.5,.8,t),xx=cx+(x-cx)*u+Math.cos(a)*65*(1-u),yy=cy+(y-cy)*u+Math.sin(a)*50*(1-u);disc(xx,yy,13,col,24);disc(xx,yy,5,'#fff',10)}break}
 case 'poison':case 'swamp':{g.save();g.globalAlpha=.7*fade;for(let j=0;j<10;j++){let a=j*TAU/10,r=impact*(k==='swamp'?140:95),xx=x+Math.cos(a)*r,yy=y+Math.sin(a)*r*.45;disc(xx,yy,22+8*Math.sin(t*7+j),'#3b8f4b',14)}g.restore();for(let j=0;j<22;j++){let xx=x+(rnd(j*7)-.5)*180,yy=y+40-(t*40+j*23)%130;disc(xx,yy,3+rnd(j)*7,'#a3ff91',8)}break}
 case 'summon':case 'skeleton':{let u=smooth(.23,.48,t);sigil(x,y+65,t*.5,col,95);g.save();g.translate(x,y+65-(u*120));g.globalAlpha=u*fade;if(k==='summon'){g.fillStyle='#a2eaff88';g.beginPath();g.moveTo(-36,-55);g.quadraticCurveTo(0,-110,35,-55);g.lineTo(50,65);g.quadraticCurveTo(0,35,-50,65);g.closePath();g.fill();disc(-12,-58,5,'#fff',12);disc(12,-58,5,'#fff',12);line([[25,-15],[55,-65],[85,-35]],'#e2ffff',9,20)}else{disc(0,-55,28,'#e9e3d6',8);disc(-10,-57,7,'#1c1622');disc(10,-57,7,'#1c1622');line([[-35,0],[35,0]],'#e9e3d6',11);line([[0,-30],[0,45]],'#e9e3d6',12);line([[-15,10],[-36,40]],'#e9e3d6',8);line([[15,10],[40,-40]],'#e9e3d6',8);line([[-12,42],[-25,70]],'#e9e3d6',8);line([[12,42],[25,70]],'#e9e3d6',8);line([[40,-40],[65,-85]],'#d8d6d1',6,12)}g.restore();break}
 }
 if(t>.46&&t<.68){g.save();g.globalAlpha=(1-smooth(.46,.68,t))*.8;disc(x,y,28+impact*55,'#fff',35);g.restore()}
}
function render(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){time+=dt;if(auto&&time>2.65){choose(skills[(skills.findIndex(s=>s[0]===current)+1)%skills.length][0]);}if(time>.48&&time<.57){shake=8;hit=1;flash=.13}}if(hit>0)hit=Math.max(0,hit-dt*7);shake*=.87;flash=Math.max(0,flash-dt*1.4);g.save();g.translate((rnd(Math.floor(now*10))-.5)*shake,(rnd(Math.floor(now*12))-.5)*shake);background(time);enemy(time);castSpell(current,time);g.restore();if(flash>0){g.fillStyle='rgba(255,255,255,'+flash+')';g.fillRect(0,0,W,H)}requestAnimationFrame(render)}
const catalog=document.getElementById('catalog'),title=document.getElementById('skillTitle'),caption=document.getElementById('caption'),status=document.getElementById('status');for(const s of skills){let b=document.createElement('button');b.textContent=s[1]+' '+s[2];b.dataset.key=s[0];b.onclick=()=>choose(s[0]);catalog.appendChild(b)}function choose(k){current=k;time=0;cycle++;hit=0;shake=0;flash=0;title.textContent=byKey[k][1]+' '+byKey[k][2];title.style.color=byKey[k][3];caption.textContent=byKey[k][4];status.textContent='V3 · 專屬法術形體 · 怪物受擊回饋';for(let b of catalog.children)b.classList.toggle('active',b.dataset.key===k)}document.getElementById('replay').onclick=()=>choose(current);document.getElementById('auto').onclick=e=>{auto=!auto;e.currentTarget.textContent=auto?'■ 停止輪播':'▶ 自動輪播';if(auto)time=2.4};document.getElementById('quality').onclick=e=>{quality=quality==='high'?'medium':quality==='medium'?'low':'high';e.currentTarget.textContent='畫質：'+({high:'高',medium:'中',low:'低'}[quality])};document.getElementById('pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶ 繼續':'暫停'};C.onclick=()=>choose(current);choose('fire');requestAnimationFrame(render);
